                  - paragraph [ref=f3e75]:
                    - strong [ref=f3e76]: ※납품 이후라도 저작권·라이선스·생성형 AI 사용과 관련된 분쟁 또는 법적 문제가 발생할 경우, 모든 민·형사상 책임은 전적으로 해당 디자이너 본인에게 귀속되며, 의뢰자는 이로 인한 손해에 대해 손해배상 청구 등 일체의 법적 조치를 취할 수 있습니다.
