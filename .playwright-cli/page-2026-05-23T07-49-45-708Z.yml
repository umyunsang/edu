                  - paragraph [ref=f3e85]: 1) 수상작으로 선정된 참여자와 의뢰자의 저작재산권 (2차적 저작물 작성권 포함) 양도 동의가 이루어진 아이디어는 의뢰자에 귀속됩니다.
                  - paragraph [ref=f3e86]: 2) 수상자는 저작재산권 및 2차적 저작물 작성권 양도에 동의하는 계약을 별도 체결할 수 있으며, 본 공모전에 응모하는 참여자는 해당 내용에 동의한 것으로 간주합니다.
                  - paragraph [ref=f3e87]: 3) 수상자에게 주어지는 상금은 저작재산권 양도에 따른 비용입니다.
                  - paragraph [ref=f3e88]: 4) 수상이 확정 된 작품은 반환되지 않습니다.
                  - paragraph [ref=f3e89]: 5) 응모 작품은 반드시 본인의 창작물이어야 하며 타인의 저작권을 침해하거나 제 3자에 대한 명예훼손 등의 문제가 발생할 경우 민/형사상의 책임은 본인에게 있습니다. 발표 후 저작권 침해 등에 대한 문제 확인 시 수상 취소 및 상금 환수 조치 합니다.
                  - paragraph [ref=f3e90]: 6) 기타 세부 사항은 라우드소싱의 [개인정보 처리방침] 및 [작품 등록 약관]을 참조하시기 바랍니다
