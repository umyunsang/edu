<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="system-ui,sans-serif">
  <style>
    .c{fill:#fff;stroke:#2c3e50}
    .src{fill:#eaf2fb;stroke:#2e86de}
    .win{fill:#fff7d6;stroke:#d4a017;stroke-width:2.5}
    .ker{fill:#e6f7e6;stroke:#27ae60}
    .out{fill:#ffd6d6;stroke:#c0392b}
    .res{fill:#ffeb99;stroke:#d4a017;stroke-width:2}
    .t{font-size:13px;text-anchor:middle;font-family:monospace}
    .tb{font-size:15px;font-weight:bold}
    .lab{font-size:13px}
    .eq{font-size:14px;font-family:monospace}
  </style>
  <text class="tb" x="430" y="22" text-anchor="middle">컨볼루션 필터링: 3×3 커널을 영상 위에서 미끄러뜨리기</text>
  <text class="lab" x="30" y="44">규칙: 창 안 9개 픽셀 × 커널 9개 값을 모두 곱해 더한 값이 결과 영상의 한 픽셀이 된다.</text>

  <!-- Source image (5x5) with highlighted 3x3 window -->
  <g transform="translate(40,70)">
    <text class="tb" x="100" y="0">원본 영상 f</text>
    <g transform="translate(0,15)">
      <!-- draw 5x5 -->
      <g>
        <rect class="src" x="0" y="0" width="40" height="40"/><text class="t" x="20" y="25">10</text>
        <rect class="src" x="40" y="0" width="40" height="40"/><text class="t" x="60" y="25">20</text>
        <rect class="src" x="80" y="0" width="40" height="40"/><text class="t" x="100" y="25">30</text>
        <rect class="src" x="120" y="0" width="40" height="40"/><text class="t" x="140" y="25">40</text>
        <rect class="src" x="160" y="0" width="40" height="40"/><text class="t" x="180" y="25">50</text>
      </g>
      <g>
        <rect class="src" x="0" y="40" width="40" height="40"/><text class="t" x="20" y="65">12</text>
        <rect class="win" x="40" y="40" width="40" height="40"/><text class="t" x="60" y="65">22</text>
        <rect class="win" x="80" y="40" width="40" height="40"/><text class="t" x="100" y="65">32</text>
        <rect class="win" x="120" y="40" width="40" height="40"/><text class="t" x="140" y="65">42</text>
        <rect class="src" x="160" y="40" width="40" height="40"/><text class="t" x="180" y="65">52</text>
      </g>
      <g>
        <rect class="src" x="0" y="80" width="40" height="40"/><text class="t" x="20" y="105">14</text>
        <rect class="win" x="40" y="80" width="40" height="40"/><text class="t" x="60" y="105">24</text>
        <rect class="win" x="80" y="80" width="40" height="40"/><text class="t" x="100" y="105">34</text>
        <rect class="win" x="120" y="80" width="40" height="40"/><text class="t" x="140" y="105">44</text>
        <rect class="src" x="160" y="80" width="40" height="40"/><text class="t" x="180" y="105">54</text>
      </g>
      <g>
        <rect class="src" x="0" y="120" width="40" height="40"/><text class="t" x="20" y="145">16</text>
        <rect class="win" x="40" y="120" width="40" height="40"/><text class="t" x="60" y="145">26</text>
        <rect class="win" x="80" y="120" width="40" height="40"/><text class="t" x="100" y="145">36</text>
        <rect class="win" x="120" y="120" width="40" height="40"/><text class="t" x="140" y="145">46</text>
        <rect class="src" x="160" y="120" width="40" height="40"/><text class="t" x="180" y="145">56</text>
      </g>
      <g>
        <rect class="src" x="0" y="160" width="40" height="40"/><text class="t" x="20" y="185">18</text>
        <rect class="src" x="40" y="160" width="40" height="40"/><text class="t" x="60" y="185">28</text>
        <rect class="src" x="80" y="160" width="40" height="40"/><text class="t" x="100" y="185">38</text>
        <rect class="src" x="120" y="160" width="40" height="40"/><text class="t" x="140" y="185">48</text>
        <rect class="src" x="160" y="160" width="40" height="40"/><text class="t" x="180" y="185">58</text>
      </g>
    </g>
    <text class="lab" x="100" y="230" text-anchor="middle">노란 창(3×3)이 현재 계산 중</text>
  </g>

  <!-- Kernel (3x3 Gaussian-ish) -->
  <g transform="translate(290,140)">
    <text class="tb" x="60" y="-10">커널 h (블러)</text>
    <g>
      <rect class="ker" x="0" y="0" width="40" height="40"/><text class="t" x="20" y="25">1</text>
      <rect class="ker" x="40" y="0" width="40" height="40"/><text class="t" x="60" y="25">2</text>
      <rect class="ker" x="80" y="0" width="40" height="40"/><text class="t" x="100" y="25">1</text>
    </g>
    <g>
      <rect class="ker" x="0" y="40" width="40" height="40"/><text class="t" x="20" y="65">2</text>
      <rect class="ker" x="40" y="40" width="40" height="40"/><text class="t" x="60" y="65">4</text>
      <rect class="ker" x="80" y="40" width="40" height="40"/><text class="t" x="100" y="65">2</text>
    </g>
    <g>
      <rect class="ker" x="0" y="80" width="40" height="40"/><text class="t" x="20" y="105">1</text>
      <rect class="ker" x="40" y="80" width="40" height="40"/><text class="t" x="60" y="105">2</text>
      <rect class="ker" x="80" y="80" width="40" height="40"/><text class="t" x="100" y="105">1</text>
    </g>
    <text class="lab" x="60" y="140" text-anchor="middle">합 = 16 → 1/16로 정규화</text>
  </g>

  <!-- × -->
  <text class="tb" x="260" y="200" font-size="22">×</text>
  <text class="tb" x="425" y="200" font-size="22">=</text>

  <!-- Calculation -->
  <g transform="translate(450,70)">
    <text class="tb" x="0" y="0">중앙 픽셀 계산 (점곱 후 정규화)</text>
    <g transform="translate(0,18)" class="eq">
      <text x="0" y="15">(22·1 + 32·2 + 42·1) = 22+64+42 = 128</text>
      <text x="0" y="35">(24·2 + 34·4 + 44·2) = 48+136+88 = 272</text>
      <text x="0" y="55">(26·1 + 36·2 + 46·1) = 26+72+46 = 144</text>
      <text x="0" y="80" font-weight="bold">합: 128 + 272 + 144 = 544</text>
      <text x="0" y="100" font-weight="bold">결과: 544 / 16 = 34</text>
    </g>
    <g transform="translate(0,180)">
      <rect class="res" x="0" y="0" width="60" height="50"/><text class="t" x="30" y="30" font-size="18" font-weight="bold">34</text>
      <text class="lab" x="75" y="30">← 결과 영상 g 의 (2,2)</text>
    </g>
    <text class="lab" x="0" y="270">다음 단계: 창을 오른쪽으로 한 칸 밀고 반복.</text>
    <text class="lab" x="0" y="290">경계 픽셀은 zero-padding, replicate 등으로 처리.</text>
  </g>

  <g transform="translate(30,400)">
    <text class="lab" x="0" y="0" fill="#c0392b" font-weight="bold">커널만 바꾸면 블러(평균/가우시안), 샤프닝, 엠보싱, 에지(Sobel) 등 다양한 효과가 같은 틀에서 나온다.</text>
  </g>
</svg>
