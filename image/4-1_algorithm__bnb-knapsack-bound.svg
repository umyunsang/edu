<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520">
  <rect width="1040" height="520" fill="#f8fafc"/>
  <text x="42" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">0-1 Knapsack 분기한정</text>
  <text x="42" y="84" font-family="Arial, sans-serif" font-size="16" fill="#475569">상한값은 분할 배낭처럼 남은 용량을 부분적으로 채워 계산한다. 상한이 현재 best보다 낮으면 가지치기한다.</text>

  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="56" y="125" width="255" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="82" y="160" font-size="19" font-weight="700" fill="#334155">슬라이드 예제</text>
    <text x="82" y="195" fill="#111827">W = 16</text>
    <text x="82" y="224" fill="#111827">1: p40, w2, r20</text>
    <text x="82" y="252" fill="#111827">2: p30, w5, r6</text>
    <text x="82" y="280" fill="#111827">3: p50, w10, r5</text>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="15">
    <rect x="450" y="125" width="150" height="70" rx="10" fill="#111827"/>
    <text x="525" y="153" fill="#ffffff" font-weight="700">root</text>
    <text x="525" y="177" fill="#cbd5e1">bound 115</text>

    <line x1="500" y1="195" x2="360" y2="265" stroke="#64748b" stroke-width="3"/>
    <line x1="550" y1="195" x2="700" y2="265" stroke="#64748b" stroke-width="3"/>

    <rect x="285" y="265" width="160" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="365" y="294" font-weight="700" fill="#14532d">item1 포함</text>
    <text x="365" y="319" fill="#334155">p=40, w=2</text>
    <text x="365" y="340" fill="#334155">bound 유지</text>

    <rect x="645" y="265" width="170" height="82" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="730" y="294" font-weight="700" fill="#991b1b">item1 제외</text>
    <text x="730" y="319" fill="#334155">최대 후보 감소</text>
    <text x="730" y="340" fill="#334155">best와 비교</text>

    <line x1="365" y1="347" x2="365" y2="405" stroke="#64748b" stroke-width="3"/>
    <rect x="285" y="405" width="160" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="365" y="433" font-weight="700" fill="#92400e">1 + 3 선택</text>
    <text x="365" y="458" fill="#334155">profit 90, weight 12</text>

    <rect x="590" y="398" width="300" height="78" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="740" y="428" font-weight="700" fill="#334155">가지치기 조건</text>
    <text x="740" y="454" fill="#334155">bound &lt;= 현재 best 이면 확장하지 않음</text>
  </g>
</svg>
