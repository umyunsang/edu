<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="system-ui,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7a8a"/>
    </marker>
    <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>
  <style>
    .node{fill:#eaf2fb;stroke:#2c3e50;stroke-width:1.5}
    .root{fill:#fff2cc;stroke:#d4a017;stroke-width:2}
    .ok{fill:#d0f5d0;stroke:#27ae60;stroke-width:1.8}
    .cut{fill:#ffcdd2;stroke:#c62828;stroke-width:1.8;stroke-dasharray:4 3}
    .sol{fill:#fff7d6;stroke:#b08a1f;stroke-width:2}
    .ln{stroke:#6b7a8a;stroke-width:1.3;fill:none}
    .back{stroke:#c62828;stroke-width:1.3;fill:none;stroke-dasharray:5 3}
    .num{font-size:13px;font-weight:bold;text-anchor:middle;fill:#c62828}
    .t{font-size:13px;text-anchor:middle;fill:#1e2a38}
    .x{font-size:18px;font-weight:bold;text-anchor:middle;fill:#c62828}
    .lab{font-size:12px;fill:#4a5b6c;text-anchor:middle}
    .tb{font-size:16px;font-weight:bold;text-anchor:middle;fill:#1e2a38}
    .th{font-size:14px;font-weight:bold;fill:#1e2a38}
    .note{fill:#fff7d6;stroke:#b08a1f;stroke-width:1.5}
    .mc{font-size:13px;text-anchor:middle;fill:#1e2a38}
  </style>

  <text class="tb" x="600" y="30">백트래킹 DFS 일반형: 상태공간 트리 가지치기 + DFS 방문 순서</text>

  <!-- Root -->
  <g>
    <circle class="root" cx="600" cy="80" r="26"/>
    <text class="t" x="600" y="85">root</text>
    <text class="num" x="635" y="70">1</text>
  </g>

  <!-- Depth 1: 3 children A, B, C -->
  <g>
    <circle class="node" cx="280" cy="200" r="24"/>
    <text class="t" x="280" y="205">A</text>
    <text class="num" x="315" y="192">2</text>
  </g>
  <g>
    <circle class="node" cx="600" cy="200" r="24"/>
    <text class="t" x="600" y="205">B</text>
    <text class="num" x="635" y="192">7</text>
  </g>
  <g>
    <circle class="node" cx="920" cy="200" r="24"/>
    <text class="t" x="920" y="205">C</text>
    <text class="num" x="955" y="192">11</text>
  </g>

  <path class="ln" d="M580,100 L300,180" marker-end="url(#ar)"/>
  <path class="ln" d="M600,106 L600,176" marker-end="url(#ar)"/>
  <path class="ln" d="M620,100 L900,180" marker-end="url(#ar)"/>

  <!-- Depth 2 under A: A1 (ok), A2 (cut) -->
  <g>
    <circle class="node" cx="180" cy="330" r="22"/>
    <text class="t" x="180" y="335">A1</text>
    <text class="num" x="212" y="322">3</text>
  </g>
  <g>
    <circle class="cut" cx="380" cy="330" r="22"/>
    <text class="x" x="380" y="337">✗</text>
    <text class="lab" x="380" y="362">가지치기 (제약 위반)</text>
  </g>
  <path class="ln" d="M265,220 L195,310" marker-end="url(#ar)"/>
  <path class="ln" d="M295,220 L370,310" marker-end="url(#ar)"/>

  <!-- Depth 2 under B: B1 (cut), B2 (ok) -->
  <g>
    <circle class="cut" cx="520" cy="330" r="22"/>
    <text class="x" x="520" y="337">✗</text>
    <text class="lab" x="520" y="362">bound &lt; best</text>
  </g>
  <g>
    <circle class="node" cx="680" cy="330" r="22"/>
    <text class="t" x="680" y="335">B2</text>
    <text class="num" x="712" y="322">8</text>
  </g>
  <path class="ln" d="M585,220 L535,310" marker-end="url(#ar)"/>
  <path class="ln" d="M615,220 L670,310" marker-end="url(#ar)"/>

  <!-- Depth 2 under C: C1 (ok) -->
  <g>
    <circle class="node" cx="920" cy="330" r="22"/>
    <text class="t" x="920" y="335">C1</text>
    <text class="num" x="952" y="322">12</text>
  </g>
  <path class="ln" d="M920,224 L920,308" marker-end="url(#ar)"/>

  <!-- Depth 3 under A1: 3 leaves -->
  <g>
    <circle class="ok" cx="100" cy="470" r="20"/>
    <text class="t" x="100" y="474">해A</text>
    <text class="num" x="128" y="462">4</text>
  </g>
  <g>
    <circle class="cut" cx="180" cy="470" r="20"/>
    <text class="x" x="180" y="477">✗</text>
  </g>
  <g>
    <circle class="sol" cx="260" cy="470" r="20"/>
    <text class="t" x="260" y="474">★답</text>
    <text class="num" x="288" y="462">5</text>
  </g>
  <path class="ln" d="M170,348 L110,452" marker-end="url(#ar)"/>
  <path class="ln" d="M180,352 L180,450" marker-end="url(#ar)"/>
  <path class="ln" d="M190,348 L250,452" marker-end="url(#ar)"/>

  <!-- Depth 3 under B2: 2 leaves -->
  <g>
    <circle class="cut" cx="620" cy="470" r="20"/>
    <text class="x" x="620" y="477">✗</text>
  </g>
  <g>
    <circle class="ok" cx="740" cy="470" r="20"/>
    <text class="t" x="740" y="474">해B</text>
    <text class="num" x="768" y="462">9</text>
  </g>
  <path class="ln" d="M670,348 L625,452" marker-end="url(#ar)"/>
  <path class="ln" d="M690,348 L735,452" marker-end="url(#ar)"/>

  <!-- Depth 3 under C1 -->
  <g>
    <circle class="ok" cx="920" cy="470" r="20"/>
    <text class="t" x="920" y="474">해C</text>
    <text class="num" x="948" y="462">13</text>
  </g>
  <path class="ln" d="M920,352 L920,450" marker-end="url(#ar)"/>

  <!-- Backtrack arrows (back to parent) -->
  <path class="back" d="M100,490 C 60,500 60,350 170,330"/>
  <path class="back" d="M260,490 C 300,490 300,400 285,222"/>
  <path class="back" d="M740,490 C 780,490 680,250 615,205"/>
  <text class="lab" x="160" y="520" fill="#c62828">↑ 백트랙 = 부모로 복귀</text>

  <!-- 번호 범례 -->
  <g>
    <rect class="note" x="40" y="550" width="1120" height="140" rx="8"/>
    <text class="th" x="55" y="575">알고리즘 개요</text>
    <text class="mc" x="600" y="602">DFS 방문 순서 (빨간 번호): 1(root) → 2(A) → 3(A1) → 4(해A) → 5(★답) → ... → 13(해C)</text>
    <text class="mc" x="600" y="628">✗ 표시 = 제약 위반 or bound-best (분기한정) → 그 가지 전체 탐색 생략</text>
    <text class="mc" x="600" y="654">점선 빨간 화살표 = 백트랙(부모로 복귀) → 형제 노드 탐색 or 조부모로 다시 복귀</text>
    <text class="mc" x="600" y="680">최악 O(분기수^깊이) 이지만 가지치기로 실제 탐색 공간은 크게 축소됨</text>
  </g>
</svg>
