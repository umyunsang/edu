<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560">
  <rect width="1040" height="560" fill="#f8fafc"/>
  <text x="42" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Huffman 병합 순서</text>
  <text x="42" y="84" font-family="Arial, sans-serif" font-size="16" fill="#475569">매번 빈도가 가장 작은 두 노드를 합친다. 합친 노드는 다시 우선순위 큐에 들어간다.</text>

  <g font-family="Arial, sans-serif" font-size="15">
    <rect x="52" y="120" width="260" height="350" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="82" y="155" font-size="20" font-weight="700" fill="#334155">슬라이드 빈도</text>
    <text x="82" y="190" fill="#111827">A:24  B:3  C:8  D:10</text>
    <text x="82" y="220" fill="#111827">E:33  F:6  G:4  H:12</text>
    <text x="82" y="270" font-weight="700" fill="#334155">병합</text>
    <text x="82" y="300" fill="#111827">B3 + G4 = 7</text>
    <text x="82" y="326" fill="#111827">F6 + 7 = 13</text>
    <text x="82" y="352" fill="#111827">C8 + D10 = 18</text>
    <text x="82" y="378" fill="#111827">H12 + 13 = 25</text>
    <text x="82" y="404" fill="#111827">A24 + 18 = 42</text>
    <text x="82" y="430" fill="#111827">25 + E33 = 58</text>
    <text x="82" y="456" fill="#111827">42 + 58 = 100</text>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="15" stroke="#64748b" stroke-width="2">
    <circle cx="660" cy="130" r="34" fill="#111827"/><text x="660" y="136" fill="#ffffff" font-weight="700">100</text>
    <line x1="640" y1="157" x2="535" y2="220"/><line x1="680" y1="157" x2="795" y2="220"/>
    <circle cx="525" cy="240" r="32" fill="#fef3c7"/><text x="525" y="246" fill="#111827" font-weight="700">42</text>
    <circle cx="805" cy="240" r="32" fill="#dcfce7"/><text x="805" y="246" fill="#111827" font-weight="700">58</text>

    <line x1="505" y1="265" x2="430" y2="325"/><line x1="545" y1="265" x2="610" y2="325"/>
    <circle cx="420" cy="345" r="30" fill="#dbeafe"/><text x="420" y="351" fill="#111827" font-weight="700">A24</text>
    <circle cx="620" cy="345" r="30" fill="#fde68a"/><text x="620" y="351" fill="#111827" font-weight="700">18</text>
    <line x1="602" y1="370" x2="555" y2="420"/><line x1="638" y1="370" x2="690" y2="420"/>
    <circle cx="545" cy="438" r="28" fill="#ffffff"/><text x="545" y="444" fill="#111827">C8</text>
    <circle cx="700" cy="438" r="28" fill="#ffffff"/><text x="700" y="444" fill="#111827">D10</text>

    <line x1="785" y1="265" x2="725" y2="325"/><line x1="825" y1="265" x2="895" y2="325"/>
    <circle cx="715" cy="345" r="30" fill="#fce7f3"/><text x="715" y="351" fill="#111827" font-weight="700">25</text>
    <circle cx="905" cy="345" r="30" fill="#ede9fe"/><text x="905" y="351" fill="#111827" font-weight="700">E33</text>
    <line x1="697" y1="370" x2="650" y2="420"/><line x1="733" y1="370" x2="790" y2="420"/>
    <circle cx="640" cy="438" r="28" fill="#ffffff"/><text x="640" y="444" fill="#111827">H12</text>
    <circle cx="800" cy="438" r="28" fill="#ffffff"/><text x="800" y="444" fill="#111827">13</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="360" y="490" width="610" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="380" y="517" font-size="16" fill="#334155">코드 예: A=00, B=11110, C=011, D=010, E=10, F=1110, G=11111, H=110</text>
  </g>
</svg>
