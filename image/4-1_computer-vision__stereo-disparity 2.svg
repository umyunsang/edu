<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="system-ui,sans-serif">
  <style>
    .cam{fill:#2c3e50}
    .plane{fill:#fff7d6;stroke:#d4a017;stroke-width:2}
    .obj{fill:#c0392b}
    .ray{stroke:#666;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
    .rayL{stroke:#2e86de;stroke-width:2;fill:none}
    .rayR{stroke:#27ae60;stroke-width:2;fill:none}
    .dim{stroke:#333;stroke-width:1.2;fill:none}
    .t{font-size:12px;text-anchor:middle}
    .tb{font-size:15px;font-weight:bold}
    .lab{font-size:13px}
    .eq{font-family:monospace;font-size:13px}
  </style>
  <text class="tb" x="440" y="22" text-anchor="middle">스테레오 비전: 시차(disparity)로 깊이(Z) 계산하기</text>

  <g transform="translate(80,60)">
    <!-- Object point -->
    <circle class="obj" cx="380" cy="40" r="6"/>
    <text class="t" x="380" y="30">P = (X, Y, Z)</text>

    <!-- Cameras -->
    <rect class="cam" x="170" y="240" width="40" height="30"/>
    <text class="t" x="190" y="285">왼쪽 카메라</text>
    <circle cx="190" cy="255" r="3" fill="#eaf2fb"/>

    <rect class="cam" x="550" y="240" width="40" height="30"/>
    <text class="t" x="570" y="285">오른쪽 카메라</text>
    <circle cx="570" cy="255" r="3" fill="#eaf2fb"/>

    <!-- Baseline B -->
    <g class="dim">
      <line x1="190" y1="310" x2="570" y2="310"/>
      <line x1="190" y1="305" x2="190" y2="315"/>
      <line x1="570" y1="305" x2="570" y2="315"/>
    </g>
    <text class="t" x="380" y="325" font-weight="bold">베이스라인 B</text>

    <!-- Image planes (above cameras, for illustration) -->
    <line class="plane" x1="140" y1="170" x2="240" y2="170"/>
    <text class="t" x="190" y="162">왼쪽 영상면</text>
    <line class="plane" x1="520" y1="170" x2="620" y2="170"/>
    <text class="t" x="570" y="162">오른쪽 영상면</text>

    <!-- Rays from P to cameras -->
    <line class="rayL" x1="380" y1="40" x2="190" y2="255"/>
    <line class="rayR" x1="380" y1="40" x2="570" y2="255"/>

    <!-- Image points where rays cross image planes -->
    <circle cx="217" cy="170" r="4" fill="#2e86de"/>
    <text class="t" x="217" y="190" fill="#2e86de" font-weight="bold">xL</text>

    <circle cx="543" cy="170" r="4" fill="#27ae60"/>
    <text class="t" x="543" y="190" fill="#27ae60" font-weight="bold">xR</text>

    <!-- Focal length -->
    <g class="dim">
      <line x1="100" y1="170" x2="100" y2="255"/>
      <line x1="95" y1="170" x2="105" y2="170"/>
      <line x1="95" y1="255" x2="105" y2="255"/>
    </g>
    <text class="t" x="90" y="215" text-anchor="end">f</text>

    <!-- disparity indicator -->
    <g stroke="#c0392b" stroke-width="1.5">
      <line x1="217" y1="200" x2="543" y2="200"/>
      <line x1="217" y1="196" x2="217" y2="204"/>
      <line x1="543" y1="196" x2="543" y2="204"/>
    </g>
    <text class="t" x="380" y="215" fill="#c0392b" font-weight="bold">d = xL − xR (시차)</text>

    <!-- Z arrow (depth) -->
    <g stroke="#666" stroke-width="1.5">
      <line x1="640" y1="40" x2="640" y2="255"/>
      <line x1="635" y1="40" x2="645" y2="40"/>
      <line x1="635" y1="255" x2="645" y2="255"/>
    </g>
    <text class="t" x="660" y="150">Z (깊이)</text>
  </g>

  <!-- Equation box -->
  <g transform="translate(30,360)">
    <rect x="0" y="0" width="820" height="110" fill="#fff7d6" stroke="#d4a017"/>
    <text class="tb" x="15" y="22">스테레오 깊이 공식 (rectified 전제)</text>
    <text class="eq" x="15" y="48" font-size="16" font-weight="bold">Z = f · B / d</text>
    <text class="lab" x="15" y="70">• f = 초점거리(공통),  B = 두 카메라 간격,  d = 같은 점이 좌/우 영상에서 나타나는 x 좌표 차이</text>
    <text class="lab" x="15" y="90" fill="#c0392b" font-weight="bold">핵심: 시차 d가 클수록 물체가 가깝다(Z↓). d=0이면 Z=∞ (무한히 먼 점).</text>
    <text class="lab" x="15" y="105">• 전제: 두 영상이 rectified(에피폴라 선이 수평) → 수평 탐색만으로 대응점 찾음 (블록 매칭, SGBM 등).</text>
  </g>
</svg>
