<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" font-family="system-ui,sans-serif">
  <style>
    .tb{font-size:15px;font-weight:bold}
    .th{font-size:13px;font-weight:bold;font-family:monospace}
    .t{font-size:13px;font-family:monospace;font-weight:bold;text-anchor:middle}
    .lab{font-size:12px}
    .cell{fill:#fff;stroke:#2c3e50;stroke-width:1}
    .miss{fill:#fde2e2;stroke:#c0392b;stroke-width:1.8}
    .hit{fill:#d0f5d0;stroke:#27ae60;stroke-width:2.2}
    .skip{fill:#eee;stroke:#bbb;opacity:0.5}
    .focus{fill:#fff2cc;stroke:#f39c12;stroke-width:2}
    .sum{fill:#fff7d6;stroke:#d4a017;stroke-width:1.5}
    .badge{fill:#c0392b}
    .badgeT{font-size:11px;fill:#fff;text-anchor:middle;font-weight:bold}
    .ar{stroke:#c0392b;stroke-width:2;fill:none;marker-end:url(#rd)}
  </style>
  <defs>
    <marker id="rd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  </defs>

  <text class="tb" x="460" y="22" text-anchor="middle">PQ1-3: 무식한 문자열 매칭 — 최악의 경우 비교 횟수</text>
  <text class="lab" x="460" y="42" text-anchor="middle">텍스트 n=20, 패턴 m=5 → 시도 위치 n-m+1=16, 매 시도마다 최대 m=5회 비교 → <tspan fill="#c0392b" font-weight="bold">최악 16×5 = 80회</tspan></text>

  <!-- Step 1: 시도 횟수 시각화 (텍스트 슬라이딩) -->
  <g transform="translate(30,60)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">1</text>
    <text class="tb" x="15" y="18">시도할 수 있는 위치 개수 = n - m + 1 = 16</text>

    <g transform="translate(30,35)">
      <text class="lab" x="0" y="15">T:</text>
      <g>
        <rect class="cell" x="30" y="0" width="22" height="26"/><text class="t" x="41" y="18">A</text>
        <rect class="cell" x="52" y="0" width="22" height="26"/><text class="t" x="63" y="18">A</text>
        <rect class="cell" x="74" y="0" width="22" height="26"/><text class="t" x="85" y="18">A</text>
        <rect class="cell" x="96" y="0" width="22" height="26"/><text class="t" x="107" y="18">A</text>
        <rect class="cell" x="118" y="0" width="22" height="26"/><text class="t" x="129" y="18">A</text>
        <rect class="cell" x="140" y="0" width="22" height="26"/><text class="t" x="151" y="18">A</text>
        <rect class="cell" x="162" y="0" width="22" height="26"/><text class="t" x="173" y="18">A</text>
        <rect class="cell" x="184" y="0" width="22" height="26"/><text class="t" x="195" y="18">A</text>
        <rect class="cell" x="206" y="0" width="22" height="26"/><text class="t" x="217" y="18">A</text>
        <rect class="cell" x="228" y="0" width="22" height="26"/><text class="t" x="239" y="18">A</text>
        <rect class="cell" x="250" y="0" width="22" height="26"/><text class="t" x="261" y="18">A</text>
        <rect class="cell" x="272" y="0" width="22" height="26"/><text class="t" x="283" y="18">A</text>
        <rect class="cell" x="294" y="0" width="22" height="26"/><text class="t" x="305" y="18">A</text>
        <rect class="cell" x="316" y="0" width="22" height="26"/><text class="t" x="327" y="18">A</text>
        <rect class="cell" x="338" y="0" width="22" height="26"/><text class="t" x="349" y="18">A</text>
        <rect class="cell" x="360" y="0" width="22" height="26"/><text class="t" x="371" y="18">A</text>
        <rect class="cell" x="382" y="0" width="22" height="26"/><text class="t" x="393" y="18">A</text>
        <rect class="cell" x="404" y="0" width="22" height="26"/><text class="t" x="415" y="18">A</text>
        <rect class="cell" x="426" y="0" width="22" height="26"/><text class="t" x="437" y="18">A</text>
        <rect class="focus" x="448" y="0" width="22" height="26"/><text class="t" x="459" y="18">B</text>
      </g>
      <text class="lab" x="490" y="18">(최악 패턴: T="AAAA…AAB")</text>
    </g>

    <g transform="translate(30,75)">
      <text class="lab" x="0" y="15">P:</text>
      <rect class="focus" x="30" y="0" width="22" height="26"/><text class="t" x="41" y="18">A</text>
      <rect class="focus" x="52" y="0" width="22" height="26"/><text class="t" x="63" y="18">A</text>
      <rect class="focus" x="74" y="0" width="22" height="26"/><text class="t" x="85" y="18">A</text>
      <rect class="focus" x="96" y="0" width="22" height="26"/><text class="t" x="107" y="18">A</text>
      <rect class="focus" x="118" y="0" width="22" height="26"/><text class="t" x="129" y="18">B</text>
      <text class="lab" x="160" y="18">패턴 "AAAAB" (m=5)</text>
    </g>
  </g>

  <!-- Step 2: 두 시도 상세 -->
  <g transform="translate(30,185)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">2</text>
    <text class="tb" x="15" y="18">시도 1 — 위치 0에서 비교 (왼쪽→오른쪽)</text>

    <g transform="translate(30,40)">
      <text class="lab" x="0" y="15">T:</text>
      <rect class="hit" x="30" y="0" width="22" height="26"/><text class="t" x="41" y="18">A</text>
      <rect class="hit" x="52" y="0" width="22" height="26"/><text class="t" x="63" y="18">A</text>
      <rect class="hit" x="74" y="0" width="22" height="26"/><text class="t" x="85" y="18">A</text>
      <rect class="hit" x="96" y="0" width="22" height="26"/><text class="t" x="107" y="18">A</text>
      <rect class="miss" x="118" y="0" width="22" height="26"/><text class="t" x="129" y="18">A</text>
      <text class="lab" x="160" y="18" fill="#c0392b" font-weight="bold">5번째 비교 실패: P[4]=B vs T[4]=A</text>
    </g>
    <g transform="translate(30,70)">
      <text class="lab" x="0" y="15">P:</text>
      <rect class="cell" x="30" y="0" width="22" height="26"/><text class="t" x="41" y="18">A</text>
      <rect class="cell" x="52" y="0" width="22" height="26"/><text class="t" x="63" y="18">A</text>
      <rect class="cell" x="74" y="0" width="22" height="26"/><text class="t" x="85" y="18">A</text>
      <rect class="cell" x="96" y="0" width="22" height="26"/><text class="t" x="107" y="18">A</text>
      <rect class="miss" x="118" y="0" width="22" height="26"/><text class="t" x="129" y="18">B</text>
    </g>
    <text class="lab" x="30" y="115" fill="#c0392b" font-weight="bold">⇒ 4번 일치 후 1번 불일치 = 5회 비교 (이 위치에서 최악)</text>
  </g>

  <!-- Step 3: 이어지는 시도들 요약 -->
  <g transform="translate(30,315)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">3</text>
    <text class="tb" x="15" y="18">시도 2~15 — 모두 같은 패턴 (4일치 후 1불일치)</text>

    <g transform="translate(30,40)">
      <text class="lab" x="0" y="15">시도 2 (shift 1):</text>
      <rect class="skip" x="150" y="0" width="22" height="26"/><text class="t" x="161" y="18" fill="#999">A</text>
      <rect class="hit" x="172" y="0" width="22" height="26"/><text class="t" x="183" y="18">A</text>
      <rect class="hit" x="194" y="0" width="22" height="26"/><text class="t" x="205" y="18">A</text>
      <rect class="hit" x="216" y="0" width="22" height="26"/><text class="t" x="227" y="18">A</text>
      <rect class="hit" x="238" y="0" width="22" height="26"/><text class="t" x="249" y="18">A</text>
      <rect class="miss" x="260" y="0" width="22" height="26"/><text class="t" x="271" y="18">A</text>
      <text class="lab" x="310" y="18" fill="#c0392b">5회 비교 실패</text>
    </g>

    <g transform="translate(30,75)">
      <text class="lab" x="0" y="15">⋮ 시도 3~15도 동일</text>
      <text class="lab" x="310" y="15">각각 5회 비교 실패</text>
    </g>

    <g transform="translate(30,105)">
      <text class="lab" x="0" y="15" fill="#27ae60" font-weight="bold">시도 16 (shift 15):</text>
      <rect class="hit" x="150" y="0" width="22" height="26"/><text class="t" x="161" y="18">A</text>
      <rect class="hit" x="172" y="0" width="22" height="26"/><text class="t" x="183" y="18">A</text>
      <rect class="hit" x="194" y="0" width="22" height="26"/><text class="t" x="205" y="18">A</text>
      <rect class="hit" x="216" y="0" width="22" height="26"/><text class="t" x="227" y="18">A</text>
      <rect class="hit" x="238" y="0" width="22" height="26"/><text class="t" x="249" y="18">B</text>
      <text class="lab" x="310" y="18" fill="#27ae60" font-weight="bold">5회 전부 일치 → 발견!</text>
    </g>
  </g>

  <!-- Step 4: 계산표 -->
  <g transform="translate(30,455)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">4</text>
    <text class="tb" x="15" y="18">총 비교 횟수 계산 — 시도별 합산</text>

    <rect class="sum" x="0" y="30" width="860" height="95"/>
    <text class="lab" x="10" y="50" font-weight="bold">시도 번호 i</text>
    <text class="lab" x="120" y="50" font-weight="bold">비교 횟수</text>
    <text class="lab" x="250" y="50" font-weight="bold">누적 합</text>
    <text class="lab" x="380" y="50" font-weight="bold">설명</text>
    <line x1="10" y1="55" x2="850" y2="55" stroke="#d4a017"/>

    <text class="lab" x="10" y="72">1 ~ 15</text>
    <text class="lab" x="120" y="72" fill="#c0392b" font-weight="bold">각 5회 (불일치)</text>
    <text class="lab" x="250" y="72">15 × 5 = 75</text>
    <text class="lab" x="380" y="72">"AAAA" 까지 같고 5번째에서 A ≠ B</text>

    <text class="lab" x="10" y="92">16</text>
    <text class="lab" x="120" y="92" fill="#27ae60" font-weight="bold">5회 (완전 일치)</text>
    <text class="lab" x="250" y="92">5</text>
    <text class="lab" x="380" y="92">마지막 위치에 "AAAAB" 정확히 매칭</text>

    <line x1="10" y1="100" x2="850" y2="100" stroke="#d4a017" stroke-width="1.5"/>
    <text class="lab" x="10" y="118" font-weight="bold">합계</text>
    <text class="lab" x="250" y="118" fill="#c0392b" font-weight="bold" font-size="14">80회</text>
    <text class="lab" x="380" y="118" fill="#c0392b" font-weight="bold">이것이 최악 O(n·m) — 개선: Horspool/KMP</text>
  </g>

  <!-- Summary -->
  <g transform="translate(30,595)">
    <rect class="sum" x="0" y="0" width="860" height="50"/>
    <text class="tb" x="15" y="20">공식</text>
    <text class="lab" x="15" y="40" fill="#c0392b" font-weight="bold">최악 비교 = (n - m + 1) × m = 16 × 5 = 80 ≈ n·m ⇒ O(nm). 평균은 O(n) 수준.</text>
  </g>
</svg>
