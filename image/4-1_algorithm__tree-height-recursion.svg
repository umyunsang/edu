<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="system-ui,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
  </defs>
  <style>
    .node{fill:#fff;stroke:#2c3e50;stroke-width:1.5}
    .leaf{fill:#d0f5d0;stroke:#27ae60;stroke-width:1.8}
    .root{fill:#fff2cc;stroke:#d4a017;stroke-width:2}
    .ln{stroke:#2c3e50;stroke-width:1.5;fill:none}
    .t{font-size:15px;font-weight:bold;text-anchor:middle;fill:#1e2a38}
    .ret{font-size:12px;font-family:ui-monospace,Menlo,monospace;text-anchor:middle;fill:#b34c00;font-weight:bold}
    .lab{font-size:12px;fill:#4a5b6c;text-anchor:middle}
    .tb{font-size:16px;font-weight:bold;text-anchor:middle;fill:#1e2a38}
    .mc{font-size:13px;text-anchor:middle;fill:#1e2a38}
    .note{fill:#fff7d6;stroke:#b08a1f;stroke-width:1.5}
    .th{font-size:14px;font-weight:bold;fill:#1e2a38}
    .m{font-size:13px;font-family:ui-monospace,Menlo,monospace;fill:#1e2a38}
  </style>

  <text class="tb" x="600" y="30">이진트리 높이 = 1 + max(left, right) — 분할정복 재귀</text>

  <!-- Tree structure:
       A (root) h=3
         B      h=2
           D    h=1
             H  h=0 (leaf)
           E    h=0 (leaf)
         C      h=1
           F    h=0 (leaf)
  -->

  <!-- Root A at (500, 80) -->
  <g>
    <circle class="root" cx="500" cy="80" r="28"/>
    <text class="t" x="500" y="86">A</text>
    <text class="ret" x="500" y="125">return 3</text>
  </g>

  <!-- B at (320, 180) -->
  <g>
    <circle class="node" cx="320" cy="180" r="26"/>
    <text class="t" x="320" y="186">B</text>
    <text class="ret" x="320" y="225">return 2</text>
  </g>
  <!-- C at (680, 180) -->
  <g>
    <circle class="node" cx="680" cy="180" r="26"/>
    <text class="t" x="680" y="186">C</text>
    <text class="ret" x="680" y="225">return 1</text>
  </g>

  <path class="ln" d="M478,98 L340,165"/>
  <path class="ln" d="M522,98 L660,165"/>

  <!-- D at (200, 290) -->
  <g>
    <circle class="node" cx="200" cy="290" r="24"/>
    <text class="t" x="200" y="296">D</text>
    <text class="ret" x="200" y="333">return 1</text>
  </g>
  <!-- E at (400, 290) (leaf) -->
  <g>
    <circle class="leaf" cx="400" cy="290" r="24"/>
    <text class="t" x="400" y="296">E</text>
    <text class="ret" x="400" y="333">return 0</text>
    <text class="lab" x="400" y="350">(leaf)</text>
  </g>
  <!-- F at (680, 290) (leaf) -->
  <g>
    <circle class="leaf" cx="680" cy="290" r="24"/>
    <text class="t" x="680" y="296">F</text>
    <text class="ret" x="680" y="333">return 0</text>
    <text class="lab" x="680" y="350">(leaf)</text>
  </g>

  <path class="ln" d="M300,200 L220,270"/>
  <path class="ln" d="M340,200 L380,270"/>
  <path class="ln" d="M680,206 L680,266"/>

  <!-- H at (200, 400) (leaf) -->
  <g>
    <circle class="leaf" cx="200" cy="400" r="24"/>
    <text class="t" x="200" y="406">H</text>
    <text class="ret" x="200" y="443">return 0</text>
    <text class="lab" x="200" y="460">(leaf)</text>
  </g>
  <path class="ln" d="M200,314 L200,376"/>

  <!-- Right-side calculation log -->
  <g>
    <rect class="note" x="780" y="80" width="380" height="440" rx="8"/>
    <text class="tb" x="970" y="108" fill="#1e2a38">노드별 계산 (후위 순회)</text>
    <text class="th" x="795" y="138">① H (leaf)</text>
    <text class="m" x="795" y="158">height(H) = 0       ← 기저</text>

    <text class="th" x="795" y="188">② D</text>
    <text class="m" x="795" y="208">height(D) = 1 + max(0, -∞)</text>
    <text class="m" x="795" y="225">         = 1 + 0 = 1</text>

    <text class="th" x="795" y="255">③ E, F (leaves)</text>
    <text class="m" x="795" y="275">height(E) = 0,  height(F) = 0</text>

    <text class="th" x="795" y="305">④ B</text>
    <text class="m" x="795" y="325">height(B) = 1 + max(1, 0) = 2</text>

    <text class="th" x="795" y="355">⑤ C</text>
    <text class="m" x="795" y="375">height(C) = 1 + max(0, -∞) = 1</text>

    <text class="th" x="795" y="405">⑥ A (root)</text>
    <text class="m" x="795" y="425">height(A) = 1 + max(2, 1) = 3</text>

    <text class="mc" x="970" y="470" font-weight="bold">※ 빈 자식의 높이를 -1로 정의하면</text>
    <text class="mc" x="970" y="490">height(leaf) = 1 + max(-1,-1) = 0 로 통일</text>
  </g>

  <!-- Pseudocode + complexity bottom -->
  <g>
    <rect class="note" x="40" y="540" width="720" height="150" rx="8"/>
    <text class="tb" x="400" y="568" fill="#1e2a38">의사코드 &amp; 점화식</text>
    <text class="m" x="55" y="595">height(v):</text>
    <text class="m" x="55" y="615">  if v == null: return -1</text>
    <text class="m" x="55" y="635">  return 1 + max(height(v.left), height(v.right))</text>
    <text class="m" x="55" y="665">점화식: T(n) = T(k) + T(n-1-k) + O(1)  ⇒  T(n) = Θ(n) (전체 노드 1회씩)</text>
  </g>
</svg>
