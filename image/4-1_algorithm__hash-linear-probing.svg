<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="system-ui,sans-serif">
  <style>.b{fill:#eaf2fb;stroke:#2c3e50;stroke-width:1.3}.n{fill:#fff7d6;stroke:#d4a017}.hit{fill:#ffd9d9;stroke:#c0392b;stroke-width:2}.empty{fill:#fff;stroke:#bbb}.ar{stroke:#e67e22;stroke-width:1.5;fill:none;marker-end:url(#a)}.t{font-size:13px;text-anchor:middle}.tb{font-size:14px;font-weight:bold}.lab{font-size:13px}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e67e22"/></marker></defs>
  <text class="tb" x="390" y="22" text-anchor="middle">선형 조사 (Linear Probing / 폐쇄 해싱): 충돌하면 "한 칸씩 옆으로"</text>
  <text class="lab" x="30" y="50">h(k) = k mod 7, 삽입 순서: 7(→0), 14(→0, 충돌!), 8(→1, 충돌!), 10(→3), 24(→3, 충돌!)</text>

  <g transform="translate(30,70)">
    <text class="t" x="45" y="15">index</text>
    <g><rect class="n" x="90" y="0" width="60" height="40"/><text class="t" x="120" y="25">7</text></g>
    <g><rect class="n" x="150" y="0" width="60" height="40"/><text class="t" x="180" y="25">14</text></g>
    <g><rect class="n" x="210" y="0" width="60" height="40"/><text class="t" x="240" y="25">8</text></g>
    <g><rect class="n" x="270" y="0" width="60" height="40"/><text class="t" x="300" y="25">10</text></g>
    <g><rect class="n" x="330" y="0" width="60" height="40"/><text class="t" x="360" y="25">24</text></g>
    <g><rect class="empty" x="390" y="0" width="60" height="40"/><text class="t" x="420" y="25">∅</text></g>
    <g><rect class="empty" x="450" y="0" width="60" height="40"/><text class="t" x="480" y="25">∅</text></g>
    <text class="t" x="120" y="62">0</text>
    <text class="t" x="180" y="62">1</text>
    <text class="t" x="240" y="62">2</text>
    <text class="t" x="300" y="62">3</text>
    <text class="t" x="360" y="62">4</text>
    <text class="t" x="420" y="62">5</text>
    <text class="t" x="480" y="62">6</text>
  </g>

  <g transform="translate(30,170)">
    <text class="tb" x="0" y="15">시나리오:</text>
    <text class="lab" x="75" y="15">14는 0번에 이미 7이 있어 → 1번으로, 1번도 점유면 → 2번... (한 칸씩 뒤로)</text>
    <text class="lab" x="0" y="35">24는 3번에 10이 있어 → 4번에 자리 잡음</text>
    <text class="lab" x="0" y="55">탐색 시에도 같은 규칙: h(k)에서 시작해 일치할 때까지 옆으로 이동, 빈 칸 만나면 "없음"으로 판정</text>
  </g>

  <g transform="translate(30,250)">
    <text class="tb" x="0" y="15">문제점(클러스터링):</text>
    <text class="lab" x="140" y="15">연속 점유 덩어리가 커질수록 탐색 비용이 커진다. → 이차조사/더블해싱으로 완화.</text>
    <text class="lab" x="0" y="35">이차조사: h(k)+1², +2², +3²… / 더블해싱: 점프 간격을 두 번째 해시함수로 결정.</text>
  </g>
</svg>
