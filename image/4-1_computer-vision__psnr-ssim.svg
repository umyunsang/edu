<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="system-ui,sans-serif">
  <style>
    .orig{fill:#2c3e50}
    .noise{fill:#5d6d7e}
    .blur{fill:#95a5a6}
    .frame{fill:none;stroke:#333;stroke-width:1.5}
    .t{font-size:12px;text-anchor:middle}
    .tb{font-size:15px;font-weight:bold}
    .lab{font-size:13px}
    .eq{font-family:monospace;font-size:13px}
    .psnr{fill:#c0392b;font-weight:bold}
    .ssim{fill:#27ae60;font-weight:bold}
  </style>
  <text class="tb" x="430" y="22" text-anchor="middle">PSNR vs SSIM: 왜 같은 PSNR도 화질이 달라 보이나</text>

  <!-- Three images -->
  <g transform="translate(40,55)">
    <text class="tb" x="60" y="0" text-anchor="middle">원본</text>
    <rect class="frame" x="0" y="10" width="120" height="100"/>
    <g>
      <rect class="orig" x="20" y="30" width="30" height="70"/>
      <rect class="orig" x="70" y="50" width="30" height="50"/>
      <circle class="orig" cx="35" cy="25" r="8"/>
    </g>
    <text class="t" x="60" y="130">기준 영상</text>
  </g>

  <g transform="translate(210,55)">
    <text class="tb" x="60" y="0" text-anchor="middle">가우시안 노이즈 추가</text>
    <rect class="frame" x="0" y="10" width="120" height="100"/>
    <g opacity="0.7">
      <rect class="noise" x="20" y="30" width="30" height="70"/>
      <rect class="noise" x="70" y="50" width="30" height="50"/>
      <circle class="noise" cx="35" cy="25" r="8"/>
    </g>
    <!-- random noise dots -->
    <g fill="#999">
      <circle cx="15" cy="40" r="1.5"/><circle cx="55" cy="25" r="1.5"/><circle cx="85" cy="35" r="1.5"/>
      <circle cx="25" cy="65" r="1.5"/><circle cx="105" cy="75" r="1.5"/><circle cx="45" cy="95" r="1.5"/>
      <circle cx="95" cy="55" r="1.5"/><circle cx="65" cy="85" r="1.5"/><circle cx="10" cy="80" r="1.5"/>
    </g>
    <text class="t psnr" x="60" y="130">PSNR ≈ 30 dB</text>
    <text class="t ssim" x="60" y="148">SSIM ≈ 0.85</text>
    <text class="t" x="60" y="168">→ 일치 (둘 다 나쁘다)</text>
  </g>

  <g transform="translate(380,55)">
    <text class="tb" x="60" y="0" text-anchor="middle">가우시안 블러</text>
    <rect class="frame" x="0" y="10" width="120" height="100"/>
    <g opacity="0.8" filter="url(#blurFilter)">
      <rect class="blur" x="20" y="30" width="30" height="70"/>
      <rect class="blur" x="70" y="50" width="30" height="50"/>
      <circle class="blur" cx="35" cy="25" r="8"/>
    </g>
    <defs>
      <filter id="blurFilter"><feGaussianBlur stdDeviation="2"/></filter>
    </defs>
    <text class="t psnr" x="60" y="130">PSNR ≈ 30 dB</text>
    <text class="t ssim" x="60" y="148">SSIM ≈ 0.65</text>
    <text class="t" x="60" y="168" fill="#c0392b">불일치!</text>
  </g>

  <g transform="translate(550,55)">
    <text class="tb" x="140" y="0" text-anchor="middle">사람 눈의 인식</text>
    <rect x="0" y="10" width="280" height="130" fill="#fff7d6" stroke="#d4a017"/>
    <text class="lab" x="15" y="35">• 노이즈는 "지저분하다"고 느낌</text>
    <text class="lab" x="15" y="55">• 블러는 "흐릿하다"고 느낌</text>
    <text class="lab" x="15" y="75">• 둘 다 같은 픽셀 차이(PSNR)라도</text>
    <text class="lab" x="15" y="93">  느껴지는 품질은 다름</text>
    <text class="lab" x="15" y="118" fill="#c0392b" font-weight="bold">SSIM이 이런 차이를 더 잘 반영</text>
  </g>

  <!-- Formula block -->
  <g transform="translate(30,240)">
    <rect x="0" y="0" width="400" height="190" fill="#fde2e2" stroke="#c0392b"/>
    <text class="tb psnr" x="15" y="22">PSNR (Peak Signal-to-Noise Ratio)</text>
    <text class="eq" x="15" y="48">MSE = (1/N) Σ (I − K)²</text>
    <text class="eq" x="15" y="68">PSNR = 10·log₁₀ (255² / MSE)   [dB]</text>
    <text class="lab" x="15" y="92">• 픽셀 차이만 본다 (전역 평균)</text>
    <text class="lab" x="15" y="112">• 값이 클수록 좋음 (30dB↑ 무난)</text>
    <text class="lab" x="15" y="132">• 구조/대비 변화 반영 못함</text>
    <text class="lab" x="15" y="160" font-weight="bold">장점: 단순·빠름, 수학적으로 깔끔</text>
    <text class="lab" x="15" y="180" font-weight="bold">단점: 사람 지각과 자주 어긋남</text>
  </g>

  <g transform="translate(450,240)">
    <rect x="0" y="0" width="380" height="190" fill="#d0f5d0" stroke="#27ae60"/>
    <text class="tb ssim" x="15" y="22">SSIM (Structural Similarity)</text>
    <text class="eq" x="15" y="48">SSIM = luminance · contrast · structure</text>
    <text class="eq" x="15" y="68">       l(x,y) · c(x,y) · s(x,y)</text>
    <text class="lab" x="15" y="92">• 밝기 평균, 분산(대비), 공분산(구조)</text>
    <text class="lab" x="15" y="112">• 지역 윈도우로 계산 후 평균</text>
    <text class="lab" x="15" y="132">• −1 ~ 1, 1이면 완벽히 같음</text>
    <text class="lab" x="15" y="160" font-weight="bold">장점: 블러·왜곡을 PSNR보다 잘 반영</text>
    <text class="lab" x="15" y="180" font-weight="bold">단점: 계산이 다소 복잡</text>
  </g>

  <g transform="translate(30,440)">
    <text class="lab" x="0" y="0" fill="#c0392b" font-weight="bold">시험 암기: "PSNR은 픽셀 차이, SSIM은 구조 유사성." — 실전 논문에서는 둘 다 같이 쓰는 경우가 많음.</text>
  </g>
</svg>
