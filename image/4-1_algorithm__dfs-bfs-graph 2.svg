<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1100" font-family="system-ui,sans-serif">
  <style>
    .node{fill:#fff;stroke:#2c3e50;stroke-width:1.8}
    .visited{fill:#d0f5d0;stroke:#27ae60;stroke-width:2}
    .start{fill:#ffe0b2;stroke:#e67e22;stroke-width:2.5}
    .edge{stroke:#777;stroke-width:1.6;fill:none}
    .nlab{font-size:17px;text-anchor:middle;font-weight:bold;dominant-baseline:central}
    .step{font-size:12px;fill:#c0392b;text-anchor:middle;font-weight:bold}
    .title{font-size:20px;font-weight:bold;text-anchor:middle}
    .sub{font-size:16px;font-weight:bold;fill:#1b2631}
    .note{font-size:12px;fill:#555}
    .adj{font-size:13px;font-family:monospace;fill:#333}
    .stk{fill:#fff9e6;stroke:#d4a017;stroke-width:1.3}
    .que{fill:#e8f1fd;stroke:#2e86de;stroke-width:1.3}
    .res{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.8}
    .cellT{font-size:12px;text-anchor:middle;font-weight:bold;dominant-baseline:central}
    .hi{fill:#c0392b;font-weight:bold}
    .arrow{font-size:15px;fill:#555;text-anchor:middle;font-weight:bold}
  </style>

  <!-- Title -->
  <text class="title" x="560" y="28">그래프 DFS / BFS — 시작 정점 ⑧, 이웃은 번호 작은 것부터</text>

  <!-- Adjacency list -->
  <g transform="translate(30, 52)">
    <rect x="0" y="0" width="1060" height="78" fill="#f8f9fa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text class="sub" x="14" y="22">인접 리스트</text>
    <text class="adj" x="14"  y="46">0: {4}    1: {4}    2: {5}    3: {6}    4: {0,1,5,6}</text>
    <text class="adj" x="14"  y="66">5: {2,4,8}    6: {3,4,7}    7: {6,8}    8: {5,7}  ← 시작</text>
    <text class="note" x="630" y="46">※ 정점 9개, 간선 9개 (0-4, 1-4, 2-5, 3-6, 4-5, 4-6, 5-8, 6-7, 7-8)</text>
    <text class="note" x="630" y="66">※ PDF 3장 26p 필기 예제</text>
  </g>

  <!-- ========== DFS SECTION ========== -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="510" height="460" fill="#fff8e7" stroke="#d4a017" stroke-width="1.5" rx="6"/>
    <text class="sub" x="14" y="22">DFS (깊이 우선) — 재귀 / 스택</text>
    <text class="note" x="14" y="40">방문 순서 번호는 노드 위에 빨간색으로 표시</text>

    <!-- Graph panel -->
    <g transform="translate(55, 55)">
      <!-- Edges -->
      <line class="edge" x1="60"  y1="60"  x2="200" y2="180"/>
      <line class="edge" x1="200" y1="60"  x2="200" y2="180"/>
      <line class="edge" x1="340" y1="60"  x2="340" y2="180"/>
      <line class="edge" x1="60"  y1="180" x2="60"  y2="300"/>
      <line class="edge" x1="200" y1="180" x2="340" y2="180"/>
      <line class="edge" x1="200" y1="180" x2="60"  y2="300"/>
      <line class="edge" x1="340" y1="180" x2="340" y2="300"/>
      <line class="edge" x1="60"  y1="300" x2="200" y2="300"/>
      <line class="edge" x1="200" y1="300" x2="340" y2="300"/>

      <!-- Nodes with step numbers (DFS order: 8,5,2,4,0,1,6,3,7) -->
      <circle class="visited" cx="60"  cy="60"  r="22"/><text class="nlab" x="60"  y="60">0</text><text class="step" x="60"  y="30">5</text>
      <circle class="visited" cx="200" cy="60"  r="22"/><text class="nlab" x="200" y="60">1</text><text class="step" x="200" y="30">6</text>
      <circle class="visited" cx="340" cy="60"  r="22"/><text class="nlab" x="340" y="60">2</text><text class="step" x="340" y="30">3</text>
      <circle class="visited" cx="60"  cy="180" r="22"/><text class="nlab" x="60"  y="180">3</text><text class="step" x="30"  y="180">8</text>
      <circle class="visited" cx="200" cy="180" r="22"/><text class="nlab" x="200" y="180">4</text><text class="step" x="170" y="180">4</text>
      <circle class="visited" cx="340" cy="180" r="22"/><text class="nlab" x="340" y="180">5</text><text class="step" x="370" y="180">2</text>
      <circle class="visited" cx="60"  cy="300" r="22"/><text class="nlab" x="60"  y="300">6</text><text class="step" x="30"  y="320">7</text>
      <circle class="visited" cx="200" cy="300" r="22"/><text class="nlab" x="200" y="300">7</text><text class="step" x="200" y="330">9</text>
      <circle class="start"   cx="340" cy="300" r="22"/><text class="nlab" x="340" y="300">8</text><text class="step" x="370" y="320">1</text>
    </g>

    <!-- DFS final order -->
    <g transform="translate(14, 400)">
      <text class="sub" x="0" y="0" font-size="14">방문 순서</text>
      <text class="adj" x="0" y="22" fill="#c0392b" font-weight="bold" font-size="15">
        8 → 5 → 2 → 4 → 0 → 1 → 6 → 3 → 7
      </text>
      <text class="note" x="0" y="42">※ 각 정점에서 이웃 중 번호 작은 것부터 재귀 호출 → 막히면 되돌아감</text>
    </g>
  </g>

  <!-- ========== BFS SECTION ========== -->
  <g transform="translate(580, 150)">
    <rect x="0" y="0" width="510" height="460" fill="#eef5fd" stroke="#2e86de" stroke-width="1.5" rx="6"/>
    <text class="sub" x="14" y="22">BFS (너비 우선) — 큐</text>
    <text class="note" x="14" y="40">방문 순서 번호는 노드 위에 빨간색으로 표시</text>

    <g transform="translate(55, 55)">
      <!-- Edges -->
      <line class="edge" x1="60"  y1="60"  x2="200" y2="180"/>
      <line class="edge" x1="200" y1="60"  x2="200" y2="180"/>
      <line class="edge" x1="340" y1="60"  x2="340" y2="180"/>
      <line class="edge" x1="60"  y1="180" x2="60"  y2="300"/>
      <line class="edge" x1="200" y1="180" x2="340" y2="180"/>
      <line class="edge" x1="200" y1="180" x2="60"  y2="300"/>
      <line class="edge" x1="340" y1="180" x2="340" y2="300"/>
      <line class="edge" x1="60"  y1="300" x2="200" y2="300"/>
      <line class="edge" x1="200" y1="300" x2="340" y2="300"/>

      <!-- Nodes with BFS step numbers (order: 8,5,7,2,4,6,0,1,3) -->
      <circle class="visited" cx="60"  cy="60"  r="22"/><text class="nlab" x="60"  y="60">0</text><text class="step" x="60"  y="30">7</text>
      <circle class="visited" cx="200" cy="60"  r="22"/><text class="nlab" x="200" y="60">1</text><text class="step" x="200" y="30">8</text>
      <circle class="visited" cx="340" cy="60"  r="22"/><text class="nlab" x="340" y="60">2</text><text class="step" x="340" y="30">4</text>
      <circle class="visited" cx="60"  cy="180" r="22"/><text class="nlab" x="60"  y="180">3</text><text class="step" x="30"  y="180">9</text>
      <circle class="visited" cx="200" cy="180" r="22"/><text class="nlab" x="200" y="180">4</text><text class="step" x="170" y="180">5</text>
      <circle class="visited" cx="340" cy="180" r="22"/><text class="nlab" x="340" y="180">5</text><text class="step" x="370" y="180">2</text>
      <circle class="visited" cx="60"  cy="300" r="22"/><text class="nlab" x="60"  y="300">6</text><text class="step" x="30"  y="320">6</text>
      <circle class="visited" cx="200" cy="300" r="22"/><text class="nlab" x="200" y="300">7</text><text class="step" x="200" y="330">3</text>
      <circle class="start"   cx="340" cy="300" r="22"/><text class="nlab" x="340" y="300">8</text><text class="step" x="370" y="320">1</text>
    </g>

    <g transform="translate(14, 400)">
      <text class="sub" x="0" y="0" font-size="14">방문 순서</text>
      <text class="adj" x="0" y="22" fill="#c0392b" font-weight="bold" font-size="15">
        8 → 5 → 7 → 2 → 4 → 6 → 0 → 1 → 3
      </text>
      <text class="note" x="0" y="42">※ 시작점에서 레벨 단위로 확장 (가까운 것부터) → 무가중치 최단 경로</text>
    </g>
  </g>

  <!-- ========== DFS STACK EVOLUTION ========== -->
  <g transform="translate(30, 630)">
    <text class="sub" x="0" y="0">DFS 재귀 호출 스택 변화 (왼쪽 bottom → 오른쪽 top)</text>
    <text class="note" x="0" y="18">현재 visit 노드는 주황색, 방문 끝나 pop 되면 사라짐</text>

    <!-- Step header -->
    <g font-size="12" text-anchor="middle" fill="#555">
      <text x="70"  y="45">① visit 8</text>
      <text x="210" y="45">② 8→5</text>
      <text x="350" y="45">③ 5→2</text>
      <text x="490" y="45">④ 5→4</text>
      <text x="630" y="45">⑤ 4→0</text>
      <text x="770" y="45">⑥ 4→1</text>
      <text x="910" y="45">⑦ 4→6</text>
      <text x="1050" y="45">⑧ 6→3</text>
    </g>

    <!-- Row of stack snapshots: each 130 wide, bars stack upward -->
    <!-- helper: a cell is 30 high, 30 wide, positioned bottom-up -->

    <!-- Step 1: [8] -->
    <g transform="translate(30, 60)">
      <rect class="stk" x="20" y="120" width="60" height="28"/>
      <text class="cellT" x="50" y="134">8</text>
    </g>

    <!-- Step 2: [8,5] -->
    <g transform="translate(170, 60)">
      <rect class="stk" x="20" y="120" width="60" height="28"/><text class="cellT" x="50" y="134">8</text>
      <rect class="stk" x="20" y="90"  width="60" height="28"/><text class="cellT" x="50" y="104">5</text>
    </g>

    <!-- Step 3: [8,5,2] top -->
    <g transform="translate(310, 60)">
      <rect class="stk" x="20" y="120" width="60" height="28"/><text class="cellT" x="50" y="134">8</text>
      <rect class="stk" x="20" y="90"  width="60" height="28"/><text class="cellT" x="50" y="104">5</text>
      <rect class="stk" x="20" y="60"  width="60" height="28"/><text class="cellT" x="50" y="74">2</text>
    </g>

    <!-- Step 4: [8,5,4] (2 popped, 4 pushed) -->
    <g transform="translate(450, 60)">
      <rect class="stk" x="20" y="120" width="60" height="28"/><text class="cellT" x="50" y="134">8</text>
      <rect class="stk" x="20" y="90"  width="60" height="28"/><text class="cellT" x="50" y="104">5</text>
      <rect class="stk" x="20" y="60"  width="60" height="28"/><text class="cellT" x="50" y="74">4</text>
    </g>

    <!-- Step 5: [8,5,4,0] -->
    <g transform="translate(590, 60)">
      <rect class="stk" x="20" y="120" width="60" height="28"/><text class="cellT" x="50" y="134">8</text>
      <rect class="stk" x="20" y="90"  width="60" height="28"/><text class="cellT" x="50" y="104">5</text>
      <rect class="stk" x="20" y="60"  width="60" height="28"/><text class="cellT" x="50" y="74">4</text>
      <rect class="stk" x="20" y="30"  width="60" height="28"/><text class="cellT" x="50" y="44">0</text>
    </g>

    <!-- Step 6: [8,5,4,1] -->
    <g transform="translate(730, 60)">
      <rect class="stk" x="20" y="120" width="60" height="28"/><text class="cellT" x="50" y="134">8</text>
      <rect class="stk" x="20" y="90"  width="60" height="28"/><text class="cellT" x="50" y="104">5</text>
      <rect class="stk" x="20" y="60"  width="60" height="28"/><text class="cellT" x="50" y="74">4</text>
      <rect class="stk" x="20" y="30"  width="60" height="28"/><text class="cellT" x="50" y="44">1</text>
    </g>

    <!-- Step 7: [8,5,4,6] -->
    <g transform="translate(870, 60)">
      <rect class="stk" x="20" y="120" width="60" height="28"/><text class="cellT" x="50" y="134">8</text>
      <rect class="stk" x="20" y="90"  width="60" height="28"/><text class="cellT" x="50" y="104">5</text>
      <rect class="stk" x="20" y="60"  width="60" height="28"/><text class="cellT" x="50" y="74">4</text>
      <rect class="stk" x="20" y="30"  width="60" height="28"/><text class="cellT" x="50" y="44">6</text>
    </g>

    <!-- Step 8: [8,5,4,6,3] -->
    <g transform="translate(1010, 60)">
      <rect class="stk" x="20" y="120" width="60" height="28"/><text class="cellT" x="50" y="134">8</text>
      <rect class="stk" x="20" y="90"  width="60" height="28"/><text class="cellT" x="50" y="104">5</text>
      <rect class="stk" x="20" y="60"  width="60" height="28"/><text class="cellT" x="50" y="74">4</text>
      <rect class="stk" x="20" y="30"  width="60" height="28"/><text class="cellT" x="50" y="44">6</text>
      <rect class="stk" x="20" y="0"   width="60" height="28"/><text class="cellT" x="50" y="14">3</text>
    </g>

    <text class="note" x="0" y="230">
      ⑨ 6→7 (3 pop 후): 스택 [8,5,4,6,7] → 더 갈 곳 없어 전체 pop → 종료
    </text>
  </g>

  <!-- ========== BFS QUEUE EVOLUTION ========== -->
  <g transform="translate(30, 890)">
    <text class="sub" x="0" y="0">BFS 큐 변화 (왼쪽 front → 오른쪽 rear)</text>
    <text class="note" x="0" y="18">각 단계에서 front를 dequeue → visit → 이웃 중 미방문 정점을 번호순으로 enqueue</text>

    <g font-size="11" fill="#444">
      <text x="0"  y="42">단계</text>
      <text x="90" y="42">①</text>
      <text x="90" y="62">②</text>
      <text x="90" y="82">③</text>
      <text x="90" y="102">④</text>
      <text x="90" y="122">⑤</text>
      <text x="90" y="142">⑥</text>
      <text x="90" y="162">⑦</text>
      <text x="90" y="182">⑧</text>
      <text x="90" y="202">⑨</text>
    </g>

    <g font-size="12" fill="#555">
      <text x="130" y="42">dequeue 8, enqueue 5,7</text>
      <text x="130" y="62">dequeue 5, enqueue 2,4</text>
      <text x="130" y="82">dequeue 7, enqueue 6</text>
      <text x="130" y="102">dequeue 2</text>
      <text x="130" y="122">dequeue 4, enqueue 0,1</text>
      <text x="130" y="142">dequeue 6, enqueue 3</text>
      <text x="130" y="162">dequeue 0</text>
      <text x="130" y="182">dequeue 1</text>
      <text x="130" y="202">dequeue 3 (종료)</text>
    </g>

    <!-- Queue snapshots as horizontal strips -->
    <g font-family="monospace" font-size="12" text-anchor="middle">
      <!-- Step 1 result: [5, 7] -->
      <g transform="translate(360, 30)">
        <rect class="que" x="0"  y="0" width="32" height="20"/><text x="16" y="14">5</text>
        <rect class="que" x="32" y="0" width="32" height="20"/><text x="48" y="14">7</text>
      </g>
      <!-- Step 2: [7,2,4] -->
      <g transform="translate(360, 50)">
        <rect class="que" x="0"  y="0" width="32" height="20"/><text x="16" y="14">7</text>
        <rect class="que" x="32" y="0" width="32" height="20"/><text x="48" y="14">2</text>
        <rect class="que" x="64" y="0" width="32" height="20"/><text x="80" y="14">4</text>
      </g>
      <!-- Step 3: [2,4,6] -->
      <g transform="translate(360, 70)">
        <rect class="que" x="0"  y="0" width="32" height="20"/><text x="16" y="14">2</text>
        <rect class="que" x="32" y="0" width="32" height="20"/><text x="48" y="14">4</text>
        <rect class="que" x="64" y="0" width="32" height="20"/><text x="80" y="14">6</text>
      </g>
      <!-- Step 4: [4,6] -->
      <g transform="translate(360, 90)">
        <rect class="que" x="0"  y="0" width="32" height="20"/><text x="16" y="14">4</text>
        <rect class="que" x="32" y="0" width="32" height="20"/><text x="48" y="14">6</text>
      </g>
      <!-- Step 5: [6,0,1] -->
      <g transform="translate(360, 110)">
        <rect class="que" x="0"  y="0" width="32" height="20"/><text x="16" y="14">6</text>
        <rect class="que" x="32" y="0" width="32" height="20"/><text x="48" y="14">0</text>
        <rect class="que" x="64" y="0" width="32" height="20"/><text x="80" y="14">1</text>
      </g>
      <!-- Step 6: [0,1,3] -->
      <g transform="translate(360, 130)">
        <rect class="que" x="0"  y="0" width="32" height="20"/><text x="16" y="14">0</text>
        <rect class="que" x="32" y="0" width="32" height="20"/><text x="48" y="14">1</text>
        <rect class="que" x="64" y="0" width="32" height="20"/><text x="80" y="14">3</text>
      </g>
      <!-- Step 7: [1,3] -->
      <g transform="translate(360, 150)">
        <rect class="que" x="0"  y="0" width="32" height="20"/><text x="16" y="14">1</text>
        <rect class="que" x="32" y="0" width="32" height="20"/><text x="48" y="14">3</text>
      </g>
      <!-- Step 8: [3] -->
      <g transform="translate(360, 170)">
        <rect class="que" x="0"  y="0" width="32" height="20"/><text x="16" y="14">3</text>
      </g>
      <!-- Step 9: [] -->
      <g transform="translate(360, 190)">
        <rect x="0" y="0" width="32" height="20" fill="#fff" stroke="#bbb" stroke-dasharray="3 2"/><text x="16" y="14" fill="#888">∅</text>
      </g>
    </g>

    <!-- 최종 순서 -->
    <g transform="translate(570, 30)">
      <text class="sub" x="0" y="14" font-size="14">최종 방문 순서</text>
      <g font-family="monospace" font-size="15" text-anchor="middle" font-weight="bold" fill="#2e7d32">
        <rect class="res" x="0"   y="30" width="36" height="36"/><text x="18"  y="52">8</text>
        <rect class="res" x="40"  y="30" width="36" height="36"/><text x="58"  y="52">5</text>
        <rect class="res" x="80"  y="30" width="36" height="36"/><text x="98"  y="52">7</text>
        <rect class="res" x="120" y="30" width="36" height="36"/><text x="138" y="52">2</text>
        <rect class="res" x="160" y="30" width="36" height="36"/><text x="178" y="52">4</text>
        <rect class="res" x="200" y="30" width="36" height="36"/><text x="218" y="52">6</text>
        <rect class="res" x="240" y="30" width="36" height="36"/><text x="258" y="52">0</text>
        <rect class="res" x="280" y="30" width="36" height="36"/><text x="298" y="52">1</text>
        <rect class="res" x="320" y="30" width="36" height="36"/><text x="338" y="52">3</text>
      </g>
      <text class="note" x="0" y="90">※ 큐가 빌 때까지 반복. 인접 리스트 시 O(V+E).</text>
    </g>
  </g>
</svg>
