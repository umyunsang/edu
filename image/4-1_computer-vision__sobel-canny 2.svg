<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="system-ui,sans-serif">
  <style>
    .c{fill:#fff;stroke:#2c3e50}
    .mx{fill:#eaf2fb;stroke:#2e86de}
    .my{fill:#e6f7e6;stroke:#27ae60}
    .step{fill:#fff7d6;stroke:#d4a017;stroke-width:1.5}
    .t{font-size:13px;text-anchor:middle;font-family:monospace}
    .tb{font-size:15px;font-weight:bold}
    .lab{font-size:13px}
    .arrow{stroke:#666;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#666"/></marker>
  </defs>
  <text class="tb" x="440" y="22" text-anchor="middle">Sobel과 Canny 에지 검출: 차이 한 그림에 정리</text>

  <!-- Sobel Masks -->
  <g transform="translate(30,50)">
    <text class="tb" x="0" y="15">① Sobel 마스크 (3×3)</text>

    <g transform="translate(0,30)">
      <text class="lab" x="60" y="10" text-anchor="middle">Gx (가로 에지)</text>
      <g transform="translate(0,20)">
        <rect class="mx" x="0" y="0" width="40" height="40"/><text class="t" x="20" y="25">−1</text>
        <rect class="mx" x="40" y="0" width="40" height="40"/><text class="t" x="60" y="25">0</text>
        <rect class="mx" x="80" y="0" width="40" height="40"/><text class="t" x="100" y="25">+1</text>
        <rect class="mx" x="0" y="40" width="40" height="40"/><text class="t" x="20" y="65">−2</text>
        <rect class="mx" x="40" y="40" width="40" height="40"/><text class="t" x="60" y="65">0</text>
        <rect class="mx" x="80" y="40" width="40" height="40"/><text class="t" x="100" y="65">+2</text>
        <rect class="mx" x="0" y="80" width="40" height="40"/><text class="t" x="20" y="105">−1</text>
        <rect class="mx" x="40" y="80" width="40" height="40"/><text class="t" x="60" y="105">0</text>
        <rect class="mx" x="80" y="80" width="40" height="40"/><text class="t" x="100" y="105">+1</text>
      </g>
    </g>

    <g transform="translate(140,30)">
      <text class="lab" x="60" y="10" text-anchor="middle">Gy (세로 에지)</text>
      <g transform="translate(0,20)">
        <rect class="my" x="0" y="0" width="40" height="40"/><text class="t" x="20" y="25">−1</text>
        <rect class="my" x="40" y="0" width="40" height="40"/><text class="t" x="60" y="25">−2</text>
        <rect class="my" x="80" y="0" width="40" height="40"/><text class="t" x="100" y="25">−1</text>
        <rect class="my" x="0" y="40" width="40" height="40"/><text class="t" x="20" y="65">0</text>
        <rect class="my" x="40" y="40" width="40" height="40"/><text class="t" x="60" y="65">0</text>
        <rect class="my" x="80" y="40" width="40" height="40"/><text class="t" x="100" y="65">0</text>
        <rect class="my" x="0" y="80" width="40" height="40"/><text class="t" x="20" y="105">+1</text>
        <rect class="my" x="40" y="80" width="40" height="40"/><text class="t" x="60" y="105">+2</text>
        <rect class="my" x="80" y="80" width="40" height="40"/><text class="t" x="100" y="105">+1</text>
      </g>
    </g>

    <g transform="translate(0,180)">
      <text class="lab" x="0" y="15">직관: Gx는 "왼쪽-오른쪽 밝기 차", Gy는 "위-아래 밝기 차"</text>
      <text class="lab" x="0" y="35">크기: ||∇I|| = √(Ix² + Iy²)   방향: θ = atan2(Iy, Ix)</text>
      <text class="lab" x="0" y="55" fill="#c0392b">약점: 노이즈에 예민 → 블러 없이 쓰면 잡음도 에지로.</text>
    </g>
  </g>

  <!-- Canny Pipeline -->
  <g transform="translate(330,50)">
    <text class="tb" x="0" y="15">② Canny 파이프라인 (Sobel을 감싸는 전처리+후처리)</text>

    <g transform="translate(0,35)">
      <rect class="step" x="0" y="0" width="110" height="50"/>
      <text class="t" x="55" y="22" font-weight="bold">1. Gaussian</text>
      <text class="t" x="55" y="38">블러 (잡음↓)</text>
    </g>
    <line class="arrow" x1="115" y1="60" x2="135" y2="60"/>

    <g transform="translate(140,35)">
      <rect class="step" x="0" y="0" width="110" height="50"/>
      <text class="t" x="55" y="22" font-weight="bold">2. Gradient</text>
      <text class="t" x="55" y="38">Sobel로 Ix, Iy</text>
    </g>
    <line class="arrow" x1="255" y1="60" x2="275" y2="60"/>

    <g transform="translate(280,35)">
      <rect class="step" x="0" y="0" width="110" height="50"/>
      <text class="t" x="55" y="22" font-weight="bold">3. NMS</text>
      <text class="t" x="55" y="38">얇은 에지만 남김</text>
    </g>
    <line class="arrow" x1="395" y1="60" x2="415" y2="60"/>

    <g transform="translate(420,35)">
      <rect class="step" x="0" y="0" width="125" height="50"/>
      <text class="t" x="62" y="22" font-weight="bold">4. Hysteresis</text>
      <text class="t" x="62" y="38">이중 임계값+연결</text>
    </g>

    <!-- Output arrow -->
    <g transform="translate(180,120)">
      <text class="tb" x="0" y="0">각 단계가 해결하는 문제</text>
      <text class="lab" x="0" y="22">• 1단계: 노이즈 한 점도 에지로 오인되는 것 방지</text>
      <text class="lab" x="0" y="42">• 2단계: 경사도 자체를 계산 (Sobel과 같다)</text>
      <text class="lab" x="0" y="62">• 3단계: 한 에지가 두꺼운 띠로 나오는 현상 제거</text>
      <text class="lab" x="0" y="82">• 4단계: 약한 에지 중에도 강한 에지와 연결된 것만 살림</text>
    </g>

    <g transform="translate(0,240)">
      <rect x="0" y="0" width="550" height="90" fill="#fff7d6" stroke="#d4a017"/>
      <text class="tb" x="15" y="22">핵심 비교</text>
      <text class="lab" x="15" y="44">• Sobel: 그래디언트 크기 = 에지 후보. 단순·빠름·잡음 취약.</text>
      <text class="lab" x="15" y="64">• Canny: Sobel + 블러 + NMS + 이중임계. 얇고 깨끗한 에지.</text>
      <text class="lab" x="15" y="82" fill="#c0392b" font-weight="bold">실습 패턴: cv2.GaussianBlur → cv2.Canny (블러 먼저!)</text>
    </g>
  </g>
</svg>
