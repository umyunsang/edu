<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <rect width="1100" height="560" fill="#f8fafc"/>
  <text x="42" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Bin Packing 수업 예제</text>
  <text x="42" y="84" font-family="Arial, sans-serif" font-size="16" fill="#475569">용량 10, 물건 순서 5, 7, 4, 2, 5, 1, 6, 2, 5. 순서를 바꾸지 않는 휴리스틱은 결과가 달라진다.</text>

  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="58" y="125" width="300" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="82" y="160" font-size="20" font-weight="700" fill="#334155">하한값</text>
    <text x="82" y="198" fill="#111827">총 무게 = 37</text>
    <text x="82" y="228" fill="#111827">ceil(37 / 10) = 4</text>

    <rect x="400" y="125" width="620" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="425" y="160" font-size="20" font-weight="700" fill="#334155">결과 bin 수</text>
    <text x="425" y="203" fill="#111827">Optimal 4</text>
    <text x="545" y="203" fill="#111827">Next Fit 6</text>
    <text x="675" y="203" fill="#111827">First Fit 5</text>
    <text x="805" y="203" fill="#14532d" font-weight="700">Best Fit 4</text>
    <text x="925" y="203" fill="#111827">Worst Fit 5</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14">
    <text x="72" y="310" font-size="20" font-weight="700" fill="#334155">Best Fit 진행 결과</text>
    <g>
      <rect x="72" y="335" width="210" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
      <text x="92" y="368" fill="#111827">B1: 5 + 4 + 1 = 10</text>
      <rect x="306" y="335" width="210" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
      <text x="326" y="368" fill="#111827">B2: 7 + 2 = 9</text>
      <rect x="540" y="335" width="210" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
      <text x="560" y="368" fill="#111827">B3: 5 + 5 = 10</text>
      <rect x="774" y="335" width="210" height="56" rx="8" fill="#fce7f3" stroke="#db2777"/>
      <text x="794" y="368" fill="#111827">B4: 6 + 2 = 8</text>
    </g>
    <rect x="72" y="430" width="912" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="96" y="465" fill="#334155">Best Fit에서 두 번째 2는 남은 공간이 가장 작아지는 B4에 들어가므로 마지막 5가 B3에 들어갈 자리가 남는다.</text>
  </g>
</svg>
