<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" font-family="system-ui,sans-serif">
  <style>
    .n{fill:#fff;stroke:#2c3e50;stroke-width:1.5}
    .dup{fill:#ffd6d6;stroke:#c0392b;stroke-width:2.2}
    .leaf{fill:#d0f5d0;stroke:#27ae60;stroke-width:1.5}
    .root{fill:#fff2cc;stroke:#f39c12;stroke-width:3}
    .e{stroke:#888;stroke-width:1.3;fill:none}
    .dupLink{stroke:#c0392b;stroke-width:1.5;fill:none;stroke-dasharray:5 3;opacity:0.7}
    .t{font-size:12px;text-anchor:middle;font-family:monospace;font-weight:bold}
    .tb{font-size:15px;font-weight:bold}
    .lab{font-size:12px}
    .order{font-size:10px;text-anchor:middle;fill:#2e86de;font-weight:bold}
    .note{font-size:12px;fill:#c0392b}
    .sum{fill:#fff7d6;stroke:#d4a017;stroke-width:1.5}
    .memo{fill:#eaf2fb;stroke:#2e86de;stroke-width:1.5}
    .badge{fill:#c0392b}
    .badgeT{font-size:11px;fill:#fff;text-anchor:middle;font-weight:bold}
  </style>
  <text class="tb" x="460" y="22" text-anchor="middle">피보나치 재귀 호출 트리: F(5) — 중복 부분문제와 메모이제이션</text>
  <text class="lab" x="460" y="42" text-anchor="middle">규칙: F(n) = F(n-1) + F(n-2), F(0)=0, F(1)=1. 파란 숫자는 호출 순서(DFS).</text>

  <!-- Left: Naive recursion tree -->
  <circle class="badge" cx="30" cy="65" r="11"/><text class="badgeT" x="30" y="69">1</text>
  <text class="tb" x="45" y="69" fill="#c0392b">순수 재귀 — 지수폭발</text>

  <g>
    <line class="e" x1="250" y1="95" x2="150" y2="150"/>
    <line class="e" x1="250" y1="95" x2="420" y2="150"/>
    <line class="e" x1="150" y1="170" x2="80" y2="225"/>
    <line class="e" x1="150" y1="170" x2="270" y2="225"/>
    <line class="e" x1="420" y1="170" x2="360" y2="225"/>
    <line class="e" x1="420" y1="170" x2="480" y2="225"/>
    <line class="e" x1="80" y1="245" x2="40" y2="300"/>
    <line class="e" x1="80" y1="245" x2="130" y2="300"/>
    <line class="e" x1="270" y1="245" x2="230" y2="300"/>
    <line class="e" x1="270" y1="245" x2="290" y2="300"/>
    <line class="e" x1="360" y1="245" x2="345" y2="300"/>
    <line class="e" x1="360" y1="245" x2="405" y2="300"/>
    <line class="e" x1="40" y1="320" x2="10" y2="375"/>
    <line class="e" x1="40" y1="320" x2="70" y2="375"/>
  </g>

  <!-- duplicate link arrows (dashed red) between duplicates -->
  <path class="dupLink" d="M420 145 Q300 125 150 165"/>
  <text class="lab" x="285" y="122" fill="#c0392b" font-size="10" text-anchor="middle">동일: F(3) 2번</text>

  <path class="dupLink" d="M480 235 Q390 260 360 235"/>
  <path class="dupLink" d="M360 235 Q210 280 270 245"/>
  <text class="lab" x="330" y="275" fill="#c0392b" font-size="10" text-anchor="middle">동일: F(2) 3번</text>

  <!-- Nodes with call-order numbers -->
  <circle class="root" cx="250" cy="75" r="22"/><text class="t" x="250" y="79">F(5)</text><text class="order" x="278" y="60">#1</text>

  <circle class="n" cx="150" cy="160" r="22"/><text class="t" x="150" y="164">F(4)</text><text class="order" x="122" y="148">#2</text>
  <circle class="dup" cx="420" cy="160" r="22"/><text class="t" x="420" y="164">F(3)</text><text class="order" x="450" y="148">#9</text>

  <circle class="dup" cx="80" cy="235" r="22"/><text class="t" x="80" y="239">F(3)</text><text class="order" x="52" y="223">#3</text>
  <circle class="dup" cx="270" cy="235" r="22"/><text class="t" x="270" y="239">F(2)</text><text class="order" x="298" y="223">#8</text>
  <circle class="dup" cx="360" cy="235" r="22"/><text class="t" x="360" y="239">F(2)</text><text class="order" x="332" y="223">#10</text>
  <circle class="leaf" cx="480" cy="235" r="22"/><text class="t" x="480" y="239">F(1)</text><text class="order" x="508" y="223">#13</text>

  <circle class="dup" cx="40" cy="310" r="22"/><text class="t" x="40" y="314">F(2)</text><text class="order" x="18" y="296">#4</text>
  <circle class="leaf" cx="130" cy="310" r="22"/><text class="t" x="130" y="314">F(1)</text><text class="order" x="155" y="296">#7</text>
  <circle class="leaf" cx="230" cy="310" r="22"/><text class="t" x="230" y="314">F(1)</text><text class="order" x="195" y="340">#9a</text>
  <circle class="leaf" cx="290" cy="310" r="22"/><text class="t" x="290" y="314">F(0)</text><text class="order" x="325" y="340">#9b</text>
  <circle class="leaf" cx="345" cy="310" r="22"/><text class="t" x="345" y="314">F(1)</text>
  <circle class="leaf" cx="405" cy="310" r="22"/><text class="t" x="405" y="314">F(0)</text>

  <circle class="leaf" cx="10" cy="385" r="20"/><text class="t" x="10" y="389">F(1)</text>
  <circle class="leaf" cx="70" cy="385" r="20"/><text class="t" x="70" y="389">F(0)</text>

  <!-- Right: Memoization table -->
  <circle class="badge" cx="555" cy="65" r="11"/><text class="badgeT" x="555" y="69">2</text>
  <text class="tb" x="570" y="69" fill="#2e86de">메모이제이션 — 한 번 계산, 재사용</text>

  <g transform="translate(555,90)">
    <rect class="memo" x="0" y="0" width="340" height="40"/>
    <text class="t" x="30" y="24" text-anchor="middle">i</text>
    <text class="t" x="75" y="24" text-anchor="middle">0</text>
    <text class="t" x="120" y="24" text-anchor="middle">1</text>
    <text class="t" x="165" y="24" text-anchor="middle">2</text>
    <text class="t" x="210" y="24" text-anchor="middle">3</text>
    <text class="t" x="255" y="24" text-anchor="middle">4</text>
    <text class="t" x="300" y="24" text-anchor="middle">5</text>
    <line x1="50" y1="0" x2="50" y2="40" stroke="#2e86de"/>

    <rect class="memo" x="0" y="40" width="340" height="40"/>
    <text class="t" x="30" y="64" text-anchor="middle">memo</text>
    <text class="t" x="75" y="64" text-anchor="middle">0</text>
    <text class="t" x="120" y="64" text-anchor="middle">1</text>
    <text class="t" x="165" y="64" text-anchor="middle">1</text>
    <text class="t" x="210" y="64" text-anchor="middle">2</text>
    <text class="t" x="255" y="64" text-anchor="middle">3</text>
    <text class="t" x="300" y="64" text-anchor="middle">5</text>
    <line x1="50" y1="40" x2="50" y2="80" stroke="#2e86de"/>
  </g>

  <text class="lab" x="555" y="195">• F(0), F(1): 베이스 → 즉시 반환</text>
  <text class="lab" x="555" y="213">• F(2) = F(1)+F(0) = 1 (한 번만 계산, 캐시)</text>
  <text class="lab" x="555" y="231">• F(3) 두번째 호출부터는 <tspan fill="#27ae60" font-weight="bold">O(1) 테이블 조회</tspan></text>
  <text class="lab" x="555" y="249">• 총 호출: n+1번 → 시간 O(n), 공간 O(n)</text>

  <g transform="translate(555,270)">
    <rect class="memo" x="0" y="0" width="340" height="100"/>
    <text class="tb" x="10" y="20" fill="#2e86de" font-size="13">상향식 DP 의사코드</text>
    <text x="10" y="40" font-size="11" font-family="monospace" font-weight="bold" text-anchor="start">memo[0]=0; memo[1]=1;</text>
    <text x="10" y="58" font-size="11" font-family="monospace" font-weight="bold" text-anchor="start">for i = 2 to n:</text>
    <text x="10" y="76" font-size="11" font-family="monospace" font-weight="bold" text-anchor="start">  memo[i] = memo[i-1] + memo[i-2]</text>
    <text x="10" y="94" font-size="11" font-family="monospace" font-weight="bold" text-anchor="start">return memo[n]</text>
  </g>

  <!-- Count badge panel -->
  <g transform="translate(30,420)">
    <rect class="sum" x="0" y="0" width="860" height="90"/>
    <text class="tb" x="15" y="22">호출 횟수 정밀 분석 — F(5)</text>
    <text class="lab" x="15" y="44" fill="#c0392b" font-weight="bold">• 순수 재귀: F(5)=1, F(4)=1, F(3)=<tspan font-weight="bold">2</tspan>, F(2)=<tspan font-weight="bold">3</tspan>, F(1)=<tspan font-weight="bold">5</tspan>, F(0)=<tspan font-weight="bold">3</tspan> → 총 <tspan font-weight="bold">15</tspan> 호출</text>
    <text class="lab" x="15" y="62" fill="#2e86de" font-weight="bold">• 메모이제이션: F(0)~F(5) 각 1회씩 → 총 <tspan font-weight="bold">6</tspan> 호출 (테이블 조회는 비재귀)</text>
    <text class="lab" x="15" y="80" font-weight="bold">• 일반화: T_naive(n) ≈ F(n+1) ≈ φⁿ/√5 (지수), T_dp(n) = O(n) (선형)</text>
  </g>

  <!-- Growth comparison chart -->
  <g transform="translate(30,525)">
    <rect class="sum" x="0" y="0" width="860" height="145"/>
    <text class="tb" x="15" y="22">성장률 체감 — n이 커지면?</text>
    <g transform="translate(15,35)">
      <text class="lab" x="0" y="15" font-weight="bold">n</text>
      <text class="lab" x="80" y="15" font-weight="bold" fill="#c0392b">순수 재귀 호출수</text>
      <text class="lab" x="280" y="15" font-weight="bold" fill="#2e86de">메모 호출수</text>
      <text class="lab" x="440" y="15" font-weight="bold">격차</text>
      <text class="lab" x="560" y="15" font-weight="bold">현실 시간(1ns/호출 가정)</text>

      <text class="lab" x="0" y="35">10</text>
      <text class="lab" x="80" y="35" font-family="monospace">177</text>
      <text class="lab" x="280" y="35" font-family="monospace">11</text>
      <text class="lab" x="440" y="35" font-family="monospace">16배</text>
      <text class="lab" x="560" y="35" font-family="monospace">&lt; 1µs vs &lt; 1µs</text>

      <text class="lab" x="0" y="55">30</text>
      <text class="lab" x="80" y="55" font-family="monospace">2,692,537</text>
      <text class="lab" x="280" y="55" font-family="monospace">31</text>
      <text class="lab" x="440" y="55" font-family="monospace">약 87,000배</text>
      <text class="lab" x="560" y="55" font-family="monospace">2.7ms vs 31ns</text>

      <text class="lab" x="0" y="75">50</text>
      <text class="lab" x="80" y="75" font-family="monospace">~4×10¹⁰</text>
      <text class="lab" x="280" y="75" font-family="monospace">51</text>
      <text class="lab" x="440" y="75" font-family="monospace">약 8억배</text>
      <text class="lab" x="560" y="75" font-family="monospace" fill="#c0392b" font-weight="bold">~40초 vs 51ns</text>

      <text class="lab" x="0" y="95">100</text>
      <text class="lab" x="80" y="95" font-family="monospace" fill="#c0392b" font-weight="bold">~3.5×10²⁰</text>
      <text class="lab" x="280" y="95" font-family="monospace">101</text>
      <text class="lab" x="440" y="95" font-family="monospace">사실상 ∞</text>
      <text class="lab" x="560" y="95" font-family="monospace" fill="#c0392b" font-weight="bold">~11,000년 vs 101ns</text>
    </g>
  </g>
</svg>
