<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520">
  <rect width="1080" height="520" fill="#f8fafc"/>
  <text x="42" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Vertex Cover 2-Approximation</text>
  <text x="42" y="84" font-family="Arial, sans-serif" font-size="16" fill="#475569">덮이지 않은 간선을 하나 고르고 양 끝점을 모두 선택한다. 선택된 간선들은 최적해의 하한 역할을 한다.</text>

  <defs>
    <marker id="vcArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="170" cy="210" r="28" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="170" y="217" font-size="18">u</text>
    <circle cx="320" cy="210" r="28" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="320" y="217" font-size="18">v</text>
    <line x1="198" y1="210" x2="292" y2="210" stroke="#ef4444" stroke-width="5"/>
    <text x="245" y="170" font-size="17" font-weight="700" fill="#991b1b">간선 선택</text>

    <path d="M365 210 H475" stroke="#64748b" stroke-width="3" marker-end="url(#vcArrow)"/>

    <circle cx="555" cy="210" r="30" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="555" y="217" font-size="18" font-weight="700">u</text>
    <circle cx="705" cy="210" r="30" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="705" y="217" font-size="18" font-weight="700">v</text>
    <line x1="585" y1="210" x2="675" y2="210" stroke="#16a34a" stroke-width="5"/>
    <text x="630" y="170" font-size="17" font-weight="700" fill="#14532d">양 끝점 추가</text>

    <path d="M750 210 H860" stroke="#64748b" stroke-width="3" marker-end="url(#vcArrow)"/>

    <rect x="880" y="165" width="150" height="92" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="955" y="200" font-size="18" font-weight="700" fill="#334155">incident</text>
    <text x="955" y="228" font-size="16" fill="#334155">간선 제거</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="95" y="330" width="890" height="104" rx="10" fill="#fff7ed" stroke="#fb923c"/>
    <text x="125" y="365" font-size="18" font-weight="700" fill="#9a3412">2배 보장 이유</text>
    <text x="125" y="395" font-size="16" fill="#334155">알고리즘이 고른 간선들은 서로 겹치지 않게 제거된다. 최적해도 각 간선을 덮으려면 적어도 한 끝점은 골라야 한다.</text>
    <text x="125" y="420" font-size="16" fill="#334155">알고리즘은 그 한 간선마다 두 끝점을 고르므로 |ALG| &lt;= 2|OPT| 이다.</text>
  </g>
</svg>
