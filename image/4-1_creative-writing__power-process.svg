<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="system-ui,sans-serif">
  <style>
    .p{fill:#fde2e2;stroke:#c0392b;stroke-width:2}
    .o{fill:#d0f5d0;stroke:#27ae60;stroke-width:2}
    .w{fill:#fff7d6;stroke:#d4a017;stroke-width:2}
    .e{fill:#eaeaea;stroke:#555;stroke-width:2}
    .r{fill:#f0d4f7;stroke:#9b59b6;stroke-width:2}
    .title{font-size:18px;font-weight:bold;text-anchor:middle}
    .lab{font-size:13px;text-anchor:middle}
    .letter{font-size:28px;font-weight:bold;text-anchor:middle;fill:#c0392b}
    .word{font-size:14px;font-weight:bold;text-anchor:middle}
    .ar{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#arw)}
    .cycle{stroke:#999;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#arw2)}
    .note{font-size:14px}
  </style>
  <defs>
    <marker id="arw" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#333"/>
    </marker>
    <marker id="arw2" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#999"/>
    </marker>
  </defs>

  <text class="title" x="550" y="40">POWER 과정: 힘 글쓰기 5단계 (반복적 사이클)</text>

  <!-- 5 boxes -->
  <g>
    <rect class="p" x="60" y="90" width="180" height="150"/>
    <text class="letter" x="150" y="130">P</text>
    <text class="word" x="150" y="160">Pre-Writing</text>
    <text class="lab" x="150" y="190">글쓰기 준비단계</text>
    <text class="lab" x="150" y="215">주제 · 자료</text>
    <text class="lab" x="150" y="232">브레인스토밍</text>
  </g>

  <g>
    <rect class="o" x="270" y="90" width="180" height="150"/>
    <text class="letter" x="360" y="130">O</text>
    <text class="word" x="360" y="160">Organization</text>
    <text class="lab" x="360" y="190">글의 구조 잡기</text>
    <text class="lab" x="360" y="215">덩이지기</text>
    <text class="lab" x="360" y="232">구조도</text>
  </g>

  <g>
    <rect class="w" x="480" y="90" width="180" height="150"/>
    <text class="letter" x="570" y="130">W</text>
    <text class="word" x="570" y="160">Writing</text>
    <text class="lab" x="570" y="190">초고 쓰기</text>
    <text class="lab" x="570" y="215">1차 드래프트</text>
    <text class="lab" x="570" y="232">문장 → 문단 → 글</text>
  </g>

  <g>
    <rect class="e" x="690" y="90" width="180" height="150"/>
    <text class="letter" x="780" y="130">E</text>
    <text class="word" x="780" y="160">Editing</text>
    <text class="lab" x="780" y="190">고치기</text>
    <text class="lab" x="780" y="215">문장 · 표현 다듬기</text>
    <text class="lab" x="780" y="232">문법 · 맞춤법</text>
  </g>

  <g>
    <rect class="r" x="900" y="90" width="180" height="150"/>
    <text class="letter" x="990" y="130">R</text>
    <text class="word" x="990" y="160">Re-Writing</text>
    <text class="lab" x="990" y="190">다시 쓰기</text>
    <text class="lab" x="990" y="215">구조 재검토</text>
    <text class="lab" x="990" y="232">최종 점검</text>
  </g>

  <!-- Forward arrows -->
  <line class="ar" x1="240" y1="165" x2="270" y2="165"/>
  <line class="ar" x1="450" y1="165" x2="480" y2="165"/>
  <line class="ar" x1="660" y1="165" x2="690" y2="165"/>
  <line class="ar" x1="870" y1="165" x2="900" y2="165"/>

  <!-- Cycle back arrow -->
  <path class="cycle" d="M 990 260 Q 990 320 550 320 Q 150 320 150 260"/>
  <text x="550" y="355" font-size="14" text-anchor="middle" fill="#999" font-weight="bold">필요시 반복 (Revising is recursive)</text>

  <!-- Power levels -->
  <g>
    <rect x="60" y="390" width="1020" height="210" fill="#fff7d6" stroke="#d4a017"/>
    <text x="80" y="425" font-size="15" font-weight="bold">Power Writing: 문장에 숫자 부여 (추상 → 구체)</text>
    <text class="note" x="80" y="465" fill="#c0392b" font-weight="bold">Power 1</text>
    <text class="note" x="200" y="465">= main idea / 주제 · 주장</text>
    <text class="note" x="80" y="500" fill="#c0392b" font-weight="bold">Power 2</text>
    <text class="note" x="200" y="500">= major detail / 근거 — 힘1을 뒷받침</text>
    <text class="note" x="80" y="535" fill="#c0392b" font-weight="bold">Power 3</text>
    <text class="note" x="200" y="535">= minor detail / 증명 — 힘2를 뒷받침</text>
    <text class="note" x="80" y="570" fill="#c0392b" font-weight="bold">Power 4</text>
    <text class="note" x="200" y="570">= conclusion / 결론 — 힘1과 짝, 생략 가능</text>
  </g>
</svg>
