<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" font-family="system-ui,sans-serif">
  <style>.t{font-size:14px}.ax{stroke:#222;stroke-width:1.5;fill:none}.f{fill:none;stroke-width:2.2}.lab{font-size:13px;font-weight:bold}</style>
  <path class="ax" d="M60 380 L720 380 M60 380 L60 30"/>
  <text class="t" x="400" y="410" text-anchor="middle">입력 크기 n</text>
  <text class="t" x="20" y="200" transform="rotate(-90 20 200)" text-anchor="middle">연산 횟수 T(n)</text>
  <!-- curves -->
  <path class="f" stroke="#8e44ad" d="M60 378 L720 375"/>
  <text class="lab" fill="#8e44ad" x="725" y="378">1, log log n</text>
  <path class="f" stroke="#16a085" d="M60 370 Q200 360 720 340"/>
  <text class="lab" fill="#16a085" x="725" y="343">log n</text>
  <path class="f" stroke="#2e86de" d="M60 370 L720 230"/>
  <text class="lab" fill="#2e86de" x="725" y="230">n</text>
  <path class="f" stroke="#3498db" d="M60 370 Q200 280 720 170"/>
  <text class="lab" fill="#3498db" x="725" y="170">n log n</text>
  <path class="f" stroke="#e67e22" d="M60 378 Q400 300 720 90"/>
  <text class="lab" fill="#e67e22" x="725" y="90">n²</text>
  <path class="f" stroke="#d35400" d="M60 378 Q520 320 720 50"/>
  <text class="lab" fill="#d35400" x="725" y="50">n³</text>
  <path class="f" stroke="#c0392b" d="M60 378 Q620 378 680 30"/>
  <text class="lab" fill="#c0392b" x="675" y="20">2ⁿ</text>
  <path class="f" stroke="#8b0000" d="M60 378 Q640 378 660 30"/>
  <text class="lab" fill="#8b0000" x="625" y="20">n!</text>
  <!-- hierarchy string -->
  <text class="t" x="380" y="60" text-anchor="middle" font-weight="bold">
    1 &lt; log log n &lt; log n &lt; n &lt; n log n &lt; n² &lt; n³ &lt; 2ⁿ &lt; 3ⁿ &lt; n!
  </text>
</svg>
