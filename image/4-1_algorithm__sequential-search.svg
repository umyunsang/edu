<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="system-ui,sans-serif">
  <style>
    .tb{font-size:15px;font-weight:bold}
    .t{font-size:13px;text-anchor:middle;font-family:monospace;font-weight:bold}
    .th{font-size:13px;font-weight:bold;text-anchor:middle;font-family:monospace}
    .lab{font-size:12px}
    .mono{font-family:monospace;font-size:13px}
    .cell{fill:#fff;stroke:#2c3e50;stroke-width:1.2}
    .hit{fill:#d0f5d0;stroke:#27ae60;stroke-width:2.2}
    .miss{fill:#fde2e2;stroke:#c0392b;stroke-width:1.8}
    .focus{fill:#fff2cc;stroke:#f39c12;stroke-width:2.2}
    .skip{fill:#f5f5f5;stroke:#bbb;opacity:0.55}
    .sum{fill:#fff7d6;stroke:#d4a017;stroke-width:1.5}
    .badge{fill:#c0392b}
    .badgeT{font-size:11px;fill:#fff;text-anchor:middle;font-weight:bold}
  </style>

  <text class="tb" x="450" y="22" text-anchor="middle">Ch.3 예제 — 순차 탐색 (Sequential Search): 배열 [7, 3, 9, 4, 8, 2, 6] 에서 key 찾기</text>
  <text class="lab" x="450" y="42" text-anchor="middle">왼쪽부터 하나씩 비교. 정렬 불필요. 최선 Θ(1), 최악 Θ(n), 평균 Θ(n)</text>

  <!-- Case 1: 성공 (key=4, 위치 3) -->
  <g transform="translate(30,60)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">1</text>
    <text class="tb" x="15" y="18">성공 사례 — key = 4 (배열 4번째 = 인덱스 3에 존재)</text>

    <g transform="translate(30,40)">
      <rect class="miss" x="0" y="0" width="60" height="34"/><text class="t" x="30" y="22">7</text>
      <rect class="miss" x="60" y="0" width="60" height="34"/><text class="t" x="90" y="22">3</text>
      <rect class="miss" x="120" y="0" width="60" height="34"/><text class="t" x="150" y="22">9</text>
      <rect class="hit" x="180" y="0" width="60" height="34"/><text class="t" x="210" y="22">4</text>
      <rect class="skip" x="240" y="0" width="60" height="34"/><text class="t" x="270" y="22">8</text>
      <rect class="skip" x="300" y="0" width="60" height="34"/><text class="t" x="330" y="22">2</text>
      <rect class="skip" x="360" y="0" width="60" height="34"/><text class="t" x="390" y="22">6</text>
      <text class="lab" x="30" y="50" text-anchor="middle">0</text>
      <text class="lab" x="90" y="50" text-anchor="middle">1</text>
      <text class="lab" x="150" y="50" text-anchor="middle">2</text>
      <text class="lab" x="210" y="50" text-anchor="middle" fill="#27ae60" font-weight="bold">3 ★</text>
      <text class="lab" x="270" y="50" text-anchor="middle" fill="#999">4</text>
      <text class="lab" x="330" y="50" text-anchor="middle" fill="#999">5</text>
      <text class="lab" x="390" y="50" text-anchor="middle" fill="#999">6</text>

      <text class="lab" x="460" y="10" fill="#c0392b">비교 1: 7 ≠ 4</text>
      <text class="lab" x="460" y="26" fill="#c0392b">비교 2: 3 ≠ 4</text>
      <text class="lab" x="460" y="42" fill="#c0392b">비교 3: 9 ≠ 4</text>
      <text class="lab" x="600" y="10" fill="#27ae60" font-weight="bold">비교 4: 4 = 4 ✓</text>
      <text class="lab" x="600" y="30" fill="#27ae60" font-weight="bold">→ return 3 (인덱스)</text>
    </g>
  </g>

  <!-- Case 2: 실패 (key=5) -->
  <g transform="translate(30,170)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">2</text>
    <text class="tb" x="15" y="18">실패 사례 — key = 5 (배열에 없음) → 최악 n번 비교</text>

    <g transform="translate(30,40)">
      <rect class="miss" x="0" y="0" width="60" height="34"/><text class="t" x="30" y="22">7</text>
      <rect class="miss" x="60" y="0" width="60" height="34"/><text class="t" x="90" y="22">3</text>
      <rect class="miss" x="120" y="0" width="60" height="34"/><text class="t" x="150" y="22">9</text>
      <rect class="miss" x="180" y="0" width="60" height="34"/><text class="t" x="210" y="22">4</text>
      <rect class="miss" x="240" y="0" width="60" height="34"/><text class="t" x="270" y="22">8</text>
      <rect class="miss" x="300" y="0" width="60" height="34"/><text class="t" x="330" y="22">2</text>
      <rect class="miss" x="360" y="0" width="60" height="34"/><text class="t" x="390" y="22">6</text>

      <text class="lab" x="460" y="10" fill="#c0392b" font-weight="bold">7회 비교 모두 실패</text>
      <text class="lab" x="460" y="30" fill="#c0392b">→ return −1 (없음)</text>
      <text class="lab" x="460" y="50" fill="#c0392b" font-weight="bold">최악: C_worst(n) = n</text>
    </g>
  </g>

  <!-- Step 3: 평균 비교 횟수 유도 -->
  <g transform="translate(30,290)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">3</text>
    <text class="tb" x="15" y="18">평균 비교 횟수 분석 (성공 가정, 키가 균등분포로 존재)</text>

    <rect class="sum" x="0" y="30" width="860" height="150"/>
    <text class="mono" x="15" y="52">P(key at index i) = 1/n  (균등)</text>
    <text class="mono" x="15" y="72">비교 횟수(index i에 있을 때) = i + 1  (1부터 시작)</text>
    <text class="mono" x="15" y="100" fill="#2e86de" font-weight="bold">C_avg(n) = (1/n) · Σ_{i=0}^{n−1} (i+1) = (1/n) · n(n+1)/2 = (n+1)/2</text>
    <text class="mono" x="15" y="130">성공 확률 p를 도입하면: C_avg = p·(n+1)/2 + (1−p)·n</text>
    <text class="mono" x="15" y="150">  p=1: (n+1)/2 ≈ n/2 &#160;·&#160; p=0: n  &#160;→&#160; 어느 경우든 <tspan fill="#c0392b" font-weight="bold">Θ(n)</tspan></text>
  </g>

  <!-- Step 4: 의사코드 -->
  <g transform="translate(30,475)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">4</text>
    <text class="tb" x="15" y="18">의사코드와 개선: 보초(Sentinel) 기법</text>

    <rect class="sum" x="0" y="30" width="420" height="130"/>
    <text class="lab" x="15" y="50" font-weight="bold" fill="#2e86de">표준 버전</text>
    <text class="mono" x="15" y="70">seq_search(A, n, key):</text>
    <text class="mono" x="15" y="88">  for i = 0 to n − 1:</text>
    <text class="mono" x="15" y="106">    if A[i] = key: return i</text>
    <text class="mono" x="15" y="124">  return −1</text>
    <text class="lab" x="15" y="148" fill="#c0392b">루프마다 2회 비교 (i&lt;n, A[i]=key)</text>

    <rect class="sum" x="440" y="30" width="420" height="130"/>
    <text class="lab" x="455" y="50" font-weight="bold" fill="#27ae60">보초 버전 (Sentinel)</text>
    <text class="mono" x="455" y="70">A[n] ← key  # 끝에 임시 삽입</text>
    <text class="mono" x="455" y="88">i = 0</text>
    <text class="mono" x="455" y="106">while A[i] ≠ key: i ← i + 1</text>
    <text class="mono" x="455" y="124">return i if i &lt; n else −1</text>
    <text class="lab" x="455" y="148" fill="#27ae60">경계검사 제거 — 실행시간 약 2배 빠름</text>
  </g>
</svg>
