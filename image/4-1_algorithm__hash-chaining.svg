<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="system-ui,sans-serif">
  <style>.b{fill:#eaf2fb;stroke:#2c3e50;stroke-width:1.3}.n{fill:#fff7d6;stroke:#d4a017}.nul{fill:#f6f6f6;stroke:#aaa}.ar{stroke:#555;fill:none;marker-end:url(#a)}.t{font-size:13px;text-anchor:middle}.tb{font-size:14px;font-weight:bold}.lab{font-size:13px}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker></defs>
  <text class="tb" x="390" y="22" text-anchor="middle">체이닝 (Chaining / 개방 해싱): 같은 칸에 들어오면 연결리스트로 이어붙인다</text>
  <text class="lab" x="30" y="50">해시함수 예: h(k) = k mod 7</text>

  <g transform="translate(30,70)">
    <text class="t" x="30" y="18">index</text>
    <g><rect class="b" x="60" y="0" width="60" height="30"/><text class="t" x="90" y="20">0</text></g>
    <g><rect class="b" x="60" y="30" width="60" height="30"/><text class="t" x="90" y="50">1</text></g>
    <g><rect class="b" x="60" y="60" width="60" height="30"/><text class="t" x="90" y="80">2</text></g>
    <g><rect class="b" x="60" y="90" width="60" height="30"/><text class="t" x="90" y="110">3</text></g>
    <g><rect class="b" x="60" y="120" width="60" height="30"/><text class="t" x="90" y="140">4</text></g>
    <g><rect class="b" x="60" y="150" width="60" height="30"/><text class="t" x="90" y="170">5</text></g>
    <g><rect class="b" x="60" y="180" width="60" height="30"/><text class="t" x="90" y="200">6</text></g>

    <!-- chain on bucket 0: keys 14, 7, 28 -->
    <g><rect class="n" x="150" y="0" width="55" height="30"/><text class="t" x="178" y="20">14</text></g>
    <path class="ar" d="M120 15 L150 15"/>
    <g><rect class="n" x="225" y="0" width="55" height="30"/><text class="t" x="252" y="20">7</text></g>
    <path class="ar" d="M205 15 L225 15"/>
    <g><rect class="n" x="300" y="0" width="55" height="30"/><text class="t" x="327" y="20">28</text></g>
    <path class="ar" d="M280 15 L300 15"/>
    <g><rect class="nul" x="375" y="0" width="40" height="30"/><text class="t" x="395" y="20">∅</text></g>
    <path class="ar" d="M355 15 L375 15"/>

    <!-- bucket 1: 8 -->
    <g><rect class="n" x="150" y="30" width="55" height="30"/><text class="t" x="178" y="50">8</text></g>
    <path class="ar" d="M120 45 L150 45"/>
    <g><rect class="nul" x="225" y="30" width="40" height="30"/><text class="t" x="245" y="50">∅</text></g>
    <path class="ar" d="M205 45 L225 45"/>

    <!-- bucket 3: 10, 24 -->
    <g><rect class="n" x="150" y="90" width="55" height="30"/><text class="t" x="178" y="110">10</text></g>
    <path class="ar" d="M120 105 L150 105"/>
    <g><rect class="n" x="225" y="90" width="55" height="30"/><text class="t" x="252" y="110">24</text></g>
    <path class="ar" d="M205 105 L225 105"/>
    <g><rect class="nul" x="300" y="90" width="40" height="30"/><text class="t" x="320" y="110">∅</text></g>
    <path class="ar" d="M280 105 L300 105"/>

    <!-- bucket 5: 19 -->
    <g><rect class="n" x="150" y="150" width="55" height="30"/><text class="t" x="178" y="170">19</text></g>
    <path class="ar" d="M120 165 L150 165"/>
    <g><rect class="nul" x="225" y="150" width="40" height="30"/><text class="t" x="245" y="170">∅</text></g>
    <path class="ar" d="M205 165 L225 165"/>
  </g>

  <g transform="translate(30,320)">
    <text class="tb" x="0" y="15">평균 탐색 시간:</text>
    <text class="lab" x="130" y="15">1 + α (α = n/m, 적재율). 해시함수만 잘 퍼뜨리면 사실상 O(1)</text>
    <text class="lab" x="0" y="35">장점: 삽입 간단, 테이블 꽉 차도 동작. 단점: 포인터(연결리스트) 추가 공간.</text>
  </g>
</svg>
