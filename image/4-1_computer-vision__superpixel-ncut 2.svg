<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" font-family="system-ui,sans-serif">
  <style>
    .r1{fill:#e74c3c;opacity:0.75}
    .r2{fill:#3498db;opacity:0.75}
    .r3{fill:#27ae60;opacity:0.75}
    .r4{fill:#f1c40f;opacity:0.75}
    .r5{fill:#9b59b6;opacity:0.75}
    .r6{fill:#e67e22;opacity:0.75}
    .frame{fill:none;stroke:#333;stroke-width:1.5}
    .node{fill:#fff;stroke:#333;stroke-width:1.5}
    .edge{stroke:#333;stroke-width:1;fill:none}
    .cut{stroke:#c0392b;stroke-width:2.5;fill:none;stroke-dasharray:6 4}
    .t{font-size:12px;text-anchor:middle}
    .tb{font-size:15px;font-weight:bold}
    .lab{font-size:13px}
  </style>
  <text class="tb" x="440" y="22" text-anchor="middle">슈퍼픽셀 + Normalized Cut: 픽셀을 덩어리로 묶어 분할</text>

  <!-- Original pixels -->
  <g transform="translate(30,55)">
    <text class="tb" x="100" y="0" text-anchor="middle">원본 영상 (수많은 픽셀)</text>
    <rect class="frame" x="0" y="15" width="200" height="140"/>
    <g stroke="#ddd" stroke-width="0.5">
      <!-- fake pixel grid -->
      <g>
        <path d="M10 25 L190 25 M10 45 L190 45 M10 65 L190 65 M10 85 L190 85 M10 105 L190 105 M10 125 L190 125 M10 145 L190 145" stroke="#ddd"/>
        <path d="M30 25 L30 145 M50 25 L50 145 M70 25 L70 145 M90 25 L90 145 M110 25 L110 145 M130 25 L130 145 M150 25 L150 145 M170 25 L170 145" stroke="#ddd"/>
      </g>
    </g>
    <!-- some color regions -->
    <rect class="r1" x="10" y="25" width="90" height="60"/>
    <rect class="r2" x="100" y="25" width="90" height="60"/>
    <rect class="r3" x="10" y="85" width="100" height="70"/>
    <rect class="r4" x="110" y="85" width="80" height="70"/>
  </g>

  <!-- Superpixels -->
  <g transform="translate(260,55)">
    <text class="tb" x="100" y="0" text-anchor="middle">슈퍼픽셀 (SLIC 등)</text>
    <rect class="frame" x="0" y="15" width="200" height="140"/>
    <g>
      <polygon class="r1" points="10,25 55,25 60,55 50,80 10,80"/>
      <polygon class="r1" points="55,25 110,25 105,55 95,80 50,80 60,55"/>
      <polygon class="r2" points="110,25 160,25 155,60 145,85 105,80 105,55"/>
      <polygon class="r2" points="160,25 190,25 190,60 155,60"/>
      <polygon class="r3" points="10,80 50,80 55,115 30,145 10,145"/>
      <polygon class="r3" points="50,80 95,80 100,115 70,145 30,145 55,115"/>
      <polygon class="r4" points="95,80 145,85 140,115 130,145 70,145 100,115"/>
      <polygon class="r4" points="145,85 190,60 190,145 130,145 140,115"/>
    </g>
    <g stroke="#000" stroke-width="1.2" fill="none">
      <polyline points="10,80 50,80 95,80 145,85 190,60"/>
      <line x1="55" y1="25" x2="60" y2="55"/>
      <line x1="60" y1="55" x2="50" y2="80"/>
      <line x1="110" y1="25" x2="105" y2="55"/>
      <line x1="105" y1="55" x2="95" y2="80"/>
      <line x1="155" y1="60" x2="145" y2="85"/>
      <line x1="55" y1="115" x2="30" y2="145"/>
      <line x1="100" y1="115" x2="70" y2="145"/>
      <line x1="140" y1="115" x2="130" y2="145"/>
    </g>
    <text class="t" x="100" y="175">지각적으로 비슷한 픽셀을</text>
    <text class="t" x="100" y="193">작은 덩어리로 미리 그룹화</text>
  </g>

  <!-- Graph + N-cut -->
  <g transform="translate(500,55)">
    <text class="tb" x="170" y="0" text-anchor="middle">그래프로 보고 N-Cut으로 자르기</text>
    <rect class="frame" x="0" y="15" width="340" height="140"/>
    <!-- nodes A,B,C,D,E,F -->
    <g>
      <circle class="node" cx="60" cy="55" r="16"/><text class="t" x="60" y="60">A</text>
      <circle class="node" cx="130" cy="45" r="16"/><text class="t" x="130" y="50">B</text>
      <circle class="node" cx="110" cy="110" r="16"/><text class="t" x="110" y="115">C</text>
      <circle class="node" cx="230" cy="50" r="16"/><text class="t" x="230" y="55">D</text>
      <circle class="node" cx="290" cy="90" r="16"/><text class="t" x="290" y="95">E</text>
      <circle class="node" cx="220" cy="130" r="16"/><text class="t" x="220" y="135">F</text>
    </g>
    <!-- heavy edges within groups (thick black) -->
    <g stroke="#333" stroke-width="3.5" fill="none">
      <line x1="60" y1="55" x2="130" y2="45"/>
      <line x1="130" y1="45" x2="110" y2="110"/>
      <line x1="60" y1="55" x2="110" y2="110"/>
      <line x1="230" y1="50" x2="290" y2="90"/>
      <line x1="290" y1="90" x2="220" y2="130"/>
      <line x1="230" y1="50" x2="220" y2="130"/>
    </g>
    <!-- light edges between groups (thin) -->
    <g stroke="#999" stroke-width="1" fill="none">
      <line x1="130" y1="45" x2="230" y2="50"/>
      <line x1="110" y1="110" x2="220" y2="130"/>
    </g>
    <!-- cut line -->
    <line class="cut" x1="175" y1="10" x2="175" y2="160"/>
    <text class="t" x="175" y="175" fill="#c0392b" font-weight="bold">N-Cut 경계</text>
  </g>

  <!-- Explanation boxes -->
  <g transform="translate(30,240)">
    <rect x="0" y="0" width="400" height="150" fill="#eaf2fb" stroke="#2e86de"/>
    <text class="tb" x="15" y="22">슈퍼픽셀 (Superpixel)</text>
    <text class="lab" x="15" y="46">• 수백만 픽셀을 수백 개의 덩어리로 축약</text>
    <text class="lab" x="15" y="66">• 각 덩어리 안의 픽셀은 색·위치가 비슷함</text>
    <text class="lab" x="15" y="86">• 이후 처리(분할, 추적 등)의 기본 단위</text>
    <text class="lab" x="15" y="106">• 대표 알고리즘: SLIC (k-means 기반), Felzenszwalb</text>
    <text class="lab" x="15" y="130" fill="#c0392b" font-weight="bold">핵심 이득: 계산량 ↓, 경계 보존 ↑</text>
  </g>

  <g transform="translate(450,240)">
    <rect x="0" y="0" width="400" height="150" fill="#d0f5d0" stroke="#27ae60"/>
    <text class="tb" x="15" y="22">Normalized Cut</text>
    <text class="lab" x="15" y="46">• 영상을 그래프로: 노드=슈퍼픽셀, 에지=유사도</text>
    <text class="lab" x="15" y="66">• 단순 Min-Cut: 작은 그룹을 선호해 치우침</text>
    <text class="lab" x="15" y="86">• N-Cut: cut(A,B) / vol(A) + cut(A,B) / vol(B)</text>
    <text class="lab" x="15" y="106">• "크기로 정규화" → 균형 잡힌 분할</text>
    <text class="lab" x="15" y="130" fill="#c0392b" font-weight="bold">내부 유사도↑, 경계 유사도↓인 분할 찾기</text>
  </g>

  <g transform="translate(30,400)">
    <rect x="0" y="0" width="820" height="80" fill="#fff7d6" stroke="#d4a017"/>
    <text class="tb" x="15" y="22">한눈에 보는 파이프라인</text>
    <text class="lab" x="15" y="46">픽셀 → ① SLIC으로 슈퍼픽셀 생성 → ② 슈퍼픽셀 간 유사도 그래프 → ③ N-Cut으로 균형 분할 → 객체 영역</text>
    <text class="lab" x="15" y="68" fill="#c0392b" font-weight="bold">요점: 슈퍼픽셀은 "데이터 축약기", N-Cut은 "균형 잡힌 분할 기준".</text>
  </g>
</svg>
