<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="system-ui,sans-serif">
  <style>
    .easy-easy{fill:#d0f5d0;stroke:#27ae60;stroke-width:2}
    .hard-easy{fill:#f7dc6f;stroke:#d4a017;stroke-width:3}
    .easy-hard{fill:#fadbd8;stroke:#c0392b;stroke-width:2}
    .hard-hard{fill:#d6dbdf;stroke:#555;stroke-width:2}
    .title{font-size:18px;font-weight:bold;text-anchor:middle}
    .cell{font-size:14px;text-anchor:middle}
    .label{font-size:16px;font-weight:bold;text-anchor:middle}
    .ax{stroke:#333;stroke-width:1.5;fill:none}
    .axlab{font-size:14px;font-weight:bold;text-anchor:middle}
    .ideal{fill:#c0392b;font-weight:bold;font-size:15px;text-anchor:middle}
  </style>

  <text class="title" x="550" y="40">글쓰기 네 가지 부류 — 가로: 내용 / 세로: 표현</text>

  <!-- Axes labels -->
  <text class="axlab" x="310" y="90">내용 쉬움</text>
  <text class="axlab" x="780" y="90">내용 어려움</text>
  <text class="axlab" x="150" y="245">표현 쉬움</text>
  <text class="axlab" x="150" y="445">표현 어려움</text>

  <!-- Cell 1: Easy content, Easy expression -->
  <rect class="easy-easy" x="220" y="120" width="370" height="200"/>
  <text class="label" x="405" y="160">쉽게 쉽게</text>
  <text class="cell" x="405" y="195">쉬운 내용을 쉽게 표현</text>
  <text class="cell" x="405" y="225">일상 대화 · 초보자 글</text>
  <text class="cell" x="405" y="270">— 가장 흔하지만</text>
  <text class="cell" x="405" y="295">깊이가 부족하다</text>

  <!-- Cell 2: Hard content, Easy expression (ideal) -->
  <rect class="hard-easy" x="600" y="120" width="370" height="200"/>
  <text class="label" x="785" y="160">어렵게 쉽게 ★</text>
  <text class="cell" x="785" y="195">어려운 내용을 쉽게 표현</text>
  <text class="cell" x="785" y="225">과학 대중서 · 파인만 스타일</text>
  <text class="ideal" x="785" y="275">이상적 · 공학도 목표</text>

  <!-- Cell 3: Easy content, Hard expression (bad) -->
  <rect class="easy-hard" x="220" y="340" width="370" height="200"/>
  <text class="label" x="405" y="380">쉽게 어렵게</text>
  <text class="cell" x="405" y="415">쉬운 내용을 어렵게 표현</text>
  <text class="cell" x="405" y="445">허세 글 · 현학적 문체</text>
  <text class="cell" x="405" y="490" fill="#c0392b" font-weight="bold">— 가장 나쁨</text>

  <!-- Cell 4: Hard content, Hard expression -->
  <rect class="hard-hard" x="600" y="340" width="370" height="200"/>
  <text class="label" x="785" y="380">어렵게 어렵게</text>
  <text class="cell" x="785" y="415">어려운 내용을 어렵게 표현</text>
  <text class="cell" x="785" y="445">전문 논문 · 매뉴얼</text>
  <text class="cell" x="785" y="490">— 전문가끼리는 효율적</text>

  <!-- Bottom note -->
  <rect x="60" y="580" width="980" height="90" fill="#fff7d6" stroke="#d4a017"/>
  <text x="80" y="615" font-size="15" fill="#c0392b" font-weight="bold">시험 핵심</text>
  <text x="80" y="640" font-size="14">이상적인 글쓰기 = "어려운 내용을 쉽게 쓴다"</text>
  <text x="80" y="662" font-size="13">공학도에게 가장 필요한 역량이다</text>
</svg>
