<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="system-ui,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
  </defs>
  <style>
    .box{fill:#eaf2fb;stroke:#2c3e50;stroke-width:1.5}
    .step{fill:#fff2cc;stroke:#d4a017;stroke-width:1.5}
    .done{fill:#d0f5d0;stroke:#27ae60;stroke-width:1.8}
    .sum{fill:#fff7d6;stroke:#b08a1f;stroke-width:1.5}
    .t{font-size:14px;fill:#1e2a38}
    .tc{font-size:14px;text-anchor:middle;fill:#1e2a38}
    .m{font-size:14px;font-family:ui-monospace,Menlo,monospace;fill:#1e2a38}
    .mc{font-size:14px;font-family:ui-monospace,Menlo,monospace;text-anchor:middle;fill:#1e2a38}
    .lab{font-size:13px;fill:#4a5b6c}
    .tb{font-size:16px;font-weight:bold;text-anchor:middle;fill:#1e2a38}
    .ln{stroke:#2c3e50;stroke-width:1.5;fill:none}
  </style>

  <text class="tb" x="550" y="30">순차합 1+2+...+n 효율성 분석: 기본연산 세기 → Σ 전개 → Θ(n)</text>

  <!-- 의사코드 -->
  <g>
    <rect class="box" x="40" y="60" width="440" height="170" rx="8"/>
    <text class="lab" x="55" y="82">① 의사코드</text>
    <text class="m" x="55" y="108">sum(n):</text>
    <text class="m" x="55" y="128">  s ← 0</text>
    <text class="m" x="55" y="148">  for i ← 1 to n do</text>
    <text class="m" x="55" y="168">    s ← s + i        ← 기본연산</text>
    <text class="m" x="55" y="188">  return s</text>
    <text class="lab" x="55" y="215">입력 크기: n    ·    기본연산: 덧셈 1회</text>
  </g>

  <!-- 카운트 -->
  <g>
    <rect class="step" x="520" y="60" width="540" height="170" rx="8"/>
    <text class="lab" x="535" y="82">② 실행 횟수 세기</text>
    <text class="m" x="535" y="108">i = 1 → 덧셈 1회</text>
    <text class="m" x="535" y="128">i = 2 → 덧셈 1회</text>
    <text class="m" x="535" y="148">i = 3 → 덧셈 1회</text>
    <text class="m" x="535" y="168">  ...</text>
    <text class="m" x="535" y="188">i = n → 덧셈 1회</text>
    <text class="t" x="535" y="215">총 덧셈 횟수 C(n) = n</text>
  </g>

  <path class="ln" d="M480,145 L520,145" marker-end="url(#ar)"/>

  <!-- Sigma 전개 -->
  <g>
    <rect class="sum" x="40" y="260" width="1020" height="110" rx="8"/>
    <text class="lab" x="55" y="282">③ Σ 표기로 전개</text>
    <text class="mc" x="550" y="320">C(n) = Σ_{i=1..n} 1 = 1 + 1 + ... + 1  (n번)  =  n</text>
    <text class="tc" x="550" y="352">※ 만약 본문이 "s ← s + i"의 덧셈+대입을 각각 세면 계수가 2가 되지만 점근적으로 동일</text>
  </g>

  <!-- Theta 유도 -->
  <g>
    <rect class="done" x="40" y="400" width="1020" height="110" rx="8"/>
    <text class="lab" x="55" y="422">④ 점근 표기 유도</text>
    <text class="mc" x="550" y="455">상한: C(n) = n ≤ 1·n         하한: C(n) = n ≥ 1·n         ⇒ C(n) ∈ Θ(n)</text>
    <text class="tc" x="550" y="488">결론: 순차합은 선형 시간. 입력 n이 10배 커지면 시간도 약 10배 증가.</text>
  </g>
</svg>
