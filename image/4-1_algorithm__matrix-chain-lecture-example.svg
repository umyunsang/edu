<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520">
  <rect width="1080" height="520" fill="#f8fafc"/>
  <text x="42" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">연쇄 행렬곱셈 수업 예제</text>
  <text x="42" y="84" font-family="Arial, sans-serif" font-size="16" fill="#475569">A1 100x2, A2 2x50, A3 50x3, A4 3x10. 같은 행렬이라도 괄호 위치에 따라 비용이 크게 달라진다.</text>

  <g font-family="Arial, sans-serif" font-size="15">
    <rect x="56" y="125" width="230" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="80" y="160" font-size="20" font-weight="700" fill="#334155">행렬 크기</text>
    <text x="80" y="198" fill="#111827">A1: 100 x 2</text>
    <text x="80" y="228" fill="#111827">A2: 2 x 50</text>
    <text x="80" y="258" fill="#111827">A3: 50 x 3</text>
    <text x="80" y="288" fill="#111827">A4: 3 x 10</text>
    <text x="80" y="318" fill="#64748b">d = [100, 2, 50, 3, 10]</text>

    <rect x="330" y="125" width="680" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="360" y="160" font-size="20" font-weight="700" fill="#334155">가능한 괄호와 스칼라 곱셈 수</text>
    <text x="365" y="202" fill="#111827">(((A1 A2) A3) A4)</text>
    <text x="785" y="202" text-anchor="end" fill="#111827">14500</text>
    <text x="365" y="244" fill="#111827">(A1 (A2 (A3 A4)))</text>
    <text x="785" y="244" text-anchor="end" fill="#111827">3600</text>
    <text x="365" y="286" fill="#111827">((A1 A2) (A3 A4))</text>
    <text x="785" y="286" text-anchor="end" fill="#111827">61500</text>
    <text x="365" y="328" fill="#111827">((A1 (A2 A3)) A4)</text>
    <text x="785" y="328" text-anchor="end" fill="#111827">3900</text>
    <rect x="350" y="352" width="560" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="365" y="382" font-weight="700" fill="#14532d">(A1 ((A2 A3) A4))</text>
    <text x="785" y="382" text-anchor="end" font-weight="700" fill="#14532d">2360</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="56" y="365" width="230" height="86" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="80" y="398" font-size="17" font-weight="700" fill="#92400e">DP가 필요한 이유</text>
    <text x="80" y="426" font-size="15" fill="#334155">모든 괄호는 지수적으로 증가</text>
  </g>
</svg>
