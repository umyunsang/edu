<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui,sans-serif">
  <style>.c{fill:#fff;stroke:#2c3e50;stroke-width:1.5}.min{fill:#ffe6e6;stroke:#c0392b;stroke-width:2}.done{fill:#e6f7e6;stroke:#27ae60}.t{font-size:14px;text-anchor:middle}.lab{font-size:13px}.tb{font-size:14px;font-weight:bold}</style>
  <text class="tb" x="360" y="22" text-anchor="middle">선택 정렬: 매 회차마다 "제일 작은 값"을 맨 앞으로 보내기</text>

  <g transform="translate(40,50)">
    <text class="lab" x="0" y="15">초기</text>
    <g><rect class="c" x="60" y="0" width="50" height="40"/><text class="t" x="85" y="26">29</text></g>
    <g><rect class="c" x="110" y="0" width="50" height="40"/><text class="t" x="135" y="26">10</text></g>
    <g><rect class="c" x="160" y="0" width="50" height="40"/><text class="t" x="185" y="26">14</text></g>
    <g><rect class="c" x="210" y="0" width="50" height="40"/><text class="t" x="235" y="26">37</text></g>
    <g><rect class="c" x="260" y="0" width="50" height="40"/><text class="t" x="285" y="26">13</text></g>
    <text class="lab" x="330" y="15">← 전체에서 min=10 찾기</text>
    <text class="lab" x="330" y="32">   교환(29↔10)</text>
  </g>

  <g transform="translate(40,110)">
    <text class="lab" x="0" y="15">1회</text>
    <g><rect class="done" x="60" y="0" width="50" height="40"/><text class="t" x="85" y="26">10</text></g>
    <g><rect class="c" x="110" y="0" width="50" height="40"/><text class="t" x="135" y="26">29</text></g>
    <g><rect class="c" x="160" y="0" width="50" height="40"/><text class="t" x="185" y="26">14</text></g>
    <g><rect class="c" x="210" y="0" width="50" height="40"/><text class="t" x="235" y="26">37</text></g>
    <g><rect class="min" x="260" y="0" width="50" height="40"/><text class="t" x="285" y="26">13</text></g>
    <text class="lab" x="330" y="15">← 나머지에서 min=13</text>
    <text class="lab" x="330" y="32">   교환(29↔13)</text>
  </g>

  <g transform="translate(40,170)">
    <text class="lab" x="0" y="15">2회</text>
    <g><rect class="done" x="60" y="0" width="50" height="40"/><text class="t" x="85" y="26">10</text></g>
    <g><rect class="done" x="110" y="0" width="50" height="40"/><text class="t" x="135" y="26">13</text></g>
    <g><rect class="min" x="160" y="0" width="50" height="40"/><text class="t" x="185" y="26">14</text></g>
    <g><rect class="c" x="210" y="0" width="50" height="40"/><text class="t" x="235" y="26">37</text></g>
    <g><rect class="c" x="260" y="0" width="50" height="40"/><text class="t" x="285" y="26">29</text></g>
    <text class="lab" x="330" y="15">← 나머지 min=14 (이미 자리)</text>
  </g>

  <g transform="translate(40,230)">
    <text class="lab" x="0" y="15">3회</text>
    <g><rect class="done" x="60" y="0" width="50" height="40"/><text class="t" x="85" y="26">10</text></g>
    <g><rect class="done" x="110" y="0" width="50" height="40"/><text class="t" x="135" y="26">13</text></g>
    <g><rect class="done" x="160" y="0" width="50" height="40"/><text class="t" x="185" y="26">14</text></g>
    <g><rect class="c" x="210" y="0" width="50" height="40"/><text class="t" x="235" y="26">37</text></g>
    <g><rect class="min" x="260" y="0" width="50" height="40"/><text class="t" x="285" y="26">29</text></g>
    <text class="lab" x="330" y="15">← 나머지 min=29</text>
    <text class="lab" x="330" y="32">   교환(37↔29)</text>
  </g>

  <g transform="translate(40,290)">
    <text class="lab" x="0" y="15">완료</text>
    <g><rect class="done" x="60" y="0" width="50" height="40"/><text class="t" x="85" y="26">10</text></g>
    <g><rect class="done" x="110" y="0" width="50" height="40"/><text class="t" x="135" y="26">13</text></g>
    <g><rect class="done" x="160" y="0" width="50" height="40"/><text class="t" x="185" y="26">14</text></g>
    <g><rect class="done" x="210" y="0" width="50" height="40"/><text class="t" x="235" y="26">29</text></g>
    <g><rect class="done" x="260" y="0" width="50" height="40"/><text class="t" x="285" y="26">37</text></g>
    <text class="lab" x="330" y="25">정렬 완료</text>
  </g>

  <g transform="translate(40,355)">
    <text class="tb" x="0" y="15">포인트:</text>
    <text class="lab" x="70" y="15">비교 횟수는 n(n-1)/2 → 항상 Θ(n²). 교환은 최대 n-1회로 적음.</text>
    <text class="lab" x="0" y="35">"최솟값 찾기"를 n번 반복하는 단순·무식한(억지) 기법의 대표 예.</text>
  </g>
</svg>
