<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="system-ui,sans-serif">
  <style>
    .tb{font-size:15px;font-weight:bold}
    .th{font-size:13px;font-weight:bold;text-anchor:middle;font-family:monospace}
    .t{font-size:13px;text-anchor:middle;font-family:monospace;font-weight:bold}
    .lab{font-size:12px}
    .mono{font-family:monospace;font-size:13px}
    .cell{fill:#fff;stroke:#2c3e50;stroke-width:1.2}
    .focus{fill:#fff2cc;stroke:#f39c12;stroke-width:2.5}
    .step{fill:#eaf2fb;stroke:#2e86de;stroke-width:1.5}
    .done{fill:#d0f5d0;stroke:#27ae60;stroke-width:1.8}
    .sum{fill:#fff7d6;stroke:#d4a017;stroke-width:1.5}
    .bad{fill:#fde2e2;stroke:#c0392b;stroke-width:1.5}
    .badge{fill:#c0392b}
    .badgeT{font-size:11px;fill:#fff;text-anchor:middle;font-weight:bold}
    .ar{stroke:#2e86de;stroke-width:1.8;fill:none;marker-end:url(#bl)}
    .arG{stroke:#27ae60;stroke-width:2;fill:none;marker-end:url(#gn)}
  </style>
  <defs>
    <marker id="bl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2e86de"/></marker>
    <marker id="gn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker>
  </defs>

  <text class="tb" x="450" y="22" text-anchor="middle">Ch.1 예제 — 유클리드 호제법 (Euclidean GCD): gcd(60, 24)</text>
  <text class="lab" x="450" y="42" text-anchor="middle">핵심 정리: <tspan font-family="monospace" font-weight="bold">gcd(a, b) = gcd(b, a mod b)</tspan>, <tspan font-family="monospace" font-weight="bold">gcd(a, 0) = a</tspan> → 나머지가 0이 되는 순간 종료</text>

  <!-- Step 1: 세 가지 접근 비교 -->
  <g transform="translate(30,60)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">1</text>
    <text class="tb" x="15" y="18">세 가지 방법 비교 — 유클리드가 압도적</text>

    <rect class="bad" x="15" y="35" width="265" height="95"/>
    <text class="lab" x="148" y="55" text-anchor="middle" font-weight="bold">연속 정수 검사 (억지)</text>
    <text class="mono" x="25" y="75">t = min(a, b)</text>
    <text class="mono" x="25" y="92">while a%t≠0 or b%t≠0:</text>
    <text class="mono" x="25" y="108">  t ← t − 1</text>
    <text class="lab" x="148" y="125" text-anchor="middle" fill="#c0392b" font-weight="bold">O(min(a,b)) — 느림</text>

    <rect class="step" x="290" y="35" width="265" height="95"/>
    <text class="lab" x="422" y="55" text-anchor="middle" font-weight="bold">소인수분해 공통교집합</text>
    <text class="mono" x="300" y="75">60 = 2²·3·5</text>
    <text class="mono" x="300" y="92">24 = 2³·3</text>
    <text class="mono" x="300" y="108">공통 = 2²·3 = 12</text>
    <text class="lab" x="422" y="125" text-anchor="middle" fill="#2e86de">정수 분해 필요 — 어려움</text>

    <rect class="done" x="565" y="35" width="290" height="95"/>
    <text class="lab" x="710" y="55" text-anchor="middle" font-weight="bold">유클리드 호제법 ✓</text>
    <text class="mono" x="575" y="75">while b ≠ 0:</text>
    <text class="mono" x="575" y="92">  a, b ← b, a mod b</text>
    <text class="mono" x="575" y="108">return a</text>
    <text class="lab" x="710" y="125" text-anchor="middle" fill="#27ae60" font-weight="bold">O(log(min(a,b))) — 최적</text>
  </g>

  <!-- Step 2: gcd(60,24) 단계별 추적 -->
  <g transform="translate(30,215)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">2</text>
    <text class="tb" x="15" y="18">gcd(60, 24) 단계별 실행 추적</text>

    <g transform="translate(0,40)">
      <rect class="cell" x="15" y="0" width="80" height="30"/><text class="th" x="55" y="20">단계</text>
      <rect class="cell" x="95" y="0" width="90" height="30"/><text class="th" x="140" y="20">a</text>
      <rect class="cell" x="185" y="0" width="90" height="30"/><text class="th" x="230" y="20">b</text>
      <rect class="cell" x="275" y="0" width="150" height="30"/><text class="th" x="350" y="20">a mod b</text>
      <rect class="cell" x="425" y="0" width="200" height="30"/><text class="th" x="525" y="20">조건 b ≠ 0 ?</text>
      <rect class="cell" x="625" y="0" width="230" height="30"/><text class="th" x="740" y="20">다음 (a ← b, b ← a mod b)</text>

      <!-- Row 1 -->
      <rect class="step" x="15" y="30" width="80" height="30"/><text class="th" x="55" y="50">0 (초기)</text>
      <rect class="step" x="95" y="30" width="90" height="30"/><text class="t" x="140" y="50">60</text>
      <rect class="step" x="185" y="30" width="90" height="30"/><text class="t" x="230" y="50">24</text>
      <rect class="focus" x="275" y="30" width="150" height="30"/><text class="t" x="350" y="50">60 mod 24 = 12</text>
      <rect class="step" x="425" y="30" width="200" height="30"/><text class="t" x="525" y="50">24 ≠ 0 → 계속</text>
      <rect class="step" x="625" y="30" width="230" height="30"/><text class="t" x="740" y="50">(24, 12)</text>

      <!-- Row 2 -->
      <rect class="step" x="15" y="60" width="80" height="30"/><text class="th" x="55" y="80">1</text>
      <rect class="step" x="95" y="60" width="90" height="30"/><text class="t" x="140" y="80">24</text>
      <rect class="step" x="185" y="60" width="90" height="30"/><text class="t" x="230" y="80">12</text>
      <rect class="focus" x="275" y="60" width="150" height="30"/><text class="t" x="350" y="80">24 mod 12 = 0</text>
      <rect class="step" x="425" y="60" width="200" height="30"/><text class="t" x="525" y="80">12 ≠ 0 → 계속</text>
      <rect class="step" x="625" y="60" width="230" height="30"/><text class="t" x="740" y="80">(12, 0)</text>

      <!-- Row 3 -->
      <rect class="done" x="15" y="90" width="80" height="30"/><text class="th" x="55" y="110">2 (종료)</text>
      <rect class="done" x="95" y="90" width="90" height="30"/><text class="t" x="140" y="110">12</text>
      <rect class="done" x="185" y="90" width="90" height="30"/><text class="t" x="230" y="110">0</text>
      <rect class="done" x="275" y="90" width="150" height="30"/><text class="t" x="350" y="110">—</text>
      <rect class="done" x="425" y="90" width="200" height="30"/><text class="t" x="525" y="110" fill="#27ae60" font-weight="bold">b = 0 → STOP</text>
      <rect class="done" x="625" y="90" width="230" height="30"/><text class="t" x="740" y="110" fill="#27ae60" font-weight="bold">return a = 12</text>
    </g>
  </g>

  <!-- Step 3: 왜 작동하는가 -->
  <g transform="translate(30,380)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">3</text>
    <text class="tb" x="15" y="18">정당성: 왜 gcd(a, b) = gcd(b, a mod b) 인가?</text>

    <rect class="sum" x="0" y="30" width="860" height="95"/>
    <text class="mono" x="15" y="52">핵심: a = qb + r (단, r = a mod b)</text>
    <text class="mono" x="15" y="72">  · a, b의 공약수 d  →  d | a, d | b  →  d | (a − qb) = r  ⇒  d는 b, r의 공약수</text>
    <text class="mono" x="15" y="92">  · b, r의 공약수 d  →  d | b, d | r  →  d | (qb + r) = a  ⇒  d는 a, b의 공약수</text>
    <text class="lab" x="15" y="115" fill="#c0392b" font-weight="bold">∴ 두 공약수 집합이 동일 ⇒ 최대공약수도 동일 ⇒ gcd(a,b) = gcd(b, a mod b)</text>
  </g>

  <!-- Step 4: 복잡도 -->
  <g transform="translate(30,500)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">4</text>
    <text class="tb" x="15" y="18">시간 복잡도 — 감소 속도가 로그</text>

    <rect class="sum" x="0" y="30" width="860" height="85"/>
    <text class="lab" x="15" y="50" fill="#2e86de" font-weight="bold">Lamé 정리:</text>
    <text class="mono" x="130" y="50">호출 횟수 ≤ 5·log₁₀(min(a, b))  (피보나치 수가 최악 입력)</text>
    <text class="lab" x="15" y="72" fill="#27ae60" font-weight="bold">관찰:</text>
    <text class="mono" x="65" y="72">두 단계마다 작은 값이 최소 절반 이하로 줄어듦  →  <tspan fill="#c0392b" font-weight="bold">T(n) = O(log n)</tspan></text>
    <text class="lab" x="15" y="95" fill="#c0392b" font-weight="bold">체크:</text>
    <text class="mono" x="65" y="95">gcd(60, 24) → 2단계 만에 종료. 억지(24회 시도)보다 <tspan fill="#27ae60" font-weight="bold">12배 빠름</tspan></text>
  </g>
</svg>
