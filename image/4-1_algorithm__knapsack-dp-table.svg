<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <rect width="1000" height="520" fill="#f8fafc"/>
  <text x="42" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">0-1 Knapsack DP 표 채우기</text>
  <text x="42" y="84" font-family="Arial, sans-serif" font-size="16" fill="#475569">K[i][w] = 앞 i개 물건만 보고 용량 w일 때 최대 가치</text>

  <g font-family="Arial, sans-serif" font-size="16">
    <text x="52" y="130" font-weight="700" fill="#334155">물건 예시</text>
    <rect x="52" y="150" width="230" height="42" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="72" y="176" fill="#111827">i</text><text x="130" y="176" fill="#111827">무게</text><text x="205" y="176" fill="#111827">가치</text>
    <rect x="52" y="192" width="230" height="42" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="72" y="218">1</text><text x="130" y="218">2</text><text x="205" y="218">40</text>
    <rect x="52" y="234" width="230" height="42" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="72" y="260">2</text><text x="130" y="260">5</text><text x="205" y="260">30</text>
    <rect x="52" y="276" width="230" height="42" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="72" y="302">3</text><text x="130" y="302">10</text><text x="205" y="302">50</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <text x="560" y="130" font-size="18" font-weight="700" fill="#334155">용량 W별 DP 표</text>
    <g>
      <rect x="360" y="150" width="90" height="42" fill="#e2e8f0" stroke="#94a3b8"/>
      <rect x="450" y="150" width="90" height="42" fill="#e2e8f0" stroke="#94a3b8"/>
      <rect x="540" y="150" width="90" height="42" fill="#e2e8f0" stroke="#94a3b8"/>
      <rect x="630" y="150" width="90" height="42" fill="#e2e8f0" stroke="#94a3b8"/>
      <rect x="720" y="150" width="90" height="42" fill="#e2e8f0" stroke="#94a3b8"/>
      <text x="405" y="176">i \ w</text><text x="495" y="176">0</text><text x="585" y="176">2</text><text x="675" y="176">7</text><text x="765" y="176">12</text>
    </g>
    <g>
      <rect x="360" y="192" width="90" height="42" fill="#e2e8f0" stroke="#94a3b8"/>
      <rect x="450" y="192" width="90" height="42" fill="#fff" stroke="#cbd5e1"/>
      <rect x="540" y="192" width="90" height="42" fill="#fff" stroke="#cbd5e1"/>
      <rect x="630" y="192" width="90" height="42" fill="#fff" stroke="#cbd5e1"/>
      <rect x="720" y="192" width="90" height="42" fill="#fff" stroke="#cbd5e1"/>
      <text x="405" y="218">0</text><text x="495" y="218">0</text><text x="585" y="218">0</text><text x="675" y="218">0</text><text x="765" y="218">0</text>
    </g>
    <g>
      <rect x="360" y="234" width="90" height="42" fill="#e2e8f0" stroke="#94a3b8"/>
      <rect x="450" y="234" width="90" height="42" fill="#fff" stroke="#cbd5e1"/>
      <rect x="540" y="234" width="90" height="42" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <rect x="630" y="234" width="90" height="42" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <rect x="720" y="234" width="90" height="42" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="405" y="260">1</text><text x="495" y="260">0</text><text x="585" y="260">40</text><text x="675" y="260">40</text><text x="765" y="260">40</text>
    </g>
    <g>
      <rect x="360" y="276" width="90" height="42" fill="#e2e8f0" stroke="#94a3b8"/>
      <rect x="450" y="276" width="90" height="42" fill="#fff" stroke="#cbd5e1"/>
      <rect x="540" y="276" width="90" height="42" fill="#fff" stroke="#cbd5e1"/>
      <rect x="630" y="276" width="90" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <rect x="720" y="276" width="90" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="405" y="302">2</text><text x="495" y="302">0</text><text x="585" y="302">40</text><text x="675" y="302">70</text><text x="765" y="302">70</text>
    </g>
    <g>
      <rect x="360" y="318" width="90" height="42" fill="#e2e8f0" stroke="#94a3b8"/>
      <rect x="450" y="318" width="90" height="42" fill="#fff" stroke="#cbd5e1"/>
      <rect x="540" y="318" width="90" height="42" fill="#fff" stroke="#cbd5e1"/>
      <rect x="630" y="318" width="90" height="42" fill="#fff" stroke="#cbd5e1"/>
      <rect x="720" y="318" width="90" height="42" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="405" y="344">3</text><text x="495" y="344">0</text><text x="585" y="344">40</text><text x="675" y="344">70</text><text x="765" y="344">90</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="55" y="365" width="870" height="105" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="80" y="402" font-weight="700" fill="#111827">한 칸 계산</text>
    <text x="80" y="434" fill="#334155">K[i][w] = max(위 칸 K[i-1][w], value_i + K[i-1][w-weight_i])</text>
    <text x="80" y="462" fill="#334155">복원은 마지막 칸에서 위 칸과 값이 같은지 비교하며 거꾸로 이동한다.</text>
  </g>
</svg>
