<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui,sans-serif">
  <style>
    .title{font-size:17px;font-weight:bold;text-anchor:middle}
    .sub{font-size:13px;font-weight:bold;fill:#222}
    .note{font-size:12px;fill:#555}
    .ax{font-size:11px;fill:#555;text-anchor:middle}
    .axlbl{font-size:12px;fill:#333;font-weight:bold}
    .nodelabel{font-size:15px;font-weight:bold;text-anchor:end;dominant-baseline:central;fill:#2c3e50}
    .bar0{fill:#e8f4fc;stroke:#2980b9;stroke-width:1.5}
    .bar1{fill:#d4e9f7;stroke:#2471a3;stroke-width:1.5}
    .bar2{fill:#aed6f1;stroke:#1f618d;stroke-width:1.5}
    .bar3{fill:#7fb3d5;stroke:#154360;stroke-width:1.5}
    .d{fill:#2980b9;font-weight:bold;font-size:11px;text-anchor:middle}
    .f{fill:#c0392b;font-weight:bold;font-size:11px;text-anchor:middle}
    .grid{stroke:#ececec;stroke-width:0.8}
    .gridmajor{stroke:#bdbdbd;stroke-width:1;stroke-dasharray:3 3}
    .finishtick{stroke:#c0392b;stroke-width:1.5;stroke-dasharray:2 2}
    .pushlbl{font-size:10px;fill:#c0392b;text-anchor:middle;font-weight:bold}
    .resbox{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.8}
    .stackbox{fill:#fff9e6;stroke:#d4a017;stroke-width:1.3}
    .nodetxt{font-size:15px;text-anchor:middle;font-weight:bold;dominant-baseline:central}
    .arrow{font-size:16px;fill:#555;text-anchor:middle;font-weight:bold}
    .legend{font-size:11px;fill:#444}
  </style>

  <text class="title" x="480" y="24">DFS 타임라인 — 방문(d) / 종료(f) 구간의 중첩 구조</text>
  <text class="note" x="480" y="42" text-anchor="middle">바깥 구간이 자식 구간을 포함(nesting) — 재귀 깊이 = 현재 열려있는 바의 개수</text>

  <!-- Time axis labels -->
  <g>
    <text class="axlbl" x="50" y="70">시간 →</text>
    <!-- 16 time slots, each 50px wide, starting at x=80 -->
    <text class="ax" x="80" y="70">1</text>
    <text class="ax" x="130" y="70">2</text>
    <text class="ax" x="180" y="70">3</text>
    <text class="ax" x="230" y="70">4</text>
    <text class="ax" x="280" y="70">5</text>
    <text class="ax" x="330" y="70">6</text>
    <text class="ax" x="380" y="70">7</text>
    <text class="ax" x="430" y="70">8</text>
    <text class="ax" x="480" y="70">9</text>
    <text class="ax" x="530" y="70">10</text>
    <text class="ax" x="580" y="70">11</text>
    <text class="ax" x="630" y="70">12</text>
    <text class="ax" x="680" y="70">13</text>
    <text class="ax" x="730" y="70">14</text>
    <text class="ax" x="780" y="70">15</text>
    <text class="ax" x="830" y="70">16</text>
  </g>

  <!-- Vertical gridlines at each time -->
  <g>
    <line class="grid" x1="80" y1="80" x2="80" y2="350"/>
    <line class="grid" x1="130" y1="80" x2="130" y2="350"/>
    <line class="grid" x1="180" y1="80" x2="180" y2="350"/>
    <line class="grid" x1="230" y1="80" x2="230" y2="350"/>
    <line class="grid" x1="280" y1="80" x2="280" y2="350"/>
    <line class="grid" x1="330" y1="80" x2="330" y2="350"/>
    <line class="grid" x1="380" y1="80" x2="380" y2="350"/>
    <line class="grid" x1="430" y1="80" x2="430" y2="350"/>
    <line class="grid" x1="480" y1="80" x2="480" y2="350"/>
    <line class="grid" x1="530" y1="80" x2="530" y2="350"/>
    <line class="grid" x1="580" y1="80" x2="580" y2="350"/>
    <line class="grid" x1="630" y1="80" x2="630" y2="350"/>
    <line class="grid" x1="680" y1="80" x2="680" y2="350"/>
    <line class="grid" x1="730" y1="80" x2="730" y2="350"/>
    <line class="grid" x1="780" y1="80" x2="780" y2="350"/>
    <line class="grid" x1="830" y1="80" x2="830" y2="350"/>
  </g>

  <!-- Bars (visit to finish intervals) -->
  <!-- A: d=1, f=16, depth=0 -->
  <text class="nodelabel" x="65" y="92">A</text>
  <rect class="bar0" x="80" y="80" width="750" height="22" rx="3"/>
  <text class="d" x="90" y="94">d=1</text>
  <text class="f" x="820" y="94">f=16</text>

  <!-- B: d=2, f=11, depth=1 -->
  <text class="nodelabel" x="65" y="120">B</text>
  <rect class="bar1" x="130" y="108" width="450" height="22" rx="3"/>
  <text class="d" x="140" y="122">d=2</text>
  <text class="f" x="570" y="122">f=11</text>

  <!-- D: d=3, f=8, depth=2 -->
  <text class="nodelabel" x="65" y="148">D</text>
  <rect class="bar2" x="180" y="136" width="250" height="22" rx="3"/>
  <text class="d" x="190" y="150">d=3</text>
  <text class="f" x="420" y="150">f=8</text>

  <!-- G: d=4, f=5, depth=3 -->
  <text class="nodelabel" x="65" y="176">G</text>
  <rect class="bar3" x="230" y="164" width="50" height="22" rx="3"/>
  <text class="d" x="240" y="178">4</text>
  <text class="f" x="270" y="178">5</text>

  <!-- H: d=6, f=7, depth=3 -->
  <text class="nodelabel" x="65" y="204">H</text>
  <rect class="bar3" x="330" y="192" width="50" height="22" rx="3"/>
  <text class="d" x="340" y="206">6</text>
  <text class="f" x="370" y="206">7</text>

  <!-- E: d=9, f=10, depth=2 -->
  <text class="nodelabel" x="65" y="232">E</text>
  <rect class="bar2" x="480" y="220" width="50" height="22" rx="3"/>
  <text class="d" x="490" y="234">9</text>
  <text class="f" x="520" y="234">10</text>

  <!-- C: d=12, f=15, depth=1 -->
  <text class="nodelabel" x="65" y="260">C</text>
  <rect class="bar1" x="630" y="248" width="150" height="22" rx="3"/>
  <text class="d" x="640" y="262">d=12</text>
  <text class="f" x="770" y="262">f=15</text>

  <!-- F: d=13, f=14, depth=2 -->
  <text class="nodelabel" x="65" y="288">F</text>
  <rect class="bar2" x="680" y="276" width="50" height="22" rx="3"/>
  <text class="d" x="690" y="290">13</text>
  <text class="f" x="720" y="290">14</text>

  <!-- Finish tick marks (red vertical dashes at each finish) -->
  <g>
    <line class="finishtick" x1="280" y1="164" x2="280" y2="320"/>
    <line class="finishtick" x1="380" y1="192" x2="380" y2="320"/>
    <line class="finishtick" x1="430" y1="136" x2="430" y2="320"/>
    <line class="finishtick" x1="530" y1="220" x2="530" y2="320"/>
    <line class="finishtick" x1="580" y1="108" x2="580" y2="320"/>
    <line class="finishtick" x1="730" y1="276" x2="730" y2="320"/>
    <line class="finishtick" x1="780" y1="248" x2="780" y2="320"/>
    <line class="finishtick" x1="830" y1="80" x2="830" y2="320"/>
  </g>

  <!-- Push labels below each finish -->
  <text class="axlbl" x="50" y="338">push →</text>
  <g>
    <rect class="stackbox" x="262" y="326" width="36" height="24" rx="3"/>
    <text class="nodetxt" x="280" y="338" fill="#c0392b">G</text>

    <rect class="stackbox" x="362" y="326" width="36" height="24" rx="3"/>
    <text class="nodetxt" x="380" y="338" fill="#c0392b">H</text>

    <rect class="stackbox" x="412" y="326" width="36" height="24" rx="3"/>
    <text class="nodetxt" x="430" y="338" fill="#c0392b">D</text>

    <rect class="stackbox" x="512" y="326" width="36" height="24" rx="3"/>
    <text class="nodetxt" x="530" y="338" fill="#c0392b">E</text>

    <rect class="stackbox" x="562" y="326" width="36" height="24" rx="3"/>
    <text class="nodetxt" x="580" y="338" fill="#c0392b">B</text>

    <rect class="stackbox" x="712" y="326" width="36" height="24" rx="3"/>
    <text class="nodetxt" x="730" y="338" fill="#c0392b">F</text>

    <rect class="stackbox" x="762" y="326" width="36" height="24" rx="3"/>
    <text class="nodetxt" x="780" y="338" fill="#c0392b">C</text>

    <rect class="stackbox" x="812" y="326" width="36" height="24" rx="3"/>
    <text class="nodetxt" x="830" y="338" fill="#c0392b">A</text>
  </g>

  <!-- Legend -->
  <g transform="translate(80, 370)">
    <text class="sub" x="0" y="0">범례</text>
    <rect class="bar0" x="60" y="-10" width="20" height="14" rx="2"/>
    <text class="legend" x="86" y="0">재귀 깊이 0 (루트)</text>
    <rect class="bar1" x="200" y="-10" width="20" height="14" rx="2"/>
    <text class="legend" x="226" y="0">깊이 1</text>
    <rect class="bar2" x="300" y="-10" width="20" height="14" rx="2"/>
    <text class="legend" x="326" y="0">깊이 2</text>
    <rect class="bar3" x="380" y="-10" width="20" height="14" rx="2"/>
    <text class="legend" x="406" y="0">깊이 3</text>
    <line class="finishtick" x1="470" y1="-4" x2="490" y2="-4"/>
    <text class="legend" x="495" y="0">finish 시점 (스택 push)</text>
  </g>

  <!-- Separator -->
  <line x1="30" y1="400" x2="930" y2="400" stroke="#ccc" stroke-dasharray="4 3"/>

  <!-- Finish stack (bottom-to-top) -->
  <g transform="translate(50, 420)">
    <text class="sub" x="0" y="0">① Finish 스택 (push 순서, 왼→오른쪽이 아래→위)</text>
    <g>
      <rect class="stackbox" x="0" y="12" width="40" height="32" rx="3"/>
      <text class="nodetxt" x="20" y="28">G</text>
      <rect class="stackbox" x="42" y="12" width="40" height="32" rx="3"/>
      <text class="nodetxt" x="62" y="28">H</text>
      <rect class="stackbox" x="84" y="12" width="40" height="32" rx="3"/>
      <text class="nodetxt" x="104" y="28">D</text>
      <rect class="stackbox" x="126" y="12" width="40" height="32" rx="3"/>
      <text class="nodetxt" x="146" y="28">E</text>
      <rect class="stackbox" x="168" y="12" width="40" height="32" rx="3"/>
      <text class="nodetxt" x="188" y="28">B</text>
      <rect class="stackbox" x="210" y="12" width="40" height="32" rx="3"/>
      <text class="nodetxt" x="230" y="28">F</text>
      <rect class="stackbox" x="252" y="12" width="40" height="32" rx="3"/>
      <text class="nodetxt" x="272" y="28">C</text>
      <rect class="stackbox" x="294" y="12" width="40" height="32" rx="3"/>
      <text class="nodetxt" x="314" y="28">A</text>
    </g>
    <text class="note" x="0" y="62">↑ bottom (먼저 finish)                             top (마지막 finish) ↑</text>
  </g>

  <!-- Reverse arrow -->
  <text class="arrow" x="480" y="440">reverse ↓</text>

  <!-- Topological order result -->
  <g transform="translate(50, 490)">
    <text class="sub" x="0" y="0">② 역순 = 위상 정렬 결과</text>
    <rect class="resbox" x="0" y="12" width="40" height="40" rx="3"/>
    <text class="nodetxt" x="20" y="32">A</text>
    <rect class="resbox" x="42" y="12" width="40" height="40" rx="3"/>
    <text class="nodetxt" x="62" y="32">C</text>
    <rect class="resbox" x="84" y="12" width="40" height="40" rx="3"/>
    <text class="nodetxt" x="104" y="32">F</text>
    <rect class="resbox" x="126" y="12" width="40" height="40" rx="3"/>
    <text class="nodetxt" x="146" y="32">B</text>
    <rect class="resbox" x="168" y="12" width="40" height="40" rx="3"/>
    <text class="nodetxt" x="188" y="32">E</text>
    <rect class="resbox" x="210" y="12" width="40" height="40" rx="3"/>
    <text class="nodetxt" x="230" y="32">D</text>
    <rect class="resbox" x="252" y="12" width="40" height="40" rx="3"/>
    <text class="nodetxt" x="272" y="32">H</text>
    <rect class="resbox" x="294" y="12" width="40" height="40" rx="3"/>
    <text class="nodetxt" x="314" y="32">G</text>
    <text class="note" x="360" y="36">f 값이 큰 순 (16 → 15 → 14 → 11 → 10 → 8 → 7 → 5)</text>
  </g>
</svg>
