<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" font-family="system-ui,sans-serif">
  <style>
    .title{font-size:18px;font-weight:bold;text-anchor:middle}
    .sub{font-size:15px;font-weight:bold;fill:#222}
    .note{font-size:12px;fill:#555}
    .axis{stroke:#888;stroke-width:1}
    .grid{stroke:#eee;stroke-width:1}
    .pt{fill:#fff;stroke:#2c3e50;stroke-width:1.5}
    .ptL{fill:#eaf2fb;stroke:#2e86de;stroke-width:2}
    .ptR{fill:#d0f5d0;stroke:#27ae60;stroke-width:2}
    .ptHi{fill:#ffd9d9;stroke:#c0392b;stroke-width:2.5}
    .plabel{font-size:12px;text-anchor:middle;font-weight:bold;dominant-baseline:central}
    .coord{font-size:10px;fill:#666;text-anchor:middle}
    .divide{stroke:#c0392b;stroke-width:2;stroke-dasharray:6 4}
    .strip{fill:#fff2cc;opacity:0.4;stroke:#f39c12;stroke-width:1.5;stroke-dasharray:3 3}
    .distL{stroke:#2e86de;stroke-width:2;fill:none}
    .distR{stroke:#27ae60;stroke-width:2;fill:none}
    .distMin{stroke:#c0392b;stroke-width:3;fill:none}
    .box{fill:#f8f9fa;stroke:#bbb;stroke-width:1}
    .okbox{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2}
    .hlbox{fill:#ffd9d9;stroke:#c0392b;stroke-width:2}
    .calc{font-size:12px;font-family:monospace;fill:#222}
    .hi{fill:#c0392b;font-weight:bold}
    .hib{fill:#2e86de;font-weight:bold}
    .hig{fill:#27ae60;font-weight:bold}
  </style>

  <text class="title" x="540" y="26">최근접 쌍 — 분할정복 예시 (PDF 5장 p27)</text>
  <text class="note" x="540" y="46" text-anchor="middle">입력: P = {(2,3), (12,30), (40,50), (5,1), (12,10), (3,4)} — 모든 쌍 중 가장 가까운 두 점 찾기</text>

  <!-- ========== STEP 1: 전체 좌표 플로팅 ========== -->
  <g transform="translate(40, 70)">
    <text class="sub" x="0" y="0">① 좌표평면에 6개 점 표시 + x좌표 기준 정렬</text>

    <!-- coordinate system: x in [0..50], y in [0..55], scale 1:6 px -->
    <!-- axes -->
    <line class="axis" x1="0" y1="320" x2="360" y2="320"/>
    <line class="axis" x1="0" y1="0" x2="0" y2="320"/>
    <!-- grid -->
    <line class="grid" x1="72" y1="0" x2="72" y2="320"/>
    <line class="grid" x1="144" y1="0" x2="144" y2="320"/>
    <line class="grid" x1="216" y1="0" x2="216" y2="320"/>
    <line class="grid" x1="288" y1="0" x2="288" y2="320"/>
    <line class="grid" x1="0" y1="256" x2="360" y2="256"/>
    <line class="grid" x1="0" y1="192" x2="360" y2="192"/>
    <line class="grid" x1="0" y1="128" x2="360" y2="128"/>
    <line class="grid" x1="0" y1="64" x2="360" y2="64"/>
    <!-- x labels -->
    <text class="coord" x="72" y="335">10</text>
    <text class="coord" x="144" y="335">20</text>
    <text class="coord" x="216" y="335">30</text>
    <text class="coord" x="288" y="335">40</text>
    <text class="coord" x="360" y="335">50</text>
    <!-- y labels -->
    <text class="coord" x="-10" y="320" text-anchor="end">0</text>
    <text class="coord" x="-10" y="256" text-anchor="end">10</text>
    <text class="coord" x="-10" y="192" text-anchor="end">20</text>
    <text class="coord" x="-10" y="128" text-anchor="end">30</text>
    <text class="coord" x="-10" y="64" text-anchor="end">40</text>
    <text class="coord" x="-10" y="0" text-anchor="end">50</text>

    <!-- points: (x,y) → (x*7.2, 320 - y*6.4) -->
    <!-- (2,3)   → (14.4, 300.8) -->
    <circle class="pt" cx="14" cy="301" r="10"/>
    <text class="plabel" x="14" y="301">1</text>
    <text class="coord" x="14" y="290" fill="#c0392b">(2,3)</text>

    <!-- (12,30) → (86.4, 128) -->
    <circle class="pt" cx="86" cy="128" r="10"/>
    <text class="plabel" x="86" y="128">2</text>
    <text class="coord" x="86" y="117">(12,30)</text>

    <!-- (40,50) → (288, 0) -->
    <circle class="pt" cx="288" cy="12" r="10"/>
    <text class="plabel" x="288" y="12">3</text>
    <text class="coord" x="288" y="34">(40,50)</text>

    <!-- (5,1)   → (36, 313.6) -->
    <circle class="pt" cx="36" cy="314" r="10"/>
    <text class="plabel" x="36" y="314">4</text>
    <text class="coord" x="36" y="303" fill="#c0392b">(5,1)</text>

    <!-- (12,10) → (86.4, 256) -->
    <circle class="pt" cx="86" cy="256" r="10"/>
    <text class="plabel" x="86" y="256">5</text>
    <text class="coord" x="86" y="245">(12,10)</text>

    <!-- (3,4)   → (21.6, 294.4) -->
    <circle class="pt" cx="22" cy="294" r="10"/>
    <text class="plabel" x="22" y="294">6</text>
    <text class="coord" x="22" y="277" fill="#c0392b">(3,4)</text>

    <text class="note" x="180" y="360" text-anchor="middle">x축 정렬 순서: P1(2,3) → P6(3,4) → P4(5,1) → P2(12,30) → P5(12,10) → P3(40,50)</text>
  </g>

  <!-- sorted list shown as sequence -->
  <g transform="translate(460, 90)">
    <text class="sub" x="0" y="0">② x좌표 정렬 + 중앙 분할</text>
    <text class="note" x="0" y="20">정렬 후 앞 절반 P_L, 뒷 절반 P_R 로 분할</text>

    <!-- sorted sequence boxes -->
    <g transform="translate(0, 40)">
      <rect class="ptL" x="0" y="0" width="70" height="36"/>
      <text class="plabel" x="35" y="18">P1</text>
      <text class="coord" x="35" y="30">(2,3)</text>

      <rect class="ptL" x="70" y="0" width="70" height="36"/>
      <text class="plabel" x="105" y="18">P6</text>
      <text class="coord" x="105" y="30">(3,4)</text>

      <rect class="ptL" x="140" y="0" width="70" height="36"/>
      <text class="plabel" x="175" y="18">P4</text>
      <text class="coord" x="175" y="30">(5,1)</text>

      <rect class="ptR" x="210" y="0" width="70" height="36"/>
      <text class="plabel" x="245" y="18">P2</text>
      <text class="coord" x="245" y="30">(12,30)</text>

      <rect class="ptR" x="280" y="0" width="70" height="36"/>
      <text class="plabel" x="315" y="18">P5</text>
      <text class="coord" x="315" y="30">(12,10)</text>

      <rect class="ptR" x="350" y="0" width="70" height="36"/>
      <text class="plabel" x="385" y="18">P3</text>
      <text class="coord" x="385" y="30">(40,50)</text>

      <!-- divider -->
      <line class="divide" x1="210" y1="-10" x2="210" y2="50"/>
      <text class="coord" x="210" y="-15" text-anchor="middle" fill="#c0392b" font-weight="bold">mid x ≈ 8.5</text>
    </g>

    <text class="note" x="105" y="100" text-anchor="middle" fill="#2e86de" font-weight="bold">P_L (왼쪽 3개)</text>
    <text class="note" x="315" y="100" text-anchor="middle" fill="#27ae60" font-weight="bold">P_R (오른쪽 3개)</text>

    <!-- Conquer: left -->
    <g transform="translate(0, 120)">
      <rect class="box" x="0" y="0" width="200" height="120"/>
      <text class="sub" x="10" y="18" fill="#2e86de">③-좌 Conquer (n≤3 완전탐색)</text>
      <text class="calc" x="10" y="40">d(P1, P6) = √((3-2)²+(4-3)²)</text>
      <text class="calc" x="10" y="56">      = √(1+1) = <tspan class="hi">√2 ≈ 1.414</tspan></text>
      <text class="calc" x="10" y="76">d(P1, P4) = √(9+4) = √13 ≈ 3.606</text>
      <text class="calc" x="10" y="92">d(P6, P4) = √(4+9) = √13 ≈ 3.606</text>
      <text class="calc" x="10" y="112" fill="#c0392b" font-weight="bold">→ d_L = √2 (쌍: P1 ↔ P6)</text>
    </g>

    <!-- Conquer: right -->
    <g transform="translate(210, 120)">
      <rect class="box" x="0" y="0" width="210" height="120"/>
      <text class="sub" x="10" y="18" fill="#27ae60">③-우 Conquer (n≤3 완전탐색)</text>
      <text class="calc" x="10" y="40">d(P2, P5) = √(0+400) = <tspan class="hi">20</tspan></text>
      <text class="calc" x="10" y="60">d(P2, P3) = √(784+400)</text>
      <text class="calc" x="10" y="76">      ≈ 34.41</text>
      <text class="calc" x="10" y="96">d(P5, P3) = √(784+1600) ≈ 48.83</text>
      <text class="calc" x="10" y="115" fill="#c0392b" font-weight="bold">→ d_R = 20 (쌍: P2 ↔ P5)</text>
    </g>

    <text class="calc" x="210" y="260" text-anchor="middle" fill="#c0392b" font-weight="bold">d = min(d_L, d_R) = min(√2, 20) = √2</text>
  </g>

  <!-- ========== STEP 4: Combine - strip ========== -->
  <g transform="translate(40, 460)">
    <text class="sub" x="0" y="0">④ Combine — 경계 주변 "띠(strip)" 내부만 추가 검사</text>
    <text class="note" x="0" y="20">기준선 x=8.5 양쪽으로 너비 d=√2 ≈ 1.414 만큼만 후보 존재 가능 → 범위: x ∈ [7.09, 9.91]</text>

    <!-- axes -->
    <line class="axis" x1="0" y1="320" x2="540" y2="320"/>
    <line class="axis" x1="0" y1="30" x2="0" y2="320"/>
    <!-- x ticks -->
    <line class="grid" x1="108" y1="30" x2="108" y2="320"/>
    <line class="grid" x1="216" y1="30" x2="216" y2="320"/>
    <line class="grid" x1="324" y1="30" x2="324" y2="320"/>
    <line class="grid" x1="432" y1="30" x2="432" y2="320"/>
    <line class="grid" x1="540" y1="30" x2="540" y2="320"/>
    <text class="coord" x="108" y="335">10</text>
    <text class="coord" x="216" y="335">20</text>
    <text class="coord" x="324" y="335">30</text>
    <text class="coord" x="432" y="335">40</text>
    <text class="coord" x="540" y="335">50</text>

    <!-- scale: x*10.8, y*5.8, origin at (0,320) -->
    <!-- mid line at x=8.5 → 91.8 -->
    <line class="divide" x1="92" y1="30" x2="92" y2="320"/>
    <text class="coord" x="92" y="25" text-anchor="middle" fill="#c0392b" font-weight="bold">mid=8.5</text>

    <!-- strip: x ∈ [7.09, 9.91] → [76.6, 107] -->
    <rect class="strip" x="77" y="30" width="30" height="290"/>
    <text class="coord" x="92" y="48" text-anchor="middle" fill="#d4a017" font-weight="bold">strip width = 2d</text>

    <!-- points plotted at new scale -->
    <!-- P1 (2,3) → (21.6, 302.6) -->
    <circle class="ptHi" cx="22" cy="303" r="10"/>
    <text class="plabel" x="22" y="303">1</text>
    <!-- P6 (3,4) → (32.4, 296.8) -->
    <circle class="ptHi" cx="32" cy="297" r="10"/>
    <text class="plabel" x="32" y="297">6</text>
    <!-- P4 (5,1) → (54, 314.2) -->
    <circle class="ptL" cx="54" cy="314" r="10"/>
    <text class="plabel" x="54" y="314">4</text>
    <!-- P2 (12,30) → (130, 146) -->
    <circle class="ptR" cx="130" cy="146" r="10"/>
    <text class="plabel" x="130" y="146">2</text>
    <!-- P5 (12,10) → (130, 262) -->
    <circle class="ptR" cx="130" cy="262" r="10"/>
    <text class="plabel" x="130" y="262">5</text>
    <!-- P3 (40,50) → (432, 30) -->
    <circle class="ptR" cx="432" cy="36" r="10"/>
    <text class="plabel" x="432" y="36">3</text>

    <!-- min pair line P1-P6 -->
    <line class="distMin" x1="22" y1="303" x2="32" y2="297"/>

    <text class="note" x="270" y="370" text-anchor="middle" fill="#c0392b" font-weight="bold">띠 안에 어떤 점도 없음 → 경계 교차 쌍 검사 불필요 → 최종 답 = d_L = √2</text>
  </g>

  <!-- ========== Final answer box ========== -->
  <g transform="translate(640, 480)">
    <rect class="okbox" x="0" y="0" width="400" height="300"/>
    <text class="sub" x="200" y="28" text-anchor="middle" fill="#2e7d32">⑤ 최종 결과</text>

    <text class="calc" x="20" y="60">최근접 쌍 = <tspan class="hi">P1(2,3) ↔ P6(3,4)</tspan></text>
    <text class="calc" x="20" y="82">최소 거리 = <tspan class="hi">√2 ≈ 1.4142</tspan></text>

    <line x1="20" y1="100" x2="380" y2="100" stroke="#2e7d32"/>

    <text class="sub" x="20" y="122">분할정복 3단계 요약</text>

    <text class="calc" x="20" y="148"><tspan class="hib">Divide:</tspan> x좌표 중앙값 기준으로</text>
    <text class="calc" x="20" y="164">         P_L(3개) / P_R(3개) 분할</text>

    <text class="calc" x="20" y="190"><tspan class="hig">Conquer:</tspan> 각 부분 재귀</text>
    <text class="calc" x="20" y="206">         (n≤3 → 완전탐색)</text>
    <text class="calc" x="20" y="222">         d_L=√2, d_R=20</text>

    <text class="calc" x="20" y="248"><tspan class="hi">Combine:</tspan> 띠 내부만 추가 검사</text>
    <text class="calc" x="20" y="264">         이 예시는 띠가 비어있음 →</text>
    <text class="calc" x="20" y="280">         d = min(d_L, d_R) = √2</text>
  </g>

  <!-- ========== Why 7 points lemma ========== -->
  <g transform="translate(40, 850)">
    <rect class="hlbox" x="0" y="0" width="1000" height="100"/>
    <text class="sub" x="15" y="22" fill="#c0392b">핵심 Lemma — 왜 띠 안 한 점은 "최대 7개"와만 비교하면 되는가?</text>
    <text class="note" x="15" y="44">• 좌/우 각 그룹 내부의 모든 쌍 거리는 이미 ≥ d 임이 보장됨 → 한 변 d 의 격자 박스 하나에 한 점만 들어갈 수 있음</text>
    <text class="note" x="15" y="62">• 띠는 너비 2d. 한 점 기준 "아래쪽 y차이 ≤ d" 영역은 <tspan font-weight="bold">2d × d</tspan> 직사각형 → 여기 들어갈 수 있는 점은 기하학적으로 최대 <tspan class="hi">7개</tspan></text>
    <text class="note" x="15" y="80">• 따라서 띠 내 각 점에서 <tspan font-weight="bold">고작 상수(7)회</tspan>만 비교 → Combine 단계 $O(n)$ → 전체 $T(n)=2T(n/2)+O(n)=O(n\log n)$</text>
  </g>
</svg>
