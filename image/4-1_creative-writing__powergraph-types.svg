<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="system-ui,sans-serif">
  <style>
    .n1{fill:#e74c3c;stroke:#c0392b;stroke-width:2}
    .n2{fill:#3498db;stroke:#2e86de;stroke-width:2}
    .n3{fill:#27ae60;stroke:#1e8449;stroke-width:2}
    .n4{fill:#f39c12;stroke:#d4a017;stroke-width:2}
    .txt{font-size:14px;text-anchor:middle;font-weight:bold;fill:#fff}
    .ln{stroke:#333;stroke-width:1.5;fill:none;marker-end:url(#ar)}
    .title{font-size:18px;font-weight:bold;text-anchor:middle}
    .sub{font-size:15px;font-weight:bold;text-anchor:middle}
    .lab{font-size:13px;text-anchor:middle}
    .note{font-size:13px}
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="550" y="40">Powergraph 3유형: 문단 차원의 힘 글쓰기</text>

  <!-- A type -->
  <g transform="translate(60,80)">
    <rect x="0" y="0" width="460" height="230" fill="#fff" stroke="#c0392b" stroke-width="1.5" rx="8"/>
    <text class="sub" x="230" y="30" fill="#c0392b">A형 · 직렬 (1-2-3-4)</text>

    <circle class="n1" cx="80" cy="90" r="22"/><text class="txt" x="80" y="96">1</text>
    <circle class="n2" cx="180" cy="90" r="22"/><text class="txt" x="180" y="96">2</text>
    <circle class="n3" cx="280" cy="90" r="22"/><text class="txt" x="280" y="96">3</text>
    <circle class="n4" cx="380" cy="90" r="22"/><text class="txt" x="380" y="96">4</text>

    <line class="ln" x1="102" y1="90" x2="158" y2="90"/>
    <line class="ln" x1="202" y1="90" x2="258" y2="90"/>
    <line class="ln" x1="302" y1="90" x2="358" y2="90"/>

    <text class="lab" x="80" y="140">주제</text>
    <text class="lab" x="180" y="140">근거</text>
    <text class="lab" x="280" y="140">증명</text>
    <text class="lab" x="380" y="140">강조</text>

    <text class="lab" x="230" y="180">한 근거 → 한 증명 순차 배치</text>
    <text class="lab" x="230" y="205" fill="#c0392b" font-weight="bold">가장 기본형</text>
  </g>

  <!-- B type -->
  <g transform="translate(580,80)">
    <rect x="0" y="0" width="460" height="230" fill="#fff" stroke="#2e86de" stroke-width="1.5" rx="8"/>
    <text class="sub" x="230" y="30" fill="#2e86de">B형 · 병렬 (1-2-2-4)</text>

    <circle class="n1" cx="70" cy="100" r="22"/><text class="txt" x="70" y="106">1</text>
    <circle class="n2" cx="210" cy="70" r="22"/><text class="txt" x="210" y="76">2</text>
    <circle class="n2" cx="210" cy="130" r="22"/><text class="txt" x="210" y="136">2</text>
    <circle class="n4" cx="390" cy="100" r="22"/><text class="txt" x="390" y="106">4</text>

    <line class="ln" x1="92" y1="95" x2="188" y2="75"/>
    <line class="ln" x1="92" y1="105" x2="188" y2="125"/>
    <line class="ln" x1="232" y1="75" x2="368" y2="95"/>
    <line class="ln" x1="232" y1="125" x2="368" y2="105"/>

    <text class="lab" x="70" y="150">주제</text>
    <text class="lab" x="210" y="175">근거 여러 개</text>
    <text class="lab" x="390" y="150">강조</text>

    <text class="lab" x="230" y="205">한 주제에 근거 여러 개 병렬</text>
  </g>

  <!-- C type -->
  <g transform="translate(60,340)">
    <rect x="0" y="0" width="460" height="280" fill="#fff" stroke="#27ae60" stroke-width="1.5" rx="8"/>
    <text class="sub" x="230" y="30" fill="#27ae60">C형 · 병렬 확장 (1-2-2-2-2-4)</text>

    <circle class="n1" cx="60" cy="140" r="22"/><text class="txt" x="60" y="146">1</text>
    <circle class="n2" cx="220" cy="70" r="20"/><text class="txt" x="220" y="76">2</text>
    <circle class="n2" cx="220" cy="115" r="20"/><text class="txt" x="220" y="121">2</text>
    <circle class="n2" cx="220" cy="165" r="20"/><text class="txt" x="220" y="171">2</text>
    <circle class="n2" cx="220" cy="210" r="20"/><text class="txt" x="220" y="216">2</text>
    <circle class="n4" cx="400" cy="140" r="22"/><text class="txt" x="400" y="146">4</text>

    <line class="ln" x1="82" y1="135" x2="200" y2="75"/>
    <line class="ln" x1="82" y1="138" x2="200" y2="115"/>
    <line class="ln" x1="82" y1="142" x2="200" y2="165"/>
    <line class="ln" x1="82" y1="145" x2="200" y2="205"/>
    <line class="ln" x1="240" y1="75" x2="378" y2="135"/>
    <line class="ln" x1="240" y1="115" x2="378" y2="138"/>
    <line class="ln" x1="240" y1="165" x2="378" y2="142"/>
    <line class="ln" x1="240" y1="205" x2="378" y2="145"/>

    <text class="lab" x="230" y="255">근거 4개 이상 → 종합 결론</text>
  </g>

  <!-- Hybrid -->
  <g transform="translate(580,340)">
    <rect x="0" y="0" width="460" height="280" fill="#fff" stroke="#d4a017" stroke-width="1.5" rx="8"/>
    <text class="sub" x="230" y="30" fill="#d4a017">직렬-병렬 복합형</text>
    <text class="lab" x="230" y="55" fill="#c0392b" font-weight="bold">5문단 에세이의 본체 구조</text>

    <circle class="n1" cx="40" cy="150" r="20"/><text class="txt" x="40" y="156">1'</text>

    <rect x="80" y="110" width="100" height="80" fill="#ecf0f1" stroke="#333"/>
    <text class="lab" x="130" y="135">본론 1 (2')</text>
    <text class="lab" x="130" y="157">1-2-3</text>
    <text class="lab" x="130" y="178">두괄식</text>

    <rect x="190" y="110" width="100" height="80" fill="#ecf0f1" stroke="#333"/>
    <text class="lab" x="240" y="135">본론 2 (2')</text>
    <text class="lab" x="240" y="157">1-2-3</text>
    <text class="lab" x="240" y="178">두괄식</text>

    <rect x="300" y="110" width="100" height="80" fill="#ecf0f1" stroke="#333"/>
    <text class="lab" x="350" y="135">본론 3 (2')</text>
    <text class="lab" x="350" y="157">1-2-3</text>
    <text class="lab" x="350" y="178">두괄식</text>

    <circle class="n4" cx="430" cy="150" r="20"/><text class="txt" x="430" y="156">4'</text>

    <line class="ln" x1="60" y1="150" x2="80" y2="150"/>
    <line class="ln" x1="400" y1="150" x2="410" y2="150"/>

    <text class="lab" x="230" y="235">1' = 서론 (미괄식)</text>
    <text class="lab" x="230" y="258">4' = 결론 (미괄식)</text>
  </g>

  <!-- Example -->
  <g>
    <rect x="60" y="660" width="980" height="210" fill="#fde2e2" stroke="#c0392b"/>
    <text x="80" y="695" font-size="15" font-weight="bold">예: "고양이는 이상적인 애완동물" (1-2-2-2-4 → 5문단 확장)</text>
    <text class="note" x="80" y="730">• 서론 (1'): 고양이는 훌륭한 애완동물이다 — 미괄식</text>
    <text class="note" x="80" y="760">• 본론 1 (2'): 첫째, 사교성이 뛰어나다 (힘2) → 애교스럽다, 쓰다듬어 달라 (힘3)</text>
    <text class="note" x="80" y="790">• 본론 2, 3 (2'): 둘째 · 셋째 근거 병렬 전개 — 각 본론은 두괄식</text>
    <text class="note" x="80" y="820">• 결론 (4'): 다양한 방법으로, 고양이는 이상적인 애완동물이다 — 미괄식</text>
    <text class="note" x="80" y="855" fill="#c0392b" font-weight="bold">힘1(주제) · 힘2(근거) · 힘3(증명) · 힘4(강조)</text>
  </g>
</svg>
