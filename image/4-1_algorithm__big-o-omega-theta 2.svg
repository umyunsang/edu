<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="system-ui,sans-serif">
  <style>.t{font-size:14px}.tb{font-size:14px;font-weight:bold}.ax{stroke:#222;stroke-width:1.5;fill:none}.f{fill:none;stroke-width:2.2}.lab{font-size:13px}</style>
  <!-- 3 subplots: O, Omega, Theta -->
  <g transform="translate(10,20)">
    <text class="tb" x="130" y="0" text-anchor="middle">f(n) ∈ O(g(n)) — 상한</text>
    <path class="ax" d="M20 240 L270 240 M20 240 L20 20"/>
    <text class="t" x="140" y="270" text-anchor="middle">n</text>
    <text class="t" x="0" y="130">y</text>
    <!-- cg(n) curve (upper) -->
    <path class="f" stroke="#e4572e" d="M20 220 Q150 100 260 30"/>
    <!-- f(n) curve (below) -->
    <path class="f" stroke="#2e86de" d="M20 230 Q140 170 260 80"/>
    <line x1="130" y1="20" x2="130" y2="240" stroke="#888" stroke-dasharray="4 3"/>
    <text class="lab" fill="#888" x="133" y="256">n₀</text>
    <text class="lab" fill="#e4572e" x="230" y="45">c·g(n)</text>
    <text class="lab" fill="#2e86de" x="230" y="100">f(n)</text>
  </g>
  <g transform="translate(310,20)">
    <text class="tb" x="130" y="0" text-anchor="middle">f(n) ∈ Ω(g(n)) — 하한</text>
    <path class="ax" d="M20 240 L270 240 M20 240 L20 20"/>
    <path class="f" stroke="#2e86de" d="M20 230 Q140 80 260 20"/>
    <path class="f" stroke="#e4572e" d="M20 235 Q150 180 260 120"/>
    <line x1="130" y1="20" x2="130" y2="240" stroke="#888" stroke-dasharray="4 3"/>
    <text class="lab" fill="#888" x="133" y="256">n₀</text>
    <text class="lab" fill="#2e86de" x="230" y="35">f(n)</text>
    <text class="lab" fill="#e4572e" x="230" y="135">c·g(n)</text>
  </g>
  <g transform="translate(610,20)">
    <text class="tb" x="130" y="0" text-anchor="middle">f(n) ∈ Θ(g(n)) — 상·하한</text>
    <path class="ax" d="M20 240 L270 240 M20 240 L20 20"/>
    <path class="f" stroke="#e4572e" d="M20 210 Q140 100 260 30"/>
    <path class="f" stroke="#2e86de" d="M20 225 Q140 140 260 60"/>
    <path class="f" stroke="#1abc9c" d="M20 235 Q140 180 260 120"/>
    <line x1="130" y1="20" x2="130" y2="240" stroke="#888" stroke-dasharray="4 3"/>
    <text class="lab" fill="#888" x="133" y="256">n₀</text>
    <text class="lab" fill="#e4572e" x="222" y="45">c₂·g(n)</text>
    <text class="lab" fill="#2e86de" x="230" y="80">f(n)</text>
    <text class="lab" fill="#1abc9c" x="222" y="135">c₁·g(n)</text>
  </g>
</svg>
