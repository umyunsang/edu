<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="system-ui,sans-serif">
  <style>
    .y{fill:#333}
    .u{fill:#4e73df}
    .v{fill:#c0392b}
    .rgb{fill:url(#rgbgrad)}
    .frame{fill:none;stroke:#555;stroke-width:1.5}
    .t{font-size:12px;text-anchor:middle}
    .tb{font-size:15px;font-weight:bold}
    .lab{font-size:13px}
    .eq{font-family:monospace;font-size:13px}
  </style>
  <defs>
    <linearGradient id="rgbgrad" x1="0" x2="1">
      <stop offset="0" stop-color="#f55"/>
      <stop offset="0.5" stop-color="#5f5"/>
      <stop offset="1" stop-color="#55f"/>
    </linearGradient>
  </defs>
  <text class="tb" x="430" y="22" text-anchor="middle">YUV 색 공간: 밝기(Y)와 색(UV)을 분리해서 쓰는 이유</text>

  <!-- RGB input -->
  <g transform="translate(40,60)">
    <text class="tb" x="60" y="0" text-anchor="middle">입력 (RGB)</text>
    <rect class="rgb" x="0" y="15" width="120" height="120"/>
    <rect class="frame" x="0" y="15" width="120" height="120"/>
    <text class="t" x="60" y="155">3채널 × 8bit = 24bit</text>
  </g>

  <!-- Arrow with equations -->
  <g transform="translate(190,100)">
    <text class="tb" x="0" y="0">변환식 (BT.601)</text>
    <text class="eq" x="0" y="20">Y = 0.299R + 0.587G + 0.114B</text>
    <text class="eq" x="0" y="40">U = 0.492 (B − Y)</text>
    <text class="eq" x="0" y="60">V = 0.877 (R − Y)</text>
  </g>

  <!-- Three channels -->
  <g transform="translate(480,60)">
    <text class="tb" x="60" y="0" text-anchor="middle">Y (밝기)</text>
    <rect class="y" x="0" y="15" width="120" height="60"/>
    <rect class="frame" x="0" y="15" width="120" height="60"/>
    <text class="t" x="60" y="95">흑백 사진과 동일</text>
  </g>

  <g transform="translate(630,60)">
    <text class="tb" x="60" y="0" text-anchor="middle">U (청-황 색차)</text>
    <rect class="u" x="0" y="15" width="120" height="60" opacity="0.6"/>
    <rect class="frame" x="0" y="15" width="120" height="60"/>
    <text class="t" x="60" y="95">B − Y 성분</text>
  </g>

  <g transform="translate(630,140)">
    <text class="tb" x="60" y="0" text-anchor="middle">V (적-녹 색차)</text>
    <rect class="v" x="0" y="15" width="120" height="60" opacity="0.6"/>
    <rect class="frame" x="0" y="15" width="120" height="60"/>
    <text class="t" x="60" y="95">R − Y 성분</text>
  </g>

  <!-- Subsampling -->
  <g transform="translate(40,250)">
    <text class="tb" x="0" y="0">서브샘플링 (사람 눈의 특성 활용)</text>
    <text class="lab" x="0" y="20">사람 눈은 밝기(Y)에 민감, 색(UV)에 덜 민감 → UV만 해상도를 줄여도 체감 품질 거의 동일.</text>

    <!-- 4:4:4 -->
    <g transform="translate(0,40)">
      <text class="tb" x="60" y="0" text-anchor="middle">4:4:4 (손실 없음)</text>
      <g stroke="#333">
        <rect x="0" y="10" width="20" height="20" fill="#333"/>
        <rect x="20" y="10" width="20" height="20" fill="#333"/>
        <rect x="40" y="10" width="20" height="20" fill="#333"/>
        <rect x="60" y="10" width="20" height="20" fill="#333"/>
        <rect x="80" y="10" width="20" height="20" fill="#333"/>
        <rect x="100" y="10" width="20" height="20" fill="#333"/>
      </g>
      <g stroke="#333">
        <rect x="0" y="35" width="20" height="20" fill="#4e73df" opacity="0.7"/>
        <rect x="20" y="35" width="20" height="20" fill="#4e73df" opacity="0.7"/>
        <rect x="40" y="35" width="20" height="20" fill="#4e73df" opacity="0.7"/>
        <rect x="60" y="35" width="20" height="20" fill="#4e73df" opacity="0.7"/>
        <rect x="80" y="35" width="20" height="20" fill="#4e73df" opacity="0.7"/>
        <rect x="100" y="35" width="20" height="20" fill="#4e73df" opacity="0.7"/>
      </g>
      <text class="t" x="60" y="75">Y와 UV 해상도 동일</text>
      <text class="t" x="60" y="95">→ 스튜디오/편집</text>
    </g>

    <!-- 4:2:2 -->
    <g transform="translate(200,40)">
      <text class="tb" x="60" y="0" text-anchor="middle">4:2:2 (U,V 수평 ½)</text>
      <g stroke="#333">
        <rect x="0" y="10" width="20" height="20" fill="#333"/>
        <rect x="20" y="10" width="20" height="20" fill="#333"/>
        <rect x="40" y="10" width="20" height="20" fill="#333"/>
        <rect x="60" y="10" width="20" height="20" fill="#333"/>
        <rect x="80" y="10" width="20" height="20" fill="#333"/>
        <rect x="100" y="10" width="20" height="20" fill="#333"/>
      </g>
      <g stroke="#333">
        <rect x="0" y="35" width="40" height="20" fill="#4e73df" opacity="0.7"/>
        <rect x="40" y="35" width="40" height="20" fill="#4e73df" opacity="0.7"/>
        <rect x="80" y="35" width="40" height="20" fill="#4e73df" opacity="0.7"/>
      </g>
      <text class="t" x="60" y="75">UV 수평 해상도 절반</text>
      <text class="t" x="60" y="95">→ 방송 송출</text>
    </g>

    <!-- 4:2:0 -->
    <g transform="translate(400,40)">
      <text class="tb" x="60" y="0" text-anchor="middle">4:2:0 (가장 많이 사용)</text>
      <g stroke="#333">
        <rect x="0" y="10" width="20" height="20" fill="#333"/>
        <rect x="20" y="10" width="20" height="20" fill="#333"/>
        <rect x="40" y="10" width="20" height="20" fill="#333"/>
        <rect x="60" y="10" width="20" height="20" fill="#333"/>
        <rect x="80" y="10" width="20" height="20" fill="#333"/>
        <rect x="100" y="10" width="20" height="20" fill="#333"/>
      </g>
      <g stroke="#333">
        <rect x="0" y="35" width="40" height="40" fill="#4e73df" opacity="0.7"/>
        <rect x="40" y="35" width="40" height="40" fill="#4e73df" opacity="0.7"/>
        <rect x="80" y="35" width="40" height="40" fill="#4e73df" opacity="0.7"/>
      </g>
      <text class="t" x="60" y="95">UV 수평·수직 ½ → 1/4</text>
      <text class="t" x="60" y="115">→ JPEG, MPEG, H.264</text>
    </g>

    <g transform="translate(600,40)">
      <rect x="0" y="0" width="220" height="120" fill="#fff7d6" stroke="#d4a017"/>
      <text class="tb" x="10" y="20">압축 효과</text>
      <text class="lab" x="10" y="40">4:4:4 → 원본 대비 100%</text>
      <text class="lab" x="10" y="60">4:2:2 → 2/3 데이터</text>
      <text class="lab" x="10" y="80">4:2:0 → 1/2 데이터</text>
      <text class="lab" x="10" y="108" fill="#c0392b" font-weight="bold">거의 같아 보이면서 절반!</text>
    </g>
  </g>

  <g transform="translate(30,460)">
    <text class="lab" x="0" y="0" fill="#c0392b" font-weight="bold">시험: "왜 YUV를 쓰나?" → ① 밝기/색 분리 ② 색채널만 다운샘플링 가능 ③ 압축률↑ 체감화질↓ 적음. cv2.cvtColor(img, cv2.COLOR_BGR2YUV)</text>
  </g>
</svg>
