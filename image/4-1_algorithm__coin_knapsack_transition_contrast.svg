<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <style>
      .bg{fill:#fbfdff}.title{font:700 32px 'Apple SD Gothic Neo',Arial,sans-serif;fill:#0f172a}.h{font:700 22px 'Apple SD Gothic Neo',Arial,sans-serif;fill:#0f172a}.t{font:500 18px 'Apple SD Gothic Neo',Arial,sans-serif;fill:#334155}.s{font:500 15px 'Apple SD Gothic Neo',Arial,sans-serif;fill:#475569}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16}.blue{fill:#e0f2fe;stroke:#38bdf8}.amber{fill:#fef3c7;stroke:#f59e0b}.code{font:600 18px 'SF Mono',Menlo,monospace;fill:#0f172a}.red{fill:#fee2e2;stroke:#f87171}.green{fill:#dcfce7;stroke:#22c55e}
    </style>
  </defs>
  <rect class="bg" width="1200" height="680"/>
  <text class="title" x="52" y="62">Coin Changing과 0-1 Knapsack은 같은 표처럼 보여도 전이가 다르다</text>
  <text class="t" x="52" y="96">차이는 “이번 항목을 다시 쓸 수 있는가?”이다.</text>

  <rect class="card blue" x="70" y="140" width="510" height="440"/>
  <text class="h" x="100" y="182">Coin Changing</text>
  <text class="t" x="100" y="222">동전은 같은 종류를 여러 번 쓸 수 있다.</text>
  <rect class="green" x="100" y="265" width="430" height="88" rx="12"/>
  <text class="code" x="122" y="303">c[i][j] = min(</text>
  <text class="code" x="160" y="330">c[i-1][j], 1 + c[i][j-d_i])</text>
  <text class="s" x="100" y="405">동전을 쓰는 경우 같은 i행을 본다.</text>
  <text class="s" x="100" y="432">예: 12원, 동전 1/6/10 -> 6+6, 최소 2개</text>
  <text class="s" x="100" y="460">예: 25원, 동전 1/7/15 -> 최소 5개</text>

  <rect class="card amber" x="630" y="140" width="510" height="440"/>
  <text class="h" x="660" y="182">0-1 Knapsack</text>
  <text class="t" x="660" y="222">물건은 한 번 넣으면 다시 쓸 수 없다.</text>
  <rect class="red" x="660" y="265" width="430" height="88" rx="12"/>
  <text class="code" x="682" y="303">V(i,w) = max(</text>
  <text class="code" x="720" y="330">V(i-1,w), v_i + V(i-1,w-w_i))</text>
  <text class="s" x="660" y="405">물건을 넣는 경우도 i-1행을 본다.</text>
  <text class="s" x="660" y="432">예: W=18 -> 물건 1,2,4,5 선택</text>
  <text class="s" x="660" y="460">가치 60+100+120+200 = 480</text>
</svg>
