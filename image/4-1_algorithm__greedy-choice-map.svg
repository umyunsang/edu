<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470">
  <rect width="1000" height="470" fill="#f8fafc"/>
  <text x="42" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">탐욕 알고리즘 선택 기준 지도</text>
  <text x="42" y="84" font-family="Arial, sans-serif" font-size="16" fill="#475569">탐욕은 빠르게 고르는 방법이 아니라, 그 선택이 최적해를 망치지 않는다는 근거가 있어야 한다.</text>

  <g font-family="Arial, sans-serif">
    <rect x="410" y="130" width="180" height="76" rx="12" fill="#111827"/>
    <text x="500" y="162" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">현재 최선 선택</text>
    <text x="500" y="188" text-anchor="middle" font-size="15" fill="#cbd5e1">되돌아가지 않는다</text>

    <rect x="70" y="270" width="155" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="147" y="304" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">동전</text>
    <text x="147" y="332" text-anchor="middle" font-size="15" fill="#1e293b">큰 동전 먼저</text>
    <text x="147" y="356" text-anchor="middle" font-size="14" fill="#475569">반례 확인</text>

    <rect x="255" y="270" width="155" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="332" y="304" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">분할 배낭</text>
    <text x="332" y="332" text-anchor="middle" font-size="15" fill="#1e293b">가치/무게 순</text>
    <text x="332" y="356" text-anchor="middle" font-size="14" fill="#475569">쪼갤 수 있음</text>

    <rect x="440" y="270" width="155" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="517" y="304" text-anchor="middle" font-size="20" font-weight="700" fill="#92400e">MST</text>
    <text x="517" y="332" text-anchor="middle" font-size="15" fill="#1e293b">안전 간선</text>
    <text x="517" y="356" text-anchor="middle" font-size="14" fill="#475569">cut property</text>

    <rect x="625" y="270" width="155" height="100" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="702" y="304" text-anchor="middle" font-size="20" font-weight="700" fill="#831843">Dijkstra</text>
    <text x="702" y="332" text-anchor="middle" font-size="15" fill="#1e293b">최소 dist 확정</text>
    <text x="702" y="356" text-anchor="middle" font-size="14" fill="#475569">음수 간선 금지</text>

    <rect x="810" y="270" width="155" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="887" y="304" text-anchor="middle" font-size="20" font-weight="700" fill="#4c1d95">Huffman</text>
    <text x="887" y="332" text-anchor="middle" font-size="15" fill="#1e293b">최소 빈도 2개</text>
    <text x="887" y="356" text-anchor="middle" font-size="14" fill="#475569">prefix code</text>

    <g stroke="#64748b" stroke-width="3" fill="none">
      <path d="M500 206 L147 270"/>
      <path d="M500 206 L332 270"/>
      <path d="M500 206 L517 270"/>
      <path d="M500 206 L702 270"/>
      <path d="M500 206 L887 270"/>
    </g>
  </g>
</svg>
