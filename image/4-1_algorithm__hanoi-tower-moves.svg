<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="system-ui,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
  </defs>
  <style>
    .peg{stroke:#8b6b3a;stroke-width:4;fill:none}
    .base{fill:#8b6b3a}
    .d1{fill:#ef9a9a;stroke:#b71c1c;stroke-width:1.2}
    .d2{fill:#90caf9;stroke:#0d47a1;stroke-width:1.2}
    .d3{fill:#a5d6a7;stroke:#1b5e20;stroke-width:1.2}
    .lab{font-size:12px;fill:#4a5b6c;text-anchor:middle}
    .step{font-size:13px;fill:#1e2a38;text-anchor:middle;font-weight:bold}
    .tb{font-size:16px;font-weight:bold;text-anchor:middle;fill:#1e2a38}
    .mc{font-size:14px;font-family:ui-monospace,Menlo,monospace;text-anchor:middle;fill:#1e2a38}
    .note{fill:#fff7d6;stroke:#b08a1f;stroke-width:1.5}
  </style>

  <text class="tb" x="600" y="30">하노이 탑 (n=3, A→C): 7단계의 상태 전이</text>

  <!-- Template: each snapshot 270 wide, 160 tall -->
  <!-- Snapshot function: pegs at x+30, x+105, x+180, base at y+130 -->

  <!-- Row 1 (4 snapshots: 초기, step1, step2, step3) -->
  <g transform="translate(40,60)">
    <text class="step" x="135" y="15">초기 상태</text>
    <line class="peg" x1="40" y1="30" x2="40" y2="130"/>
    <line class="peg" x1="135" y1="30" x2="135" y2="130"/>
    <line class="peg" x1="230" y1="30" x2="230" y2="130"/>
    <rect class="base" x="10" y="130" width="250" height="6"/>
    <!-- A has 3 disks -->
    <rect class="d3" x="10" y="118" width="60" height="12"/>
    <rect class="d2" x="17" y="106" width="46" height="12"/>
    <rect class="d1" x="25" y="94" width="30" height="12"/>
    <text class="lab" x="40" y="150">A</text>
    <text class="lab" x="135" y="150">B</text>
    <text class="lab" x="230" y="150">C</text>
  </g>

  <g transform="translate(330,60)">
    <text class="step" x="135" y="15">① A→C (disk1)</text>
    <line class="peg" x1="40" y1="30" x2="40" y2="130"/>
    <line class="peg" x1="135" y1="30" x2="135" y2="130"/>
    <line class="peg" x1="230" y1="30" x2="230" y2="130"/>
    <rect class="base" x="10" y="130" width="250" height="6"/>
    <rect class="d3" x="10" y="118" width="60" height="12"/>
    <rect class="d2" x="17" y="106" width="46" height="12"/>
    <rect class="d1" x="215" y="118" width="30" height="12"/>
    <text class="lab" x="40" y="150">A</text>
    <text class="lab" x="135" y="150">B</text>
    <text class="lab" x="230" y="150">C</text>
  </g>

  <g transform="translate(620,60)">
    <text class="step" x="135" y="15">② A→B (disk2)</text>
    <line class="peg" x1="40" y1="30" x2="40" y2="130"/>
    <line class="peg" x1="135" y1="30" x2="135" y2="130"/>
    <line class="peg" x1="230" y1="30" x2="230" y2="130"/>
    <rect class="base" x="10" y="130" width="250" height="6"/>
    <rect class="d3" x="10" y="118" width="60" height="12"/>
    <rect class="d2" x="112" y="118" width="46" height="12"/>
    <rect class="d1" x="215" y="118" width="30" height="12"/>
    <text class="lab" x="40" y="150">A</text>
    <text class="lab" x="135" y="150">B</text>
    <text class="lab" x="230" y="150">C</text>
  </g>

  <g transform="translate(910,60)">
    <text class="step" x="135" y="15">③ C→B (disk1)</text>
    <line class="peg" x1="40" y1="30" x2="40" y2="130"/>
    <line class="peg" x1="135" y1="30" x2="135" y2="130"/>
    <line class="peg" x1="230" y1="30" x2="230" y2="130"/>
    <rect class="base" x="10" y="130" width="250" height="6"/>
    <rect class="d3" x="10" y="118" width="60" height="12"/>
    <rect class="d2" x="112" y="118" width="46" height="12"/>
    <rect class="d1" x="120" y="106" width="30" height="12"/>
    <text class="lab" x="40" y="150">A</text>
    <text class="lab" x="135" y="150">B</text>
    <text class="lab" x="230" y="150">C</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(40,260)">
    <text class="step" x="135" y="15">④ A→C (disk3)</text>
    <line class="peg" x1="40" y1="30" x2="40" y2="130"/>
    <line class="peg" x1="135" y1="30" x2="135" y2="130"/>
    <line class="peg" x1="230" y1="30" x2="230" y2="130"/>
    <rect class="base" x="10" y="130" width="250" height="6"/>
    <rect class="d2" x="112" y="118" width="46" height="12"/>
    <rect class="d1" x="120" y="106" width="30" height="12"/>
    <rect class="d3" x="200" y="118" width="60" height="12"/>
    <text class="lab" x="40" y="150">A</text>
    <text class="lab" x="135" y="150">B</text>
    <text class="lab" x="230" y="150">C</text>
  </g>

  <g transform="translate(330,260)">
    <text class="step" x="135" y="15">⑤ B→A (disk1)</text>
    <line class="peg" x1="40" y1="30" x2="40" y2="130"/>
    <line class="peg" x1="135" y1="30" x2="135" y2="130"/>
    <line class="peg" x1="230" y1="30" x2="230" y2="130"/>
    <rect class="base" x="10" y="130" width="250" height="6"/>
    <rect class="d1" x="25" y="118" width="30" height="12"/>
    <rect class="d2" x="112" y="118" width="46" height="12"/>
    <rect class="d3" x="200" y="118" width="60" height="12"/>
    <text class="lab" x="40" y="150">A</text>
    <text class="lab" x="135" y="150">B</text>
    <text class="lab" x="230" y="150">C</text>
  </g>

  <g transform="translate(620,260)">
    <text class="step" x="135" y="15">⑥ B→C (disk2)</text>
    <line class="peg" x1="40" y1="30" x2="40" y2="130"/>
    <line class="peg" x1="135" y1="30" x2="135" y2="130"/>
    <line class="peg" x1="230" y1="30" x2="230" y2="130"/>
    <rect class="base" x="10" y="130" width="250" height="6"/>
    <rect class="d1" x="25" y="118" width="30" height="12"/>
    <rect class="d3" x="200" y="118" width="60" height="12"/>
    <rect class="d2" x="207" y="106" width="46" height="12"/>
    <text class="lab" x="40" y="150">A</text>
    <text class="lab" x="135" y="150">B</text>
    <text class="lab" x="230" y="150">C</text>
  </g>

  <g transform="translate(910,260)">
    <text class="step" x="135" y="15">⑦ A→C (disk1)</text>
    <line class="peg" x1="40" y1="30" x2="40" y2="130"/>
    <line class="peg" x1="135" y1="30" x2="135" y2="130"/>
    <line class="peg" x1="230" y1="30" x2="230" y2="130"/>
    <rect class="base" x="10" y="130" width="250" height="6"/>
    <rect class="d3" x="200" y="118" width="60" height="12"/>
    <rect class="d2" x="207" y="106" width="46" height="12"/>
    <rect class="d1" x="215" y="94" width="30" height="12"/>
    <text class="lab" x="40" y="150">A</text>
    <text class="lab" x="135" y="150">B</text>
    <text class="lab" x="230" y="150">C 완성</text>
  </g>

  <!-- 점화식 설명 -->
  <g>
    <rect class="note" x="40" y="470" width="1120" height="240" rx="8"/>
    <text class="tb" x="600" y="500" fill="#1e2a38">점화식: T(n) = 2·T(n-1) + 1,   T(1) = 1</text>
    <text class="mc" x="600" y="540">아이디어 3단계: (1) 위 n-1개를 보조 기둥으로 옮긴다  (2) 큰 원반을 목표로  (3) n-1개를 다시 목표로</text>
    <text class="mc" x="600" y="575">전개: T(n) = 2(2T(n-2)+1) + 1 = 4T(n-2) + 3 = ... = 2^(n-1)·T(1) + (2^(n-1) - 1)</text>
    <text class="mc" x="600" y="608">닫힌해: T(n) = 2^n - 1         ·         n=3일 때 T(3) = 7  ✓  (위 7단계와 일치)</text>
    <text class="mc" x="600" y="645">복잡도: O(2^n) — 지수 시간. 원반 64개면 약 1.8×10^19 회.</text>
    <text class="mc" x="600" y="680">전략 분류: 축소정복 변형(한 원반을 떼어내지만 2T(n-1)이므로 분할정복 경계선)</text>
  </g>
</svg>
