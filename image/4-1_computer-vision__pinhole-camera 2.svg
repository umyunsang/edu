<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="system-ui,sans-serif">
  <style>
    .obj{fill:#2c3e50}
    .ray{stroke:#c0392b;stroke-width:1.5;fill:none}
    .axis{stroke:#333;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
    .plane{fill:#fff7d6;stroke:#d4a017;stroke-width:2}
    .pin{fill:#000;stroke:#000}
    .img{fill:#eaf2fb;stroke:#2e86de;stroke-width:2}
    .t{font-size:13px;text-anchor:middle}
    .tb{font-size:15px;font-weight:bold}
    .lab{font-size:13px}
    .eq{font-family:monospace;font-size:13px}
  </style>
  <text class="tb" x="430" y="22" text-anchor="middle">핀홀 카메라 모델: 3D 세계 → 2D 영상의 투영</text>

  <g transform="translate(50,60)">
    <!-- optical axis -->
    <line class="axis" x1="0" y1="180" x2="720" y2="180"/>
    <text class="t" x="710" y="195">광축 Z</text>

    <!-- 3D object arrow (upright tree-like) -->
    <g>
      <rect class="obj" x="35" y="80" width="6" height="100"/>
      <polygon class="obj" points="10,80 38,30 66,80"/>
      <text class="t" x="38" y="200">3D 물체 (높이 Y)</text>
      <text class="t" x="38" y="218" font-family="monospace">P = (X, Y, Z)</text>
    </g>

    <!-- Rays through pinhole -->
    <line class="ray" x1="38" y1="30" x2="420" y2="180"/>
    <line class="ray" x1="38" y1="180" x2="420" y2="180"/>
    <line class="ray" x1="38" y1="30" x2="560" y2="240"/>

    <!-- Pinhole -->
    <circle class="pin" cx="420" cy="180" r="4"/>
    <text class="t" x="420" y="170">핀홀 (조리개)</text>
    <text class="t" x="420" y="155" font-weight="bold">O</text>

    <!-- Image plane (inverted, behind pinhole) -->
    <line class="plane" x1="560" y1="120" x2="560" y2="240"/>
    <text class="t" x="560" y="115">영상면</text>
    <text class="t" x="560" y="260" font-family="monospace">focal length f</text>

    <!-- Inverted image -->
    <g>
      <rect class="img" x="557" y="180" width="6" height="60"/>
      <polygon class="img" points="548,240 560,220 572,240"/>
    </g>

    <!-- distance labels -->
    <g stroke="#666" stroke-width="1">
      <line x1="38" y1="250" x2="420" y2="250"/>
      <line x1="38" y1="245" x2="38" y2="255"/>
      <line x1="420" y1="245" x2="420" y2="255"/>
    </g>
    <text class="t" x="225" y="270">Z (물체까지 거리)</text>

    <g stroke="#666" stroke-width="1">
      <line x1="420" y1="280" x2="560" y2="280"/>
      <line x1="420" y1="275" x2="420" y2="285"/>
      <line x1="560" y1="275" x2="560" y2="285"/>
    </g>
    <text class="t" x="490" y="300">f</text>

    <!-- Y arrow on object -->
    <g stroke="#2e86de" stroke-width="1.5">
      <line x1="80" y1="30" x2="80" y2="180"/>
      <line x1="75" y1="35" x2="85" y2="35"/>
      <line x1="75" y1="175" x2="85" y2="175"/>
    </g>
    <text class="t" x="95" y="115" fill="#2e86de">Y</text>

    <!-- y' on image -->
    <g stroke="#27ae60" stroke-width="1.5">
      <line x1="590" y1="180" x2="590" y2="240"/>
    </g>
    <text class="t" x="605" y="215" fill="#27ae60">y'</text>
  </g>

  <!-- Equation box -->
  <g transform="translate(30,360)">
    <rect x="0" y="0" width="800" height="75" fill="#fff7d6" stroke="#d4a017"/>
    <text class="tb" x="15" y="22">닮음삼각형의 결론 (투영 방정식)</text>
    <text class="eq" x="15" y="48">x' = f · X / Z,    y' = f · Y / Z     ← Z로 나눠서 "멀면 작게 보인다"</text>
    <text class="lab" x="15" y="68" fill="#c0392b" font-weight="bold">핵심: Z로 나누는 이 한 번의 나눗셈이 원근감(perspective)을 만든다. 직각평행 → 사다리꼴 되는 이유.</text>
  </g>
</svg>
