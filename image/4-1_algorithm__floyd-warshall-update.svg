<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440">
  <rect width="980" height="440" fill="#f8fafc"/>
  <text x="40" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Floyd-Warshall 갱신 한 칸</text>
  <text x="40" y="84" font-family="Arial, sans-serif" font-size="16" fill="#475569">k번 정점을 새 중간 정점으로 허용할 때, i에서 j로 가는 기존 경로와 우회 경로를 비교한다.</text>

  <defs>
    <marker id="fwArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <circle cx="180" cy="230" r="38" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <circle cx="480" cy="160" r="38" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <circle cx="780" cy="230" r="38" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="180" y="238" text-anchor="middle" font-size="24" font-weight="700">i</text>
    <text x="480" y="168" text-anchor="middle" font-size="24" font-weight="700">k</text>
    <text x="780" y="238" text-anchor="middle" font-size="24" font-weight="700">j</text>

    <path d="M218 230 C345 290, 615 290, 742 230" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#fwArrow)"/>
    <text x="480" y="310" text-anchor="middle" font-size="17" fill="#334155">기존 D[i][j]</text>

    <path d="M214 218 C305 178, 380 160, 442 160" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#fwArrow)"/>
    <path d="M518 160 C610 160, 690 178, 746 218" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#fwArrow)"/>
    <text x="330" y="145" text-anchor="middle" font-size="17" fill="#92400e">D[i][k]</text>
    <text x="630" y="145" text-anchor="middle" font-size="17" fill="#92400e">D[k][j]</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="140" y="350" width="700" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="490" y="386" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">D[i][j] = min(D[i][j], D[i][k] + D[k][j])</text>
  </g>
</svg>
