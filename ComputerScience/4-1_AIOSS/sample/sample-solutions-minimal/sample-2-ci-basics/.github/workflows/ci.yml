name: Simple CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.10"

      - name: Install lint dependency
        run: python -m pip install --upgrade pip ruff

      - name: Run lint
        run: ruff check .
