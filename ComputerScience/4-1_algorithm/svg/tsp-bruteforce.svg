<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 760" font-family="system-ui,sans-serif">
  <style>
    .tb{font-size:15px;font-weight:bold}
    .th{font-size:13px;font-weight:bold;text-anchor:middle;font-family:monospace}
    .t{font-size:12px;text-anchor:middle;font-family:monospace;font-weight:bold}
    .lab{font-size:12px}
    .mono{font-family:monospace;font-size:12px}
    .cell{fill:#fff;stroke:#2c3e50;stroke-width:1.1}
    .focus{fill:#fff2cc;stroke:#f39c12;stroke-width:2.5}
    .best{fill:#d0f5d0;stroke:#27ae60;stroke-width:2.5}
    .step{fill:#eaf2fb;stroke:#2e86de;stroke-width:1.3}
    .sum{fill:#fff7d6;stroke:#d4a017;stroke-width:1.5}
    .city{fill:#fff2cc;stroke:#f39c12;stroke-width:2}
    .edge{stroke:#888;stroke-width:1.5;fill:none}
    .edgeFocus{stroke:#27ae60;stroke-width:3;fill:none}
    .badge{fill:#c0392b}
    .badgeT{font-size:11px;fill:#fff;text-anchor:middle;font-weight:bold}
  </style>

  <text class="tb" x="510" y="22" text-anchor="middle">Ch.3 예제 — 외판원 문제(TSP) 완전탐색 (4개 도시)</text>
  <text class="lab" x="510" y="42" text-anchor="middle">도시 A를 출발해 B,C,D를 모두 한 번씩 방문 후 A로 복귀 — <tspan fill="#c0392b" font-weight="bold">최소 비용 경로</tspan>를 모든 순열 검사로 찾기</text>

  <!-- Step 1: Graph + 비용 행렬 -->
  <g transform="translate(30,60)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">1</text>
    <text class="tb" x="15" y="18">가중 그래프와 비용 행렬</text>

    <!-- Graph -->
    <g transform="translate(40,50)">
      <line class="edge" x1="60" y1="30" x2="200" y2="30"/>
      <line class="edge" x1="60" y1="30" x2="60" y2="150"/>
      <line class="edge" x1="60" y1="30" x2="200" y2="150"/>
      <line class="edge" x1="200" y1="30" x2="60" y2="150"/>
      <line class="edge" x1="200" y1="30" x2="200" y2="150"/>
      <line class="edge" x1="60" y1="150" x2="200" y2="150"/>

      <text class="lab" x="130" y="22" text-anchor="middle">10</text>
      <text class="lab" x="45" y="95" text-anchor="middle">20</text>
      <text class="lab" x="215" y="95" text-anchor="middle">15</text>
      <text class="lab" x="100" y="80">35</text>
      <text class="lab" x="155" y="80">25</text>
      <text class="lab" x="130" y="165" text-anchor="middle">30</text>

      <circle class="city" cx="60" cy="30" r="18"/><text class="t" x="60" y="34">A</text>
      <circle class="city" cx="200" cy="30" r="18"/><text class="t" x="200" y="34">B</text>
      <circle class="city" cx="60" cy="150" r="18"/><text class="t" x="60" y="154">C</text>
      <circle class="city" cx="200" cy="150" r="18"/><text class="t" x="200" y="154">D</text>
    </g>

    <!-- Cost matrix -->
    <g transform="translate(320,50)">
      <text class="lab" x="0" y="5" font-weight="bold">비용 행렬 (대칭):</text>
      <rect class="cell" x="0" y="15" width="40" height="28"/><text class="t" x="20" y="33"></text>
      <rect class="cell" x="40" y="15" width="50" height="28"/><text class="t" x="65" y="33">A</text>
      <rect class="cell" x="90" y="15" width="50" height="28"/><text class="t" x="115" y="33">B</text>
      <rect class="cell" x="140" y="15" width="50" height="28"/><text class="t" x="165" y="33">C</text>
      <rect class="cell" x="190" y="15" width="50" height="28"/><text class="t" x="215" y="33">D</text>

      <rect class="cell" x="0" y="43" width="40" height="28"/><text class="t" x="20" y="61">A</text>
      <rect class="cell" x="40" y="43" width="50" height="28" fill="#eee"/><text class="t" x="65" y="61">0</text>
      <rect class="cell" x="90" y="43" width="50" height="28"/><text class="t" x="115" y="61">10</text>
      <rect class="cell" x="140" y="43" width="50" height="28"/><text class="t" x="165" y="61">20</text>
      <rect class="cell" x="190" y="43" width="50" height="28"/><text class="t" x="215" y="61">25</text>

      <rect class="cell" x="0" y="71" width="40" height="28"/><text class="t" x="20" y="89">B</text>
      <rect class="cell" x="40" y="71" width="50" height="28"/><text class="t" x="65" y="89">10</text>
      <rect class="cell" x="90" y="71" width="50" height="28" fill="#eee"/><text class="t" x="115" y="89">0</text>
      <rect class="cell" x="140" y="71" width="50" height="28"/><text class="t" x="165" y="89">35</text>
      <rect class="cell" x="190" y="71" width="50" height="28"/><text class="t" x="215" y="89">15</text>

      <rect class="cell" x="0" y="99" width="40" height="28"/><text class="t" x="20" y="117">C</text>
      <rect class="cell" x="40" y="99" width="50" height="28"/><text class="t" x="65" y="117">20</text>
      <rect class="cell" x="90" y="99" width="50" height="28"/><text class="t" x="115" y="117">35</text>
      <rect class="cell" x="140" y="99" width="50" height="28" fill="#eee"/><text class="t" x="165" y="117">0</text>
      <rect class="cell" x="190" y="99" width="50" height="28"/><text class="t" x="215" y="117">30</text>

      <rect class="cell" x="0" y="127" width="40" height="28"/><text class="t" x="20" y="145">D</text>
      <rect class="cell" x="40" y="127" width="50" height="28"/><text class="t" x="65" y="145">25</text>
      <rect class="cell" x="90" y="127" width="50" height="28"/><text class="t" x="115" y="145">15</text>
      <rect class="cell" x="140" y="127" width="50" height="28"/><text class="t" x="165" y="145">30</text>
      <rect class="cell" x="190" y="127" width="50" height="28" fill="#eee"/><text class="t" x="215" y="145">0</text>
    </g>

    <g transform="translate(610,50)">
      <rect class="sum" x="0" y="0" width="280" height="155"/>
      <text class="lab" x="10" y="20" font-weight="bold" fill="#c0392b">고정: 출발 A</text>
      <text class="mono" x="10" y="42">나머지 {B, C, D}의 순열 = 3! = 6</text>
      <text class="mono" x="10" y="62">각 순열 뒤에 A 붙여 완전 경로 구성</text>
      <text class="lab" x="10" y="85" font-weight="bold" fill="#2e86de">순열:</text>
      <text class="mono" x="10" y="103">B-C-D, B-D-C, C-B-D,</text>
      <text class="mono" x="10" y="121">C-D-B, D-B-C, D-C-B</text>
      <text class="lab" x="10" y="145" fill="#c0392b" font-weight="bold">대칭 경로 중복 → 실질 3가지</text>
    </g>
  </g>

  <!-- Step 2: 6가지 경로 나열 -->
  <g transform="translate(30,290)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">2</text>
    <text class="tb" x="15" y="18">모든 경로 비용 계산 — 각 순열에 대해 4개 간선 합산</text>

    <g transform="translate(0,40)">
      <rect class="cell" x="15" y="0" width="60" height="28"/><text class="th" x="45" y="18">#</text>
      <rect class="cell" x="75" y="0" width="220" height="28"/><text class="th" x="185" y="18">경로</text>
      <rect class="cell" x="295" y="0" width="420" height="28"/><text class="th" x="505" y="18">비용 계산</text>
      <rect class="cell" x="715" y="0" width="220" height="28"/><text class="th" x="825" y="18">합계</text>

      <rect class="step" x="15" y="28" width="60" height="28"/><text class="th" x="45" y="46">1</text>
      <rect class="step" x="75" y="28" width="220" height="28"/><text class="t" x="185" y="46">A → B → C → D → A</text>
      <rect class="step" x="295" y="28" width="420" height="28"/><text class="t" x="505" y="46">10 + 35 + 30 + 25</text>
      <rect class="step" x="715" y="28" width="220" height="28"/><text class="t" x="825" y="46">100</text>

      <rect class="best" x="15" y="56" width="60" height="28"/><text class="th" x="45" y="74">2</text>
      <rect class="best" x="75" y="56" width="220" height="28"/><text class="t" x="185" y="74">A → B → D → C → A</text>
      <rect class="best" x="295" y="56" width="420" height="28"/><text class="t" x="505" y="74">10 + 15 + 30 + 20</text>
      <rect class="best" x="715" y="56" width="220" height="28"/><text class="t" x="825" y="74" fill="#27ae60">75 ★ 최솟값</text>

      <rect class="step" x="15" y="84" width="60" height="28"/><text class="th" x="45" y="102">3</text>
      <rect class="step" x="75" y="84" width="220" height="28"/><text class="t" x="185" y="102">A → C → B → D → A</text>
      <rect class="step" x="295" y="84" width="420" height="28"/><text class="t" x="505" y="102">20 + 35 + 15 + 25</text>
      <rect class="step" x="715" y="84" width="220" height="28"/><text class="t" x="825" y="102">95</text>

      <rect class="step" x="15" y="112" width="60" height="28"/><text class="th" x="45" y="130">4</text>
      <rect class="step" x="75" y="112" width="220" height="28"/><text class="t" x="185" y="130">A → C → D → B → A</text>
      <rect class="step" x="295" y="112" width="420" height="28"/><text class="t" x="505" y="130">20 + 30 + 15 + 10</text>
      <rect class="best" x="715" y="112" width="220" height="28"/><text class="t" x="825" y="130" fill="#27ae60">75 ★ (#2의 역방향)</text>

      <rect class="step" x="15" y="140" width="60" height="28"/><text class="th" x="45" y="158">5</text>
      <rect class="step" x="75" y="140" width="220" height="28"/><text class="t" x="185" y="158">A → D → B → C → A</text>
      <rect class="step" x="295" y="140" width="420" height="28"/><text class="t" x="505" y="158">25 + 15 + 35 + 20</text>
      <rect class="step" x="715" y="140" width="220" height="28"/><text class="t" x="825" y="158">95 (#3의 역방향)</text>

      <rect class="step" x="15" y="168" width="60" height="28"/><text class="th" x="45" y="186">6</text>
      <rect class="step" x="75" y="168" width="220" height="28"/><text class="t" x="185" y="186">A → D → C → B → A</text>
      <rect class="step" x="295" y="168" width="420" height="28"/><text class="t" x="505" y="186">25 + 30 + 35 + 10</text>
      <rect class="step" x="715" y="168" width="220" height="28"/><text class="t" x="825" y="186">100 (#1의 역방향)</text>
    </g>
  </g>

  <!-- Step 3: 최적 경로 하이라이트 -->
  <g transform="translate(30,545)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">3</text>
    <text class="tb" x="15" y="18">최적 경로 시각화 — A → B → D → C → A (비용 75)</text>

    <g transform="translate(40,35)">
      <line class="edgeFocus" x1="60" y1="30" x2="200" y2="30"/>
      <line class="edgeFocus" x1="200" y1="30" x2="200" y2="150"/>
      <line class="edgeFocus" x1="200" y1="150" x2="60" y2="150"/>
      <line class="edgeFocus" x1="60" y1="150" x2="60" y2="30"/>

      <text class="lab" x="130" y="22" text-anchor="middle" fill="#27ae60" font-weight="bold">10</text>
      <text class="lab" x="215" y="95" text-anchor="middle" fill="#27ae60" font-weight="bold">15</text>
      <text class="lab" x="130" y="165" text-anchor="middle" fill="#27ae60" font-weight="bold">30</text>
      <text class="lab" x="45" y="95" text-anchor="middle" fill="#27ae60" font-weight="bold">20</text>

      <circle class="best" cx="60" cy="30" r="18"/><text class="t" x="60" y="34">A</text>
      <circle class="best" cx="200" cy="30" r="18"/><text class="t" x="200" y="34">B</text>
      <circle class="best" cx="200" cy="150" r="18"/><text class="t" x="200" y="154">D</text>
      <circle class="best" cx="60" cy="150" r="18"/><text class="t" x="60" y="154">C</text>
    </g>

    <g transform="translate(300,35)">
      <rect class="sum" x="0" y="0" width="560" height="155"/>
      <text class="tb" x="15" y="22">복잡도 분석 — 왜 느린가</text>
      <text class="mono" x="15" y="45">출발지 고정 → (n−1)! 순열 &#160;·&#160; 각 순열 비용 합산 Θ(n)</text>
      <text class="mono" x="15" y="65" fill="#c0392b" font-weight="bold">⇒ T(n) = Θ((n−1)! · n) = Θ(n!)</text>
      <text class="mono" x="15" y="90">n=10 → 약 360만 경로 &#160;·&#160; n=15 → 약 870억 &#160;·&#160; n=20 → 10¹⁸</text>
      <text class="lab" x="15" y="115" fill="#27ae60" font-weight="bold">개선:</text>
      <text class="mono" x="65" y="115">동적계획법(비트마스크 DP) Θ(n²·2ⁿ) — 20-도시급까지 가능</text>
      <text class="lab" x="15" y="140" fill="#2e86de" font-weight="bold">실전:</text>
      <text class="mono" x="65" y="140">근사 알고리즘(2-OPT, 최근접 이웃) — 실용적 해</text>
    </g>
  </g>
</svg>
