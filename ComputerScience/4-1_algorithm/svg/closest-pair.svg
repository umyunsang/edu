<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" font-family="system-ui,sans-serif">
  <style>
    .tb{font-size:15px;font-weight:bold}
    .th{font-size:13px;font-weight:bold;text-anchor:middle;font-family:monospace}
    .t{font-size:12px;text-anchor:middle;font-family:monospace;font-weight:bold}
    .lab{font-size:12px}
    .mono{font-family:monospace;font-size:12px}
    .cell{fill:#fff;stroke:#2c3e50;stroke-width:1.1}
    .focus{fill:#fff2cc;stroke:#f39c12;stroke-width:2.5}
    .best{fill:#d0f5d0;stroke:#27ae60;stroke-width:2.5}
    .sum{fill:#fff7d6;stroke:#d4a017;stroke-width:1.5}
    .step{fill:#eaf2fb;stroke:#2e86de;stroke-width:1.3}
    .axis{stroke:#999;stroke-width:1}
    .split{stroke:#c0392b;stroke-width:1.8;stroke-dasharray:6 4}
    .strip{fill:#fde2e2;fill-opacity:0.3;stroke:#c0392b;stroke-width:1;stroke-dasharray:3 3}
    .pt{fill:#2c3e50}
    .ptL{fill:#2e86de}
    .ptR{fill:#c0392b}
    .best-line{stroke:#27ae60;stroke-width:2.5}
    .candidate{stroke:#f39c12;stroke-width:1.5;stroke-dasharray:2 2}
    .badge{fill:#c0392b}
    .badgeT{font-size:11px;fill:#fff;text-anchor:middle;font-weight:bold}
  </style>

  <text class="tb" x="470" y="22" text-anchor="middle">Ch.5 예제 — 최근점 쌍 문제 (Closest Pair): 분할정복 Θ(n log n)</text>
  <text class="lab" x="470" y="42" text-anchor="middle">평면 위 n개 점 중 거리 최소 쌍 찾기 — 억지 Θ(n²) → <tspan fill="#27ae60" font-weight="bold">분할정복 Θ(n log n)</tspan></text>

  <!-- Step 1: 분할 -->
  <g transform="translate(30,60)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">1</text>
    <text class="tb" x="15" y="18">분할 (Divide) — x좌표 중앙값으로 좌/우 반 분할</text>

    <g transform="translate(30,40)">
      <rect x="0" y="0" width="420" height="180" fill="#fafafa" stroke="#ccc"/>
      <line class="axis" x1="0" y1="90" x2="420" y2="90"/>
      <line class="split" x1="210" y1="5" x2="210" y2="175"/>
      <text class="lab" x="210" y="170" text-anchor="middle" fill="#c0392b" font-weight="bold">x = mid</text>

      <circle class="ptL" cx="40" cy="60" r="5"/><text class="lab" x="40" y="52" text-anchor="middle">p₁</text>
      <circle class="ptL" cx="80" cy="120" r="5"/><text class="lab" x="80" y="140" text-anchor="middle">p₂</text>
      <circle class="ptL" cx="130" cy="40" r="5"/><text class="lab" x="130" y="32" text-anchor="middle">p₃</text>
      <circle class="ptL" cx="160" cy="100" r="5"/><text class="lab" x="160" y="120" text-anchor="middle">p₄</text>
      <circle class="ptL" cx="195" cy="70" r="5"/><text class="lab" x="195" y="62" text-anchor="middle">p₅</text>

      <circle class="ptR" cx="235" cy="130" r="5"/><text class="lab" x="235" y="150" text-anchor="middle">p₆</text>
      <circle class="ptR" cx="280" cy="50" r="5"/><text class="lab" x="280" y="42" text-anchor="middle">p₇</text>
      <circle class="ptR" cx="320" cy="110" r="5"/><text class="lab" x="320" y="130" text-anchor="middle">p₈</text>
      <circle class="ptR" cx="370" cy="70" r="5"/><text class="lab" x="370" y="62" text-anchor="middle">p₉</text>
      <circle class="ptR" cx="390" cy="140" r="5"/><text class="lab" x="390" y="160" text-anchor="middle">p₁₀</text>

      <text class="lab" x="105" y="18" text-anchor="middle" fill="#2e86de" font-weight="bold">P_L (5개)</text>
      <text class="lab" x="315" y="18" text-anchor="middle" fill="#c0392b" font-weight="bold">P_R (5개)</text>
    </g>

    <g transform="translate(480,40)">
      <rect class="sum" x="0" y="0" width="390" height="180"/>
      <text class="tb" x="15" y="22">절차</text>
      <text class="mono" x="15" y="45">1) 점들을 x좌표로 정렬</text>
      <text class="mono" x="15" y="65">2) 중앙 x = mid로 반 분할</text>
      <text class="mono" x="15" y="85">3) P_L, P_R 각각 재귀 호출</text>
      <text class="mono" x="15" y="105">   → d_L = ClosestPair(P_L)</text>
      <text class="mono" x="15" y="125">   → d_R = ClosestPair(P_R)</text>
      <text class="mono" x="15" y="145" fill="#c0392b" font-weight="bold">4) d = min(d_L, d_R)  ← 후보</text>
      <text class="lab" x="15" y="168" fill="#2e86de" font-weight="bold">단, 경계 영역 쌍은 놓칠 수 있음 ⚠</text>
    </g>
  </g>

  <!-- Step 2: 정복 + 경계 영역 병합 -->
  <g transform="translate(30,270)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">2</text>
    <text class="tb" x="15" y="18">정복 &amp; 병합 (Merge) — 폭 d의 경계 Strip 내에서 후보 쌍 확인</text>

    <g transform="translate(30,40)">
      <rect x="0" y="0" width="420" height="180" fill="#fafafa" stroke="#ccc"/>
      <line class="split" x1="210" y1="5" x2="210" y2="175"/>
      <rect class="strip" x="160" y="5" width="100" height="170"/>
      <text class="lab" x="210" y="20" text-anchor="middle" fill="#c0392b" font-weight="bold">폭 2d strip</text>

      <circle class="ptL" cx="40" cy="60" r="4" opacity="0.4"/>
      <circle class="ptL" cx="80" cy="120" r="4" opacity="0.4"/>
      <circle class="ptL" cx="130" cy="40" r="4" opacity="0.4"/>
      <circle class="ptL" cx="160" cy="100" r="5"/>
      <circle class="ptL" cx="195" cy="70" r="5"/>

      <circle class="ptR" cx="235" cy="130" r="5"/>
      <circle class="ptR" cx="260" cy="80" r="5"/>
      <circle class="ptR" cx="320" cy="110" r="4" opacity="0.4"/>
      <circle class="ptR" cx="370" cy="70" r="4" opacity="0.4"/>

      <line class="candidate" x1="195" y1="70" x2="260" y2="80"/>
      <line class="best-line" x1="160" y1="100" x2="195" y2="70"/>

      <text class="lab" x="55" y="20">d_L</text>
      <text class="lab" x="280" y="20" fill="#c0392b">d_R</text>
    </g>

    <g transform="translate(480,40)">
      <rect class="sum" x="0" y="0" width="390" height="180"/>
      <text class="tb" x="15" y="22">핵심 관찰 — strip 내 쌍은 적다</text>
      <text class="mono" x="15" y="45">· x 거리 &lt; d 인 점만 strip에 들어감</text>
      <text class="mono" x="15" y="65">· strip 점들을 y좌표로 정렬</text>
      <text class="mono" x="15" y="85" fill="#f39c12" font-weight="bold">· 각 점에 대해 y방향 7개 이내만 비교</text>
      <text class="mono" x="15" y="105">  (기하학적 성질 — d×2d 사각형에</text>
      <text class="mono" x="15" y="125">  최대 8점)</text>
      <text class="mono" x="15" y="150" fill="#27ae60" font-weight="bold">⇒ strip 단계 비용 O(n)</text>
    </g>
  </g>

  <!-- Step 3: 재귀 호출 트리 -->
  <g transform="translate(30,500)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">3</text>
    <text class="tb" x="15" y="18">재귀 트리와 점화식 — 병합정렬과 동형</text>

    <g transform="translate(40,35)">
      <line stroke="#555" stroke-width="1.5" x1="200" y1="20" x2="80" y2="70"/>
      <line stroke="#555" stroke-width="1.5" x1="200" y1="20" x2="320" y2="70"/>
      <line stroke="#555" stroke-width="1.5" x1="80" y1="90" x2="30" y2="140"/>
      <line stroke="#555" stroke-width="1.5" x1="80" y1="90" x2="130" y2="140"/>
      <line stroke="#555" stroke-width="1.5" x1="320" y1="90" x2="270" y2="140"/>
      <line stroke="#555" stroke-width="1.5" x1="320" y1="90" x2="370" y2="140"/>

      <rect class="focus" x="150" y="5" width="100" height="30"/><text class="t" x="200" y="24">n 점 → T(n)</text>
      <rect class="step" x="30" y="75" width="100" height="30"/><text class="t" x="80" y="94">n/2 → T(n/2)</text>
      <rect class="step" x="270" y="75" width="100" height="30"/><text class="t" x="320" y="94">n/2 → T(n/2)</text>
      <rect class="cell" x="-10" y="145" width="80" height="28"/><text class="t" x="30" y="163">n/4</text>
      <rect class="cell" x="90" y="145" width="80" height="28"/><text class="t" x="130" y="163">n/4</text>
      <rect class="cell" x="230" y="145" width="80" height="28"/><text class="t" x="270" y="163">n/4</text>
      <rect class="cell" x="330" y="145" width="80" height="28"/><text class="t" x="370" y="163">n/4</text>
    </g>

    <g transform="translate(480,35)">
      <rect class="sum" x="0" y="0" width="390" height="160"/>
      <text class="tb" x="15" y="22">점화식</text>
      <text class="mono" x="15" y="45" fill="#c0392b" font-weight="bold">T(n) = 2T(n/2) + Θ(n)</text>
      <text class="mono" x="15" y="65">  · 분할: Θ(1)</text>
      <text class="mono" x="15" y="85">  · 정복: 2T(n/2)</text>
      <text class="mono" x="15" y="105">  · 병합(strip): Θ(n)</text>
      <text class="mono" x="15" y="130" fill="#27ae60" font-weight="bold">마스터 정리 Case 2 (a=b²·... 아님)</text>
      <text class="mono" x="15" y="150" fill="#27ae60" font-weight="bold">⇒ T(n) = Θ(n log n)</text>
    </g>
  </g>

  <!-- Step 4: 억지 vs 분할정복 -->
  <g transform="translate(30,735)">
    <rect class="sum" x="0" y="-15" width="880" height="30"/>
    <text class="mono" x="15" y="5">비교 — n=10⁶: 억지 Θ(n²) = 10¹² 비교 &#160;·&#160; 분할정복 Θ(n log n) ≈ 2×10⁷ &#160;→&#160; <tspan fill="#c0392b" font-weight="bold">5만배 빠름</tspan></text>
  </g>
</svg>
