<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" font-family="system-ui,sans-serif">
  <style>
    .t{font-size:12px}
    .tb{font-size:14px;font-weight:bold}
    .th{font-size:13px;font-weight:bold;text-anchor:middle}
    .box{fill:#f7f9fc;stroke:#2c3e50;stroke-width:1.5}
    .c1{fill:#fde2e2;stroke:#c0392b;stroke-width:2}
    .c2{fill:#e7f5e2;stroke:#27ae60;stroke-width:2}
    .c3{fill:#e2eefd;stroke:#2e86de;stroke-width:2}
    .flow{fill:#fff7d6;stroke:#d4a017;stroke-width:1.5}
    .mono{font-family:monospace;font-size:12px}
    .lab{font-size:12px}
    .note{font-size:11px}
    .ar{stroke:#2c3e50;stroke-width:2;fill:none;marker-end:url(#ar)}
    .arY{stroke:#d4a017;stroke-width:2;fill:none;marker-end:url(#arY)}
    .badge{fill:#c0392b}
    .badgeT{font-size:11px;fill:#fff;text-anchor:middle;font-weight:bold}
    .focus{fill:#fff2cc;stroke:#f39c12;stroke-width:2.5}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2c3e50"/></marker>
    <marker id="arY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d4a017"/></marker>
  </defs>

  <text class="tb" x="450" y="22" text-anchor="middle">마스터 정리 (Master Theorem): T(n) = a·T(n/b) + f(n) 빠르게 풀기</text>
  <text class="lab" x="450" y="42" text-anchor="middle">비교 축: c = log_b a (분할 비용 vs 결합 비용)</text>

  <!-- Decision flowchart -->
  <g transform="translate(30,60)">
    <rect class="flow" x="0" y="0" width="840" height="130"/>
    <circle class="badge" cx="15" cy="18" r="11"/><text class="badgeT" x="15" y="22">1</text>
    <text class="tb" x="32" y="22">판단 흐름도 — f(n)과 n^c 비교</text>

    <rect class="box focus" x="20" y="40" width="160" height="60" rx="6"/>
    <text class="th" x="100" y="62">입력: a, b, f(n)</text>
    <text class="lab" x="100" y="82" text-anchor="middle">c = log_b a 계산</text>
    <path class="ar" d="M180 70 L230 70"/>

    <rect class="box" x="230" y="40" width="180" height="60" rx="6"/>
    <text class="th" x="320" y="62">f(n) vs n^c 비교</text>
    <text class="lab" x="320" y="82" text-anchor="middle">누가 더 큰가?</text>

    <path class="ar" d="M410 55 L490 25"/>
    <text class="lab" x="435" y="30" fill="#c0392b" font-weight="bold">f &lt; n^c</text>

    <path class="arY" d="M410 70 L490 70"/>
    <text class="lab" x="435" y="65" fill="#d4a017" font-weight="bold">f ≈ n^c</text>

    <path class="ar" d="M410 85 L490 115"/>
    <text class="lab" x="435" y="110" fill="#2e86de" font-weight="bold">f &gt; n^c</text>

    <rect class="c1" x="490" y="0" width="115" height="50" rx="6"/>
    <text class="th" x="547" y="20" fill="#c0392b">Case 1</text>
    <text class="lab" x="547" y="38" text-anchor="middle">Θ(n^c)</text>

    <rect class="c2" x="490" y="55" width="115" height="50" rx="6"/>
    <text class="th" x="547" y="75" fill="#27ae60">Case 2</text>
    <text class="lab" x="547" y="93" text-anchor="middle">Θ(n^c · log n)</text>

    <rect class="c3" x="490" y="110" width="115" height="50" rx="6" transform="translate(0,-30)"/>
    <text class="th" x="547" y="100" fill="#2e86de">Case 3</text>
    <text class="lab" x="547" y="118" text-anchor="middle">Θ(f(n))</text>

    <text class="lab" x="630" y="22" fill="#c0392b">바닥에서 지배</text>
    <text class="lab" x="630" y="40" fill="#c0392b" font-size="11">(분할 일이 더 많음)</text>
    <text class="lab" x="630" y="74" fill="#27ae60">모든 층이 동등</text>
    <text class="lab" x="630" y="92" fill="#27ae60" font-size="11">(각 층 기여 같음)</text>
    <text class="lab" x="630" y="104" fill="#2e86de">꼭대기에서 지배</text>
    <text class="lab" x="630" y="122" fill="#2e86de" font-size="11">(합치는 일이 더 많음)</text>
  </g>

  <!-- 3 cases detailed -->
  <g transform="translate(30,210)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">2</text>
    <text class="tb" x="15" y="18">세 경우 상세</text>
  </g>

  <!-- Case 1 -->
  <g transform="translate(30,240)">
    <rect class="c1" x="0" y="0" width="270" height="240" rx="8"/>
    <text class="th" x="135" y="22" fill="#c0392b">Case 1: 분할 지배</text>
    <line x1="10" y1="32" x2="260" y2="32" stroke="#c0392b"/>
    <text class="tb" x="15" y="52" font-size="12">조건</text>
    <text class="mono" x="135" y="72" text-anchor="middle">f(n) = O(n^(c-ε)), ε &gt; 0</text>
    <text class="note" x="135" y="90" text-anchor="middle">→ f가 n^c보다 엄격히 작음</text>
    <text class="tb" x="15" y="115" font-size="12">결과</text>
    <text class="mono" x="135" y="135" text-anchor="middle" fill="#c0392b" font-weight="bold">T(n) = Θ(n^c)</text>
    <text class="tb" x="15" y="160" font-size="12">예제</text>
    <text class="mono" x="135" y="178" text-anchor="middle">T(n) = 2T(n/2) + 1</text>
    <text class="note" x="135" y="196" text-anchor="middle">a=2, b=2, c=log₂2=1</text>
    <text class="note" x="135" y="212" text-anchor="middle">f(n)=O(1)=O(n^0) &lt; n¹</text>
    <text class="mono" x="135" y="232" text-anchor="middle" fill="#c0392b" font-weight="bold">⇒ Θ(n)</text>
  </g>

  <!-- Case 2 -->
  <g transform="translate(315,240)">
    <rect class="c2" x="0" y="0" width="270" height="240" rx="8"/>
    <text class="th" x="135" y="22" fill="#27ae60">Case 2: 균등 (가장 흔함)</text>
    <line x1="10" y1="32" x2="260" y2="32" stroke="#27ae60"/>
    <text class="tb" x="15" y="52" font-size="12">조건</text>
    <text class="mono" x="135" y="72" text-anchor="middle">f(n) = Θ(n^c · log^k n)</text>
    <text class="note" x="135" y="90" text-anchor="middle">→ f와 n^c가 같은 차수</text>
    <text class="tb" x="15" y="115" font-size="12">결과</text>
    <text class="mono" x="135" y="135" text-anchor="middle" fill="#27ae60" font-weight="bold">T(n) = Θ(n^c · log^(k+1) n)</text>
    <text class="tb" x="15" y="160" font-size="12">예제 (병합정렬)</text>
    <text class="mono" x="135" y="178" text-anchor="middle">T(n) = 2T(n/2) + n</text>
    <text class="note" x="135" y="196" text-anchor="middle">a=2, b=2, c=1, k=0</text>
    <text class="note" x="135" y="212" text-anchor="middle">f(n)=Θ(n¹·log⁰n)</text>
    <text class="mono" x="135" y="232" text-anchor="middle" fill="#27ae60" font-weight="bold">⇒ Θ(n log n)</text>
  </g>

  <!-- Case 3 -->
  <g transform="translate(600,240)">
    <rect class="c3" x="0" y="0" width="270" height="240" rx="8"/>
    <text class="th" x="135" y="22" fill="#2e86de">Case 3: 결합 지배</text>
    <line x1="10" y1="32" x2="260" y2="32" stroke="#2e86de"/>
    <text class="tb" x="15" y="52" font-size="12">조건</text>
    <text class="mono" x="135" y="72" text-anchor="middle">f(n) = Ω(n^(c+ε)), ε &gt; 0</text>
    <text class="note" x="135" y="88" text-anchor="middle">+ regularity:</text>
    <text class="mono" x="135" y="104" text-anchor="middle" font-size="11">a·f(n/b) ≤ k·f(n), k&lt;1</text>
    <text class="tb" x="15" y="130" font-size="12">결과</text>
    <text class="mono" x="135" y="150" text-anchor="middle" fill="#2e86de" font-weight="bold">T(n) = Θ(f(n))</text>
    <text class="tb" x="15" y="175" font-size="12">예제</text>
    <text class="mono" x="135" y="193" text-anchor="middle">T(n) = 2T(n/2) + n²</text>
    <text class="note" x="135" y="210" text-anchor="middle">c=1, f(n)=n²=Ω(n^(1+1))</text>
    <text class="mono" x="135" y="232" text-anchor="middle" fill="#2e86de" font-weight="bold">⇒ Θ(n²)</text>
  </g>

  <!-- Application table -->
  <g transform="translate(30,500)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">3</text>
    <text class="tb" x="15" y="18">대표 알고리즘 점화식 매칭표</text>
    <rect class="flow" x="0" y="30" width="840" height="130"/>

    <text class="lab" x="10" y="50" font-weight="bold">알고리즘</text>
    <text class="lab" x="170" y="50" font-weight="bold">점화식</text>
    <text class="lab" x="400" y="50" font-weight="bold">a, b, c=log_b a</text>
    <text class="lab" x="570" y="50" font-weight="bold">Case</text>
    <text class="lab" x="660" y="50" font-weight="bold">결과</text>
    <line x1="10" y1="55" x2="830" y2="55" stroke="#d4a017"/>

    <text class="lab" x="10" y="72">이진 탐색</text>
    <text class="mono" x="170" y="72">T(n) = T(n/2) + 1</text>
    <text class="mono" x="400" y="72">a=1, b=2, c=0</text>
    <text class="lab" x="570" y="72" fill="#27ae60" font-weight="bold">Case 2</text>
    <text class="mono" x="660" y="72" fill="#27ae60" font-weight="bold">Θ(log n)</text>

    <text class="lab" x="10" y="90">병합 정렬 / 퀵 평균</text>
    <text class="mono" x="170" y="90">T(n) = 2T(n/2) + n</text>
    <text class="mono" x="400" y="90">a=2, b=2, c=1</text>
    <text class="lab" x="570" y="90" fill="#27ae60" font-weight="bold">Case 2</text>
    <text class="mono" x="660" y="90" fill="#27ae60" font-weight="bold">Θ(n log n)</text>

    <text class="lab" x="10" y="108">Strassen 행렬곱</text>
    <text class="mono" x="170" y="108">T(n) = 7T(n/2) + n²</text>
    <text class="mono" x="400" y="108">a=7, b=2, c≈2.81</text>
    <text class="lab" x="570" y="108" fill="#c0392b" font-weight="bold">Case 1</text>
    <text class="mono" x="660" y="108" fill="#c0392b" font-weight="bold">Θ(n^2.81)</text>

    <text class="lab" x="10" y="126">Karatsuba 곱셈</text>
    <text class="mono" x="170" y="126">T(n) = 3T(n/2) + n</text>
    <text class="mono" x="400" y="126">a=3, b=2, c≈1.58</text>
    <text class="lab" x="570" y="126" fill="#c0392b" font-weight="bold">Case 1</text>
    <text class="mono" x="660" y="126" fill="#c0392b" font-weight="bold">Θ(n^1.58)</text>

    <text class="lab" x="10" y="144">단순 행렬곱 분할</text>
    <text class="mono" x="170" y="144">T(n) = 2T(n/2) + n²</text>
    <text class="mono" x="400" y="144">a=2, b=2, c=1</text>
    <text class="lab" x="570" y="144" fill="#2e86de" font-weight="bold">Case 3</text>
    <text class="mono" x="660" y="144" fill="#2e86de" font-weight="bold">Θ(n²)</text>
  </g>

  <!-- Caveat -->
  <g transform="translate(30,680)">
    <rect class="flow" x="0" y="0" width="840" height="50"/>
    <text class="tb" x="15" y="20" fill="#c0392b">⚠ 주의</text>
    <text class="lab" x="70" y="20">세 경우 어디에도 안 맞으면 마스터 정리 적용 불가. (예: T(n)=2T(n/2)+n·log n은 Case 2 확장형으로만 해결)</text>
    <text class="lab" x="15" y="40">감산형 T(n) = T(n-1) + f(n) 같은 "빼기" 점화식은 마스터 정리가 아니라 직접 전개 (하노이 탑이 그 예).</text>
  </g>
</svg>
