<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="system-ui,sans-serif">
  <style>
    .c{fill:#fff;stroke:#2c3e50;stroke-width:1.5}
    .pv{fill:#ffeb99;stroke:#d4a017;stroke-width:2}
    .lo{fill:#d6e9ff;stroke:#2e86de}
    .hi{fill:#ffd6d6;stroke:#c0392b}
    .ans{fill:#d0f5d0;stroke:#27ae60;stroke-width:2.5}
    .drop{fill:#eee;stroke:#aaa;stroke-dasharray:4 3}
    .t{font-size:14px;text-anchor:middle;font-family:monospace;font-weight:bold}
    .lab{font-size:13px}
    .tb{font-size:15px;font-weight:bold}
    .arrow{stroke:#666;stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#666"/></marker>
  </defs>
  <text class="tb" x="410" y="22" text-anchor="middle">Quick Select: [7, 4, 6, 3, 9, 1]에서 3번째로 작은 값 찾기 (k=3)</text>
  <text class="lab" x="30" y="44">아이디어: 퀵정렬처럼 피벗으로 나누되, 답이 들어있는 한쪽만 계속 파고든다. 나머지 절반은 버린다 → 평균 O(n).</text>

  <!-- Step 0 -->
  <g transform="translate(30,60)">
    <text class="tb" x="0" y="15">0단계. 초기 배열 (목표: k=3번째로 작은 값)</text>
    <g transform="translate(0,25)">
      <rect class="c" x="0" y="0" width="50" height="40"/><text class="t" x="25" y="25">7</text>
      <rect class="c" x="50" y="0" width="50" height="40"/><text class="t" x="75" y="25">4</text>
      <rect class="c" x="100" y="0" width="50" height="40"/><text class="t" x="125" y="25">6</text>
      <rect class="c" x="150" y="0" width="50" height="40"/><text class="t" x="175" y="25">3</text>
      <rect class="c" x="200" y="0" width="50" height="40"/><text class="t" x="225" y="25">9</text>
      <rect class="c" x="250" y="0" width="50" height="40"/><text class="t" x="275" y="25">1</text>
    </g>
  </g>

  <!-- Step 1: pivot = 6 -->
  <g transform="translate(30,140)">
    <text class="tb" x="0" y="15">1단계. 피벗 = 6 으로 분할</text>
    <text class="lab" x="0" y="35">6보다 작은 쪽(왼쪽)에 모으고, 큰 쪽(오른쪽)으로 분리. 피벗 위치가 인덱스 3 (4번째 자리).</text>
    <g transform="translate(0,45)">
      <rect class="lo" x="0" y="0" width="50" height="40"/><text class="t" x="25" y="25">4</text>
      <rect class="lo" x="50" y="0" width="50" height="40"/><text class="t" x="75" y="25">3</text>
      <rect class="lo" x="100" y="0" width="50" height="40"/><text class="t" x="125" y="25">1</text>
      <rect class="pv" x="150" y="0" width="50" height="40"/><text class="t" x="175" y="25">6</text>
      <rect class="hi" x="200" y="0" width="50" height="40"/><text class="t" x="225" y="25">9</text>
      <rect class="hi" x="250" y="0" width="50" height="40"/><text class="t" x="275" y="25">7</text>
    </g>
    <text class="lab" x="320" y="70">피벗보다 작은 원소 3개 (왼쪽).</text>
    <text class="lab" x="320" y="90">목표 k=3 → 피벗 왼쪽 절반만 남기고 오른쪽(9, 7)은 버린다.</text>
    <text class="lab" x="320" y="110" fill="#c0392b">피벗 자체는 4번째로 작은 값이므로 답이 아님.</text>
  </g>

  <!-- Step 2: pivot=3 in left subarray -->
  <g transform="translate(30,290)">
    <text class="tb" x="0" y="15">2단계. 왼쪽 부분 [4, 3, 1]에서 피벗 = 3</text>
    <text class="lab" x="0" y="35">3보다 작은 1은 왼쪽, 큰 4는 오른쪽. 피벗 위치가 인덱스 1 (2번째 자리).</text>
    <g transform="translate(0,45)">
      <rect class="lo" x="0" y="0" width="50" height="40"/><text class="t" x="25" y="25">1</text>
      <rect class="pv" x="50" y="0" width="50" height="40"/><text class="t" x="75" y="25">3</text>
      <rect class="hi" x="100" y="0" width="50" height="40"/><text class="t" x="125" y="25">4</text>
      <rect class="drop" x="150" y="0" width="50" height="40"/><text class="t" x="175" y="25" fill="#999">버림</text>
      <rect class="drop" x="200" y="0" width="50" height="40"/><text class="t" x="225" y="25" fill="#999">버림</text>
      <rect class="drop" x="250" y="0" width="50" height="40"/><text class="t" x="275" y="25" fill="#999">버림</text>
    </g>
    <text class="lab" x="320" y="70">피벗 3은 2번째로 작은 값 (k=3보다 작음).</text>
    <text class="lab" x="320" y="90">목표는 k=3 → 피벗 오른쪽에서 (3 - 2) = 1번째로 작은 값 찾기.</text>
    <text class="lab" x="320" y="110" fill="#c0392b">즉 [4] 에서 1번째로 작은 값.</text>
  </g>

  <!-- Step 3: answer -->
  <g transform="translate(30,440)">
    <text class="tb" x="0" y="15">3단계. 오른쪽 부분 [4]에 원소 1개 → 그것이 바로 답</text>
    <g transform="translate(0,25)">
      <rect class="ans" x="0" y="0" width="50" height="40"/><text class="t" x="25" y="25">4</text>
    </g>
    <text class="lab" x="70" y="50" fill="#27ae60" font-weight="bold">✔ 3번째로 작은 값 = 4</text>
    <text class="lab" x="320" y="50">정렬 후 [1,3,4,6,7,9] 에서 3번째가 4 → 일치.</text>
  </g>
</svg>
