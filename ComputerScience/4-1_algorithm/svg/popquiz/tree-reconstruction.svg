<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 680" font-family="system-ui,sans-serif">
  <style>
    .tb{font-size:15px;font-weight:bold}
    .th{font-size:13px;font-weight:bold;text-anchor:middle}
    .t{font-size:13px;text-anchor:middle;font-weight:bold;font-family:monospace}
    .lab{font-size:12px}
    .mono{font-family:monospace;font-size:12px}
    .n{fill:#fff;stroke:#2c3e50;stroke-width:1.5}
    .root{fill:#fff2cc;stroke:#f39c12;stroke-width:3}
    .left{fill:#eaf2fb;stroke:#2e86de;stroke-width:2}
    .right{fill:#fde2e2;stroke:#c0392b;stroke-width:2}
    .sum{fill:#fff7d6;stroke:#d4a017;stroke-width:1.5}
    .cell{fill:#fff;stroke:#2c3e50;stroke-width:1.2}
    .focus{fill:#fff2cc;stroke:#f39c12;stroke-width:2.5}
    .dim{fill:#f7f7f7;stroke:#bbb;opacity:0.7}
    .lcell{fill:#eaf2fb;stroke:#2e86de;stroke-width:1.5}
    .rcell{fill:#fde2e2;stroke:#c0392b;stroke-width:1.5}
    .e{stroke:#555;stroke-width:1.5;fill:none}
    .ar{stroke:#c0392b;stroke-width:2;fill:none;marker-end:url(#rd)}
    .badge{fill:#c0392b}
    .badgeT{font-size:11px;fill:#fff;text-anchor:middle;font-weight:bold}
  </style>
  <defs>
    <marker id="rd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  </defs>

  <text class="tb" x="470" y="22" text-anchor="middle">PQ2-5: 전위 + 중위 → 이진 트리 복원 → 후위 출력</text>
  <text class="lab" x="470" y="42" text-anchor="middle">전위(Preorder): <tspan font-family="monospace" font-weight="bold">A B D E C F G</tspan> &nbsp;&nbsp; 중위(Inorder): <tspan font-family="monospace" font-weight="bold">D B E A F C G</tspan></text>

  <!-- Step 1: 루트 식별 -->
  <g transform="translate(30,60)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">1</text>
    <text class="tb" x="15" y="18">전위의 첫 글자 = 루트 → A. 중위에서 A를 기준으로 좌/우 서브트리 분리</text>

    <g transform="translate(30,35)">
      <text class="lab" x="0" y="15">Pre:</text>
      <rect class="focus" x="30" y="0" width="32" height="28"/><text class="t" x="46" y="20">A</text>
      <rect class="cell" x="62" y="0" width="32" height="28"/><text class="t" x="78" y="20">B</text>
      <rect class="cell" x="94" y="0" width="32" height="28"/><text class="t" x="110" y="20">D</text>
      <rect class="cell" x="126" y="0" width="32" height="28"/><text class="t" x="142" y="20">E</text>
      <rect class="cell" x="158" y="0" width="32" height="28"/><text class="t" x="174" y="20">C</text>
      <rect class="cell" x="190" y="0" width="32" height="28"/><text class="t" x="206" y="20">F</text>
      <rect class="cell" x="222" y="0" width="32" height="28"/><text class="t" x="238" y="20">G</text>
      <text class="lab" x="290" y="20" fill="#f39c12" font-weight="bold">← 첫 글자 = 루트</text>
    </g>

    <g transform="translate(30,75)">
      <text class="lab" x="0" y="15">In:</text>
      <rect class="lcell" x="30" y="0" width="32" height="28"/><text class="t" x="46" y="20">D</text>
      <rect class="lcell" x="62" y="0" width="32" height="28"/><text class="t" x="78" y="20">B</text>
      <rect class="lcell" x="94" y="0" width="32" height="28"/><text class="t" x="110" y="20">E</text>
      <rect class="focus" x="126" y="0" width="32" height="28"/><text class="t" x="142" y="20">A</text>
      <rect class="rcell" x="158" y="0" width="32" height="28"/><text class="t" x="174" y="20">F</text>
      <rect class="rcell" x="190" y="0" width="32" height="28"/><text class="t" x="206" y="20">C</text>
      <rect class="rcell" x="222" y="0" width="32" height="28"/><text class="t" x="238" y="20">G</text>
      <text class="lab" x="290" y="20" fill="#2e86de">좌 서브트리 {D,B,E}</text>
      <text class="lab" x="420" y="20" fill="#c0392b">우 서브트리 {F,C,G}</text>
    </g>
  </g>

  <!-- Step 2: 좌 서브트리 재귀 -->
  <g transform="translate(30,175)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">2</text>
    <text class="tb" x="15" y="18">좌 서브트리 재구성 — Pre의 다음 글자 B가 루트. 중위 {D,B,E}에서 D=좌, E=우</text>

    <g transform="translate(30,35)">
      <text class="lab" x="0" y="15">Pre 좌:</text>
      <rect class="focus" x="50" y="0" width="32" height="28"/><text class="t" x="66" y="20">B</text>
      <rect class="cell" x="82" y="0" width="32" height="28"/><text class="t" x="98" y="20">D</text>
      <rect class="cell" x="114" y="0" width="32" height="28"/><text class="t" x="130" y="20">E</text>
      <text class="lab" x="160" y="20" fill="#f39c12">B가 B-서브루트</text>

      <text class="lab" x="310" y="15">In 좌:</text>
      <rect class="lcell" x="360" y="0" width="32" height="28"/><text class="t" x="376" y="20">D</text>
      <rect class="focus" x="392" y="0" width="32" height="28"/><text class="t" x="408" y="20">B</text>
      <rect class="rcell" x="424" y="0" width="32" height="28"/><text class="t" x="440" y="20">E</text>
      <text class="lab" x="470" y="20">D = B의 좌</text>
      <text class="lab" x="570" y="20">E = B의 우</text>
    </g>
  </g>

  <!-- Step 3: 우 서브트리 재귀 -->
  <g transform="translate(30,245)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">3</text>
    <text class="tb" x="15" y="18">우 서브트리 재구성 — Pre의 다음 블록 {C,F,G}. C가 서브루트, 중위 {F,C,G}에서 F=좌, G=우</text>

    <g transform="translate(30,35)">
      <text class="lab" x="0" y="15">Pre 우:</text>
      <rect class="focus" x="50" y="0" width="32" height="28"/><text class="t" x="66" y="20">C</text>
      <rect class="cell" x="82" y="0" width="32" height="28"/><text class="t" x="98" y="20">F</text>
      <rect class="cell" x="114" y="0" width="32" height="28"/><text class="t" x="130" y="20">G</text>
      <text class="lab" x="160" y="20" fill="#f39c12">C가 C-서브루트</text>

      <text class="lab" x="310" y="15">In 우:</text>
      <rect class="lcell" x="360" y="0" width="32" height="28"/><text class="t" x="376" y="20">F</text>
      <rect class="focus" x="392" y="0" width="32" height="28"/><text class="t" x="408" y="20">C</text>
      <rect class="rcell" x="424" y="0" width="32" height="28"/><text class="t" x="440" y="20">G</text>
      <text class="lab" x="470" y="20">F = C의 좌</text>
      <text class="lab" x="570" y="20">G = C의 우</text>
    </g>
  </g>

  <!-- Step 4: 복원 트리 -->
  <g transform="translate(30,320)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">4</text>
    <text class="tb" x="15" y="18">복원 완료 — 이진 트리 구조</text>

    <g transform="translate(180,40)">
      <line class="e" x1="180" y1="30" x2="80" y2="100"/>
      <line class="e" x1="180" y1="30" x2="280" y2="100"/>
      <line class="e" x1="80" y1="120" x2="30" y2="180"/>
      <line class="e" x1="80" y1="120" x2="130" y2="180"/>
      <line class="e" x1="280" y1="120" x2="230" y2="180"/>
      <line class="e" x1="280" y1="120" x2="330" y2="180"/>

      <circle class="root" cx="180" cy="20" r="22"/><text class="t" x="180" y="25">A</text>
      <circle class="left" cx="80" cy="110" r="22"/><text class="t" x="80" y="115">B</text>
      <circle class="right" cx="280" cy="110" r="22"/><text class="t" x="280" y="115">C</text>
      <circle class="left" cx="30" cy="185" r="22"/><text class="t" x="30" y="190">D</text>
      <circle class="left" cx="130" cy="185" r="22"/><text class="t" x="130" y="190">E</text>
      <circle class="right" cx="230" cy="185" r="22"/><text class="t" x="230" y="190">F</text>
      <circle class="right" cx="330" cy="185" r="22"/><text class="t" x="330" y="190">G</text>
    </g>
  </g>

  <!-- Step 5: 후위 출력 -->
  <g transform="translate(30,565)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">5</text>
    <text class="tb" x="15" y="18">후위 순회 (Postorder) — 좌 → 우 → 루트</text>

    <rect class="sum" x="0" y="30" width="880" height="90"/>
    <text class="lab" x="15" y="50">1. 좌 서브트리 후위: D, E, B</text>
    <text class="lab" x="15" y="68">2. 우 서브트리 후위: F, G, C</text>
    <text class="lab" x="15" y="86">3. 루트: A</text>
    <text class="mono" x="15" y="110" fill="#c0392b" font-weight="bold" font-size="16">답 (후위): D E B F G C A</text>
  </g>
</svg>
