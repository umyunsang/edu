<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="system-ui,sans-serif">
  <style>
    .tb{font-size:15px;font-weight:bold}
    .th{font-size:13px;font-weight:bold;text-anchor:middle;font-family:monospace}
    .t{font-size:12px;text-anchor:middle;font-family:monospace}
    .lab{font-size:12px}
    .mono{font-family:monospace;font-size:12px}
    .box{fill:#fff;stroke:#2c3e50;stroke-width:1.3}
    .focus{fill:#fff2cc;stroke:#f39c12;stroke-width:2.5}
    .step{fill:#eaf2fb;stroke:#2e86de;stroke-width:1.5}
    .done{fill:#d0f5d0;stroke:#27ae60;stroke-width:1.5}
    .sum{fill:#fff7d6;stroke:#d4a017;stroke-width:1.5}
    .ar{stroke:#c0392b;stroke-width:2;fill:none;marker-end:url(#rd)}
    .badge{fill:#c0392b}
    .badgeT{font-size:11px;fill:#fff;text-anchor:middle;font-weight:bold}
    .disk{stroke:#2c3e50;stroke-width:1.2}
    .peg{stroke:#6b4423;stroke-width:3}
  </style>
  <defs>
    <marker id="rd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  </defs>

  <text class="tb" x="450" y="22" text-anchor="middle">PQ1-1: 하노이 탑 점화식 T(n) = 2T(n-1) + 1 풀이</text>
  <text class="lab" x="450" y="42" text-anchor="middle">n개 원반을 A→C로 옮기려면: "A→B로 n-1 옮김 → 가장 큰 원반을 A→C → B→C로 n-1 옮김"</text>

  <!-- Step 1: 재귀 구조 시각화 -->
  <g transform="translate(30,60)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">1</text>
    <text class="tb" x="15" y="18">재귀 구조 — 3단계로 분해</text>

    <!-- Three pegs mini diagram -->
    <g transform="translate(30,40)">
      <text class="th" x="120" y="0">[1단계] A → B로 n-1개 (T(n-1))</text>
      <line class="peg" x1="30" y1="40" x2="30" y2="100"/><line class="peg" x1="120" y1="40" x2="120" y2="100"/><line class="peg" x1="210" y1="40" x2="210" y2="100"/>
      <rect class="disk" x="15" y="60" width="30" height="8" fill="#e74c3c"/>
      <rect class="disk" x="10" y="70" width="40" height="8" fill="#3498db"/>
      <rect class="disk" x="5" y="80" width="50" height="8" fill="#27ae60"/>
      <rect class="disk" x="0" y="90" width="60" height="8" fill="#d4a017"/>
      <text class="t" x="30" y="112">A</text><text class="t" x="120" y="112">B</text><text class="t" x="210" y="112">C</text>
    </g>

    <g transform="translate(320,40)">
      <text class="th" x="120" y="0">[2단계] 큰 원반 A → C (O(1))</text>
      <line class="peg" x1="30" y1="40" x2="30" y2="100"/><line class="peg" x1="120" y1="40" x2="120" y2="100"/><line class="peg" x1="210" y1="40" x2="210" y2="100"/>
      <rect class="focus" x="0" y="90" width="60" height="8"/>
      <rect class="disk" x="105" y="70" width="30" height="8" fill="#e74c3c"/>
      <rect class="disk" x="100" y="80" width="40" height="8" fill="#3498db"/>
      <rect class="disk" x="95" y="90" width="50" height="8" fill="#27ae60"/>
      <path class="ar" d="M60 94 Q150 40 210 94"/>
      <text class="t" x="30" y="112">A</text><text class="t" x="120" y="112">B</text><text class="t" x="210" y="112">C</text>
    </g>

    <g transform="translate(610,40)">
      <text class="th" x="120" y="0">[3단계] B → C로 n-1개 (T(n-1))</text>
      <line class="peg" x1="30" y1="40" x2="30" y2="100"/><line class="peg" x1="120" y1="40" x2="120" y2="100"/><line class="peg" x1="210" y1="40" x2="210" y2="100"/>
      <rect class="disk" x="195" y="60" width="30" height="8" fill="#e74c3c"/>
      <rect class="disk" x="190" y="70" width="40" height="8" fill="#3498db"/>
      <rect class="disk" x="185" y="80" width="50" height="8" fill="#27ae60"/>
      <rect class="done" x="180" y="90" width="60" height="8"/>
      <text class="t" x="30" y="112">A</text><text class="t" x="120" y="112">B</text><text class="t" x="210" y="112">C</text>
    </g>

    <text class="lab" x="420" y="180" text-anchor="middle" fill="#c0392b" font-weight="bold">⇒ T(n) = T(n-1) + 1 + T(n-1) = 2T(n-1) + 1</text>
  </g>

  <!-- Step 2: 반복 대입 전개 -->
  <g transform="translate(30,260)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">2</text>
    <text class="tb" x="15" y="18">반복 대입으로 전개 (점화식을 n번 펼친다)</text>

    <g transform="translate(30,35)">
      <rect class="step" x="0" y="0" width="820" height="30"/>
      <text class="mono" x="15" y="20">T(n) = 2T(n-1) + 1</text>
      <text class="lab" x="500" y="20" fill="#c0392b">← 출발</text>
    </g>
    <g transform="translate(30,70)">
      <rect class="step" x="0" y="0" width="820" height="30"/>
      <text class="mono" x="15" y="20">     = 2[2T(n-2) + 1] + 1 = 2²T(n-2) + 2 + 1</text>
      <text class="lab" x="500" y="20" fill="#2e86de">k=2회 전개</text>
    </g>
    <g transform="translate(30,105)">
      <rect class="step" x="0" y="0" width="820" height="30"/>
      <text class="mono" x="15" y="20">     = 2³T(n-3) + 2² + 2 + 1</text>
      <text class="lab" x="500" y="20" fill="#2e86de">k=3회</text>
    </g>
    <g transform="translate(30,140)">
      <rect class="focus" x="0" y="0" width="820" height="30"/>
      <text class="mono" x="15" y="20">     = 2^k · T(n-k) + (2^(k-1) + ... + 2 + 1)</text>
      <text class="lab" x="500" y="20" fill="#d4a017" font-weight="bold">일반항 (k회)</text>
    </g>
    <g transform="translate(30,175)">
      <rect class="done" x="0" y="0" width="820" height="30"/>
      <text class="mono" x="15" y="20">     = 2^(n-1) · T(1) + (2^(n-1) − 1)   ← k = n-1 대입, T(1)=1</text>
      <text class="lab" x="550" y="20" fill="#27ae60" font-weight="bold">바닥까지</text>
    </g>
    <g transform="translate(30,210)">
      <rect class="done" x="0" y="0" width="820" height="30"/>
      <text class="mono" x="15" y="20" fill="#27ae60" font-weight="bold">     = 2^(n-1) + 2^(n-1) − 1 = 2^n − 1   ⇒  T(n) = Θ(2^n)</text>
    </g>
  </g>

  <!-- Step 3: 표로 검증 -->
  <g transform="translate(30,520)">
    <circle class="badge" cx="-5" cy="15" r="11"/><text class="badgeT" x="-5" y="19">3</text>
    <text class="tb" x="15" y="18">수치 검증 & 체감</text>
    <rect class="sum" x="0" y="30" width="840" height="80"/>

    <text class="lab" x="10" y="50" font-weight="bold">n</text>
    <text class="lab" x="60" y="50" font-weight="bold">1</text>
    <text class="lab" x="110" y="50" font-weight="bold">2</text>
    <text class="lab" x="160" y="50" font-weight="bold">3</text>
    <text class="lab" x="210" y="50" font-weight="bold">5</text>
    <text class="lab" x="270" y="50" font-weight="bold">10</text>
    <text class="lab" x="340" y="50" font-weight="bold">20</text>
    <text class="lab" x="430" y="50" font-weight="bold">30</text>
    <text class="lab" x="530" y="50" font-weight="bold">64 (전설)</text>

    <text class="mono" x="10" y="72">T(n)=2^n−1</text>
    <text class="mono" x="60" y="72">1</text>
    <text class="mono" x="110" y="72">3</text>
    <text class="mono" x="160" y="72">7</text>
    <text class="mono" x="210" y="72">31</text>
    <text class="mono" x="270" y="72">1,023</text>
    <text class="mono" x="340" y="72">1,048,575</text>
    <text class="mono" x="430" y="72">10억+</text>
    <text class="mono" x="530" y="72" fill="#c0392b" font-weight="bold">1.8×10¹⁹ (약 5800억년)</text>

    <text class="lab" x="10" y="95" fill="#c0392b" font-weight="bold">핵심 통찰: 감산형 점화식 T(n)=aT(n-b)+f(n)은 마스터 정리 대상이 아님 → 직접 전개 필요</text>
  </g>
</svg>
