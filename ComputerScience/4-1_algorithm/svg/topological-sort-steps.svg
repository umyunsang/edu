<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 780" font-family="system-ui,sans-serif">
  <style>
    .n{fill:#fff;stroke:#2c3e50;stroke-width:1.5}
    .pick{fill:#ffeb99;stroke:#d4a017;stroke-width:2.5}
    .done{fill:#d0d0d0;stroke:#999;stroke-dasharray:4 3}
    .e{stroke:#666;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .erm{stroke:#ccc;stroke-width:1.2;fill:none;stroke-dasharray:3 3;marker-end:url(#ag)}
    .t{font-size:14px;text-anchor:middle;font-weight:bold}
    .lab{font-size:13px}
    .tb{font-size:15px;font-weight:bold}
    .num{font-size:11px;fill:#c0392b;text-anchor:middle;font-weight:bold}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#666"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ccc"/></marker>
  </defs>
  <text class="tb" x="440" y="22" text-anchor="middle">위상 정렬: 간선 A→C, A→D, B→D, C→E, D→F, E→F</text>
  <text class="lab" x="30" y="44">규칙: 매 단계마다 진입차수 0인 정점을 꺼낸다. 꺼낸 정점의 밖으로 나가는 간선은 제거.</text>

  <!-- Step 0: 초기 상태 -->
  <g transform="translate(30,60)">
    <text class="tb" x="0" y="15">0단계. 초기 상태</text>
    <text class="lab" x="150" y="15">진입차수 — A:0, B:0, C:1, D:2, E:1, F:2</text>
    <circle class="n" cx="60" cy="60" r="22"/><text class="t" x="60" y="65">A</text><text class="num" x="60" y="38">0</text>
    <circle class="n" cx="60" cy="140" r="22"/><text class="t" x="60" y="145">B</text><text class="num" x="60" y="118">0</text>
    <circle class="n" cx="150" cy="60" r="22"/><text class="t" x="150" y="65">C</text><text class="num" x="150" y="38">1</text>
    <circle class="n" cx="150" cy="140" r="22"/><text class="t" x="150" y="145">D</text><text class="num" x="150" y="118">2</text>
    <circle class="n" cx="240" cy="60" r="22"/><text class="t" x="240" y="65">E</text><text class="num" x="240" y="38">1</text>
    <circle class="n" cx="330" cy="100" r="22"/><text class="t" x="330" y="105">F</text><text class="num" x="330" y="78">2</text>
    <line class="e" x1="82" y1="60" x2="128" y2="60"/>
    <line class="e" x1="82" y1="72" x2="128" y2="128"/>
    <line class="e" x1="82" y1="140" x2="128" y2="140"/>
    <line class="e" x1="172" y1="60" x2="218" y2="60"/>
    <line class="e" x1="172" y1="140" x2="308" y2="105"/>
    <line class="e" x1="262" y1="65" x2="308" y2="95"/>
    <text class="lab" x="380" y="100">결과 리스트: [ ]</text>
  </g>

  <!-- Step 1: A 선택 -->
  <g transform="translate(460,60)">
    <text class="tb" x="0" y="15">1단계. A 선택 (진입차수 0)</text>
    <text class="lab" x="0" y="35">A에서 나가는 간선 제거 → C:1→0, D:2→1</text>
    <circle class="pick" cx="60" cy="70" r="22"/><text class="t" x="60" y="75">A</text>
    <circle class="n" cx="60" cy="150" r="22"/><text class="t" x="60" y="155">B</text><text class="num" x="60" y="128">0</text>
    <circle class="n" cx="150" cy="70" r="22"/><text class="t" x="150" y="75">C</text><text class="num" x="150" y="48">0</text>
    <circle class="n" cx="150" cy="150" r="22"/><text class="t" x="150" y="155">D</text><text class="num" x="150" y="128">1</text>
    <circle class="n" cx="240" cy="70" r="22"/><text class="t" x="240" y="75">E</text><text class="num" x="240" y="48">1</text>
    <circle class="n" cx="330" cy="110" r="22"/><text class="t" x="330" y="115">F</text><text class="num" x="330" y="88">2</text>
    <line class="erm" x1="82" y1="70" x2="128" y2="70"/>
    <line class="erm" x1="82" y1="82" x2="128" y2="138"/>
    <line class="e" x1="82" y1="150" x2="128" y2="150"/>
    <line class="e" x1="172" y1="70" x2="218" y2="70"/>
    <line class="e" x1="172" y1="150" x2="308" y2="115"/>
    <line class="e" x1="262" y1="75" x2="308" y2="105"/>
    <text class="lab" x="0" y="200">결과 리스트: [ A ]</text>
  </g>

  <!-- Step 2: B 선택 -->
  <g transform="translate(30,290)">
    <text class="tb" x="0" y="15">2단계. B 선택</text>
    <text class="lab" x="0" y="35">B에서 나가는 간선 제거 → D:1→0</text>
    <circle class="done" cx="60" cy="70" r="22"/><text class="t" x="60" y="75">A</text>
    <circle class="pick" cx="60" cy="150" r="22"/><text class="t" x="60" y="155">B</text>
    <circle class="n" cx="150" cy="70" r="22"/><text class="t" x="150" y="75">C</text><text class="num" x="150" y="48">0</text>
    <circle class="n" cx="150" cy="150" r="22"/><text class="t" x="150" y="155">D</text><text class="num" x="150" y="128">0</text>
    <circle class="n" cx="240" cy="70" r="22"/><text class="t" x="240" y="75">E</text><text class="num" x="240" y="48">1</text>
    <circle class="n" cx="330" cy="110" r="22"/><text class="t" x="330" y="115">F</text><text class="num" x="330" y="88">2</text>
    <line class="erm" x1="82" y1="150" x2="128" y2="150"/>
    <line class="e" x1="172" y1="70" x2="218" y2="70"/>
    <line class="e" x1="172" y1="150" x2="308" y2="115"/>
    <line class="e" x1="262" y1="75" x2="308" y2="105"/>
    <text class="lab" x="0" y="200">결과 리스트: [ A, B ]</text>
  </g>

  <!-- Step 3: C 선택 -->
  <g transform="translate(460,290)">
    <text class="tb" x="0" y="15">3단계. C 선택 (D도 가능, 예시로 C 먼저)</text>
    <text class="lab" x="0" y="35">C→E 제거 → E:1→0</text>
    <circle class="done" cx="60" cy="70" r="22"/><text class="t" x="60" y="75">A</text>
    <circle class="done" cx="60" cy="150" r="22"/><text class="t" x="60" y="155">B</text>
    <circle class="pick" cx="150" cy="70" r="22"/><text class="t" x="150" y="75">C</text>
    <circle class="n" cx="150" cy="150" r="22"/><text class="t" x="150" y="155">D</text><text class="num" x="150" y="128">0</text>
    <circle class="n" cx="240" cy="70" r="22"/><text class="t" x="240" y="75">E</text><text class="num" x="240" y="48">0</text>
    <circle class="n" cx="330" cy="110" r="22"/><text class="t" x="330" y="115">F</text><text class="num" x="330" y="88">2</text>
    <line class="erm" x1="172" y1="70" x2="218" y2="70"/>
    <line class="e" x1="172" y1="150" x2="308" y2="115"/>
    <line class="e" x1="262" y1="75" x2="308" y2="105"/>
    <text class="lab" x="0" y="200">결과 리스트: [ A, B, C ]</text>
  </g>

  <!-- Step 4: D 선택 -->
  <g transform="translate(30,520)">
    <text class="tb" x="0" y="15">4단계. D 선택</text>
    <text class="lab" x="0" y="35">D→F 제거 → F:2→1</text>
    <circle class="done" cx="60" cy="70" r="22"/><text class="t" x="60" y="75">A</text>
    <circle class="done" cx="60" cy="150" r="22"/><text class="t" x="60" y="155">B</text>
    <circle class="done" cx="150" cy="70" r="22"/><text class="t" x="150" y="75">C</text>
    <circle class="pick" cx="150" cy="150" r="22"/><text class="t" x="150" y="155">D</text>
    <circle class="n" cx="240" cy="70" r="22"/><text class="t" x="240" y="75">E</text><text class="num" x="240" y="48">0</text>
    <circle class="n" cx="330" cy="110" r="22"/><text class="t" x="330" y="115">F</text><text class="num" x="330" y="88">1</text>
    <line class="erm" x1="172" y1="150" x2="308" y2="115"/>
    <line class="e" x1="262" y1="75" x2="308" y2="105"/>
    <text class="lab" x="0" y="200">결과 리스트: [ A, B, C, D ]</text>
  </g>

  <!-- Step 5/6: E, F -->
  <g transform="translate(460,520)">
    <text class="tb" x="0" y="15">5~6단계. E → F 순서로 마무리</text>
    <text class="lab" x="0" y="35">E→F 제거 → F:1→0, 마지막으로 F 꺼냄</text>
    <circle class="done" cx="60" cy="70" r="22"/><text class="t" x="60" y="75">A</text>
    <circle class="done" cx="60" cy="150" r="22"/><text class="t" x="60" y="155">B</text>
    <circle class="done" cx="150" cy="70" r="22"/><text class="t" x="150" y="75">C</text>
    <circle class="done" cx="150" cy="150" r="22"/><text class="t" x="150" y="155">D</text>
    <circle class="done" cx="240" cy="70" r="22"/><text class="t" x="240" y="75">E</text>
    <circle class="done" cx="330" cy="110" r="22"/><text class="t" x="330" y="115">F</text>
    <text class="lab" x="0" y="200">결과 리스트: [ A, B, C, D, E, F ] ✔</text>
    <text class="lab" x="0" y="220" fill="#c0392b">주의: B를 먼저 꺼내도, D를 C보다 먼저 꺼내도 모두 정답.</text>
  </g>
</svg>
