<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="system-ui,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
  </defs>
  <style>
    .cell{fill:#fff;stroke:#2c3e50;stroke-width:1.2}
    .hA{fill:#eaf2fb;stroke:#2457a7;stroke-width:1.2}
    .hB{fill:#fff2cc;stroke:#d4a017;stroke-width:1.2}
    .hC{fill:#d0f5d0;stroke:#27ae60;stroke-width:1.5}
    .blockA{fill:#eaf2fb;stroke:#2457a7;stroke-width:2}
    .blockB{fill:#fff2cc;stroke:#d4a017;stroke-width:2}
    .blockC{fill:#d0f5d0;stroke:#27ae60;stroke-width:2}
    .t{font-size:14px;text-anchor:middle;fill:#1e2a38}
    .m{font-size:13px;font-family:ui-monospace,Menlo,monospace;text-anchor:middle;fill:#1e2a38}
    .bl{font-size:14px;font-weight:bold;text-anchor:middle;fill:#1e2a38}
    .lab{font-size:13px;fill:#4a5b6c;text-anchor:middle}
    .tb{font-size:16px;font-weight:bold;text-anchor:middle;fill:#1e2a38}
    .th{font-size:14px;font-weight:bold;fill:#1e2a38}
    .mt{font-size:13px;font-family:ui-monospace,Menlo,monospace;fill:#1e2a38}
    .note{fill:#fff7d6;stroke:#b08a1f;stroke-width:1.5}
    .div{stroke:#c62828;stroke-width:2;fill:none;stroke-dasharray:6 3}
  </style>

  <text class="tb" x="600" y="30">행렬 곱셈: 2×2 표준 곱 → 4×4 블록 분할 재귀 (스트라센 전단계)</text>

  <!-- Part A: 2x2 standard multiplication -->
  <text class="th" x="60" y="70">① 2×2 표준 곱: C = A · B</text>

  <!-- Matrix A -->
  <g transform="translate(60,90)">
    <text class="bl" x="70" y="-5">A</text>
    <rect class="hA" x="0" y="0" width="70" height="70"/>
    <rect class="hA" x="70" y="0" width="70" height="70"/>
    <rect class="hA" x="0" y="70" width="70" height="70"/>
    <rect class="hA" x="70" y="70" width="70" height="70"/>
    <text class="t" x="35" y="40">a</text>
    <text class="t" x="105" y="40">b</text>
    <text class="t" x="35" y="110">c</text>
    <text class="t" x="105" y="110">d</text>
  </g>

  <text class="bl" x="230" y="165">×</text>

  <!-- Matrix B -->
  <g transform="translate(260,90)">
    <text class="bl" x="70" y="-5">B</text>
    <rect class="hB" x="0" y="0" width="70" height="70"/>
    <rect class="hB" x="70" y="0" width="70" height="70"/>
    <rect class="hB" x="0" y="70" width="70" height="70"/>
    <rect class="hB" x="70" y="70" width="70" height="70"/>
    <text class="t" x="35" y="40">e</text>
    <text class="t" x="105" y="40">f</text>
    <text class="t" x="35" y="110">g</text>
    <text class="t" x="105" y="110">h</text>
  </g>

  <text class="bl" x="430" y="165">=</text>

  <!-- Matrix C -->
  <g transform="translate(460,90)">
    <text class="bl" x="130" y="-5">C (결과)</text>
    <rect class="hC" x="0" y="0" width="130" height="70"/>
    <rect class="hC" x="130" y="0" width="130" height="70"/>
    <rect class="hC" x="0" y="70" width="130" height="70"/>
    <rect class="hC" x="130" y="70" width="130" height="70"/>
    <text class="m" x="65" y="40">a·e + b·g</text>
    <text class="m" x="195" y="40">a·f + b·h</text>
    <text class="m" x="65" y="110">c·e + d·g</text>
    <text class="m" x="195" y="110">c·f + d·h</text>
  </g>

  <g>
    <rect class="note" x="760" y="85" width="400" height="150" rx="8"/>
    <text class="th" x="775" y="110">연산 수</text>
    <text class="mt" x="775" y="135">곱셈: 8회   ·   덧셈: 4회</text>
    <text class="mt" x="775" y="160">C[i][j] = Σ_k A[i][k]·B[k][j]</text>
    <text class="mt" x="775" y="185">n×n 일반: 곱셈 n³회 → O(n³)</text>
    <text class="mt" x="775" y="215">→ 이 8회를 7회로 줄이는 게 스트라센</text>
  </g>

  <!-- Part B: 4x4 block decomposition -->
  <text class="th" x="60" y="290">② 4×4 행렬의 2×2 블록 분할 (재귀의 한 단계)</text>

  <!-- 4x4 A with block lines -->
  <g transform="translate(60,310)">
    <text class="bl" x="120" y="-5">A (4×4)</text>
    <!-- 16 cells 40x40 -->
    <g>
      <!-- row 0 -->
      <rect class="cell" x="0" y="0" width="40" height="40"/><text class="t" x="20" y="25">a₁₁</text>
      <rect class="cell" x="40" y="0" width="40" height="40"/><text class="t" x="60" y="25">a₁₂</text>
      <rect class="cell" x="80" y="0" width="40" height="40"/><text class="t" x="100" y="25">a₁₃</text>
      <rect class="cell" x="120" y="0" width="40" height="40"/><text class="t" x="140" y="25">a₁₄</text>
      <!-- row 1 -->
      <rect class="cell" x="0" y="40" width="40" height="40"/><text class="t" x="20" y="65">a₂₁</text>
      <rect class="cell" x="40" y="40" width="40" height="40"/><text class="t" x="60" y="65">a₂₂</text>
      <rect class="cell" x="80" y="40" width="40" height="40"/><text class="t" x="100" y="65">a₂₃</text>
      <rect class="cell" x="120" y="40" width="40" height="40"/><text class="t" x="140" y="65">a₂₄</text>
      <!-- row 2 -->
      <rect class="cell" x="0" y="80" width="40" height="40"/><text class="t" x="20" y="105">a₃₁</text>
      <rect class="cell" x="40" y="80" width="40" height="40"/><text class="t" x="60" y="105">a₃₂</text>
      <rect class="cell" x="80" y="80" width="40" height="40"/><text class="t" x="100" y="105">a₃₃</text>
      <rect class="cell" x="120" y="80" width="40" height="40"/><text class="t" x="140" y="105">a₃₄</text>
      <!-- row 3 -->
      <rect class="cell" x="0" y="120" width="40" height="40"/><text class="t" x="20" y="145">a₄₁</text>
      <rect class="cell" x="40" y="120" width="40" height="40"/><text class="t" x="60" y="145">a₄₂</text>
      <rect class="cell" x="80" y="120" width="40" height="40"/><text class="t" x="100" y="145">a₄₃</text>
      <rect class="cell" x="120" y="120" width="40" height="40"/><text class="t" x="140" y="145">a₄₄</text>
    </g>
    <!-- block divider -->
    <line class="div" x1="80" y1="0" x2="80" y2="160"/>
    <line class="div" x1="0" y1="80" x2="160" y2="80"/>
    <!-- block labels -->
    <text class="bl" x="40" y="-10" fill="#2457a7">A₁₁</text>
    <text class="bl" x="120" y="-10" fill="#2457a7">A₁₂</text>
    <text class="bl" x="-15" y="45" fill="#2457a7">A₂₁</text>
    <text class="bl" x="-15" y="125" fill="#2457a7">A₂₂</text>
  </g>

  <!-- Block multiplication view -->
  <g transform="translate(300,310)">
    <text class="bl" x="80" y="-5">블록 관점 (2×2 블록)</text>
    <!-- 2x2 blocks -->
    <rect class="blockA" x="0" y="10" width="80" height="80"/>
    <rect class="blockA" x="80" y="10" width="80" height="80"/>
    <rect class="blockA" x="0" y="90" width="80" height="80"/>
    <rect class="blockA" x="80" y="90" width="80" height="80"/>
    <text class="bl" x="40" y="55">A₁₁</text>
    <text class="bl" x="120" y="55">A₁₂</text>
    <text class="bl" x="40" y="135">A₂₁</text>
    <text class="bl" x="120" y="135">A₂₂</text>
    <text class="lab" x="80" y="200">각 블록은 2×2 행렬</text>
  </g>

  <!-- 블록 재귀 공식 -->
  <g transform="translate(550,310)">
    <text class="th" x="0" y="0">③ 블록 재귀 공식 (표준 8회 블록 곱)</text>
    <text class="mt" x="0" y="30">C₁₁ = A₁₁·B₁₁ + A₁₂·B₂₁</text>
    <text class="mt" x="0" y="55">C₁₂ = A₁₁·B₁₂ + A₁₂·B₂₂</text>
    <text class="mt" x="0" y="80">C₂₁ = A₂₁·B₁₁ + A₂₂·B₂₁</text>
    <text class="mt" x="0" y="105">C₂₂ = A₂₁·B₁₂ + A₂₂·B₂₂</text>
    <text class="mt" x="0" y="140">블록 곱셈: 8회 (각 n/2 × n/2)</text>
    <text class="mt" x="0" y="165">블록 덧셈: 4회 (n/2 × n/2)</text>
  </g>

  <!-- 복잡도 비교 -->
  <g>
    <rect class="note" x="40" y="540" width="1120" height="220" rx="8"/>
    <text class="tb" x="600" y="568" fill="#1e2a38">복잡도 비교: 표준 분할정복 vs 스트라센</text>
    <text class="mt" x="60" y="600">표준 분할정복:  T(n) = 8·T(n/2) + Θ(n²)   →  마스터 정리: a=8, b=2, d=2, b^d=4 &lt; 8 (case 3)</text>
    <text class="mt" x="60" y="625">           →  T(n) = Θ(n^log₂8) = Θ(n³)   (일반 곱셈과 동일, 이득 없음)</text>
    <text class="mt" x="60" y="662">스트라센:      T(n) = 7·T(n/2) + Θ(n²)   →  a=7, b=2, d=2, b^d=4 &lt; 7 (case 3)</text>
    <text class="mt" x="60" y="687">           →  T(n) = Θ(n^log₂7) ≈ Θ(n^2.807)   (7개 곱셈 M₁~M₇ + 18회 덧뺄셈)</text>
    <text class="mt" x="60" y="724">핵심: "분할 재귀"는 그 자체로 가속이 아니며, 부분 곱셈 수(a)를 8→7로 줄여야 실질 가속</text>
  </g>
</svg>
