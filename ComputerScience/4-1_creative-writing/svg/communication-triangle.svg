<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="system-ui,sans-serif">
  <style>
    .node{fill:#fff7d6;stroke:#d4a017;stroke-width:2}
    .cnt{fill:#eaf2fb;stroke:#2e86de;stroke-width:2}
    .ln{stroke:#333;stroke-width:2;fill:none;marker-end:url(#ar);marker-start:url(#ar0)}
    .tb{font-size:15px;font-weight:bold;text-anchor:middle}
    .lab{font-size:14px;text-anchor:middle;font-weight:bold}
    .desc{font-size:12px;text-anchor:middle}
    .box{fill:#fff;stroke:#555;stroke-width:1}
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="ar0" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto">
      <path d="M9,0 L9,6 L0,3 z" fill="#333"/>
    </marker>
  </defs>

  <text class="tb" x="430" y="24">의사소통: Producer ↔ Contents ↔ Customer</text>

  <!-- Producer -->
  <g transform="translate(80,120)">
    <ellipse class="node" cx="80" cy="50" rx="80" ry="50"/>
    <text class="lab" x="80" y="45">Producer</text>
    <text class="desc" x="80" y="65">생산자 · 필자</text>
    <text class="desc" x="80" y="82">(발신자)</text>
  </g>

  <!-- Contents (middle) -->
  <g transform="translate(350,120)">
    <rect class="cnt" x="0" y="10" width="160" height="90" rx="8"/>
    <text class="lab" x="80" y="40">Contents</text>
    <text class="desc" x="80" y="60">메시지 · 정보</text>
    <text class="desc" x="80" y="78">내용</text>
  </g>

  <!-- Customer -->
  <g transform="translate(620,120)">
    <ellipse class="node" cx="80" cy="50" rx="80" ry="50"/>
    <text class="lab" x="80" y="45">Customer</text>
    <text class="desc" x="80" y="65">수신자 · 독자</text>
    <text class="desc" x="80" y="82">(고객)</text>
  </g>

  <!-- Arrows -->
  <line class="ln" x1="240" y1="170" x2="350" y2="170"/>
  <line class="ln" x1="510" y1="170" x2="620" y2="170"/>

  <!-- 3 types below -->
  <g transform="translate(40,270)">
    <rect class="box" x="0" y="0" width="250" height="120"/>
    <text class="lab" x="125" y="25">① Nonverbal</text>
    <text class="desc" x="125" y="48">비언어적 의사소통</text>
    <text class="desc" x="125" y="68">표정 · 몸짓 · 자세 · 시선</text>
    <text class="desc" x="125" y="95" fill="#c0392b" font-weight="bold">55% (Mehrabian)</text>
  </g>

  <g transform="translate(305,270)">
    <rect class="box" x="0" y="0" width="250" height="120"/>
    <text class="lab" x="125" y="25">② Oral</text>
    <text class="desc" x="125" y="48">구두(말하기)</text>
    <text class="desc" x="125" y="68">대화 · 발표 · 프레젠테이션</text>
    <text class="desc" x="125" y="95" fill="#c0392b" font-weight="bold">38% (목소리 톤)</text>
  </g>

  <g transform="translate(570,270)">
    <rect class="box" x="0" y="0" width="250" height="120"/>
    <text class="lab" x="125" y="25">③ Written</text>
    <text class="desc" x="125" y="48">문서(글쓰기)</text>
    <text class="desc" x="125" y="68">보고서 · 이메일 · 논문</text>
    <text class="desc" x="125" y="95" fill="#c0392b" font-weight="bold">기록으로 남는다</text>
  </g>

  <text class="desc" x="430" y="75" font-weight="bold" fill="#c0392b">개인의 사회적 경쟁력 = 지식 × 의사소통능력</text>
</svg>
