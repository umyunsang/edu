<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="system-ui,sans-serif">
  <style>
    .node{fill:#fff7d6;stroke:#d4a017;stroke-width:2.5}
    .cnt{fill:#eaf2fb;stroke:#2e86de;stroke-width:2.5}
    .ln{stroke:#333;stroke-width:2;fill:none;marker-end:url(#ar);marker-start:url(#ar0)}
    .title{font-size:18px;font-weight:bold;text-anchor:middle}
    .lab{font-size:16px;text-anchor:middle;font-weight:bold}
    .desc{font-size:13px;text-anchor:middle}
    .box{fill:#fff;stroke:#555;stroke-width:1.5}
    .note{font-size:14px;text-anchor:middle;font-weight:bold}
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="ar0" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto">
      <path d="M9,0 L9,6 L0,3 z" fill="#333"/>
    </marker>
  </defs>

  <text class="title" x="550" y="40">의사소통: Producer ↔ Contents ↔ Customer</text>

  <!-- Producer -->
  <g>
    <ellipse class="node" cx="180" cy="180" rx="120" ry="70"/>
    <text class="lab" x="180" y="170">Producer</text>
    <text class="desc" x="180" y="195">생산자 · 필자</text>
    <text class="desc" x="180" y="215">(발신자)</text>
  </g>

  <!-- Contents -->
  <g>
    <rect class="cnt" x="430" y="110" width="240" height="140" rx="10"/>
    <text class="lab" x="550" y="155">Contents</text>
    <text class="desc" x="550" y="185">메시지 · 정보</text>
    <text class="desc" x="550" y="210">내용</text>
  </g>

  <!-- Customer -->
  <g>
    <ellipse class="node" cx="920" cy="180" rx="120" ry="70"/>
    <text class="lab" x="920" y="170">Customer</text>
    <text class="desc" x="920" y="195">수신자 · 독자</text>
    <text class="desc" x="920" y="215">(고객)</text>
  </g>

  <!-- Arrows between -->
  <line class="ln" x1="310" y1="180" x2="420" y2="180"/>
  <line class="ln" x1="680" y1="180" x2="790" y2="180"/>

  <!-- 3 types of communication -->
  <g>
    <rect class="box" x="60" y="320" width="300" height="180" rx="6"/>
    <text class="lab" x="210" y="355">① Nonverbal</text>
    <text class="desc" x="210" y="390">비언어적 의사소통</text>
    <text class="desc" x="210" y="420">표정 · 몸짓 · 자세 · 시선</text>
    <text class="desc" x="210" y="465" fill="#c0392b" font-weight="bold">55% (Mehrabian)</text>
  </g>

  <g>
    <rect class="box" x="400" y="320" width="300" height="180" rx="6"/>
    <text class="lab" x="550" y="355">② Oral</text>
    <text class="desc" x="550" y="390">구두 (말하기)</text>
    <text class="desc" x="550" y="420">대화 · 발표 · 프레젠테이션</text>
    <text class="desc" x="550" y="465" fill="#c0392b" font-weight="bold">38% (목소리 톤)</text>
  </g>

  <g>
    <rect class="box" x="740" y="320" width="300" height="180" rx="6"/>
    <text class="lab" x="890" y="355">③ Written</text>
    <text class="desc" x="890" y="390">문서 (글쓰기)</text>
    <text class="desc" x="890" y="420">보고서 · 이메일 · 논문</text>
    <text class="desc" x="890" y="465" fill="#c0392b" font-weight="bold">기록으로 남는다</text>
  </g>

  <!-- Bottom key -->
  <g>
    <rect x="60" y="560" width="980" height="80" fill="#fde2e2" stroke="#c0392b"/>
    <text class="note" x="550" y="595" fill="#c0392b">개인의 사회적 경쟁력 = 지식 × 의사소통능력</text>
    <text class="desc" x="550" y="620">글쓰기는 지식을 전달하는 가장 강력한 도구다</text>
  </g>
</svg>
