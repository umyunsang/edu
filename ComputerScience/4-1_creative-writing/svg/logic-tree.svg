<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="system-ui,sans-serif">
  <style>
    .root{fill:#2e86de;stroke:#1c5580;stroke-width:2}
    .l1{fill:#d0f5d0;stroke:#27ae60;stroke-width:2}
    .l2{fill:#fff;stroke:#8e44ad;stroke-width:2}
    .lab{font-size:13px;text-anchor:middle}
    .title{font-size:18px;font-weight:bold;text-anchor:middle}
    .wtxt{font-size:13px;font-weight:bold;text-anchor:middle;fill:#fff}
    .ln{stroke:#555;stroke-width:1.5;fill:none}
    .phase{font-size:14px;font-weight:bold;fill:#c0392b;text-anchor:middle}
    .mece{font-size:13px;font-weight:bold;fill:#c0392b;text-anchor:middle}
    .note{font-size:14px}
  </style>

  <text class="title" x="550" y="40">Logic Tree: MECE 기반 단계별 분해 작성법</text>

  <!-- Phase labels -->
  <text class="phase" x="180" y="80">시작점</text>
  <text class="phase" x="400" y="80">1차 전개</text>
  <text class="phase" x="620" y="80">2차 전개</text>
  <text class="phase" x="900" y="80">3차 전개</text>

  <!-- Root -->
  <rect class="root" x="100" y="260" width="160" height="80" rx="8"/>
  <text class="wtxt" x="180" y="295">주제 / 주장</text>
  <text class="wtxt" x="180" y="318">초기 질문</text>

  <!-- 1st phase -->
  <rect class="l1" x="330" y="130" width="140" height="60"/>
  <text class="lab" x="400" y="165" font-weight="bold">상위 덩이 A</text>
  <rect class="l1" x="330" y="410" width="140" height="60"/>
  <text class="lab" x="400" y="445" font-weight="bold">상위 덩이 B</text>

  <line class="ln" x1="260" y1="290" x2="330" y2="160"/>
  <line class="ln" x1="260" y1="310" x2="330" y2="440"/>

  <text class="mece" x="400" y="220">↑ MECE</text>
  <text class="mece" x="400" y="505">↑ MECE</text>

  <!-- 2nd phase -->
  <rect class="l1" x="550" y="100" width="140" height="50" opacity="0.8"/>
  <text class="lab" x="620" y="130">A - 1</text>
  <rect class="l1" x="550" y="170" width="140" height="50" opacity="0.8"/>
  <text class="lab" x="620" y="200">A - 2</text>
  <rect class="l1" x="550" y="380" width="140" height="50" opacity="0.8"/>
  <text class="lab" x="620" y="410">B - 1</text>
  <rect class="l1" x="550" y="450" width="140" height="50" opacity="0.8"/>
  <text class="lab" x="620" y="480">B - 2</text>

  <line class="ln" x1="470" y1="150" x2="550" y2="120"/>
  <line class="ln" x1="470" y1="170" x2="550" y2="195"/>
  <line class="ln" x1="470" y1="430" x2="550" y2="400"/>
  <line class="ln" x1="470" y1="450" x2="550" y2="475"/>

  <!-- 3rd phase -->
  <rect class="l2" x="790" y="100" width="130" height="35"/>
  <text class="lab" x="855" y="123">A-1-a</text>
  <rect class="l2" x="930" y="100" width="130" height="35"/>
  <text class="lab" x="995" y="123">A-1-b</text>

  <rect class="l2" x="790" y="170" width="130" height="35"/>
  <text class="lab" x="855" y="193">A-2-a</text>
  <rect class="l2" x="930" y="170" width="130" height="35"/>
  <text class="lab" x="995" y="193">A-2-b</text>

  <rect class="l2" x="790" y="380" width="130" height="35"/>
  <text class="lab" x="855" y="403">B-1-a</text>
  <rect class="l2" x="930" y="380" width="130" height="35"/>
  <text class="lab" x="995" y="403">B-1-b</text>

  <rect class="l2" x="790" y="450" width="130" height="35"/>
  <text class="lab" x="855" y="473">B-2-a</text>
  <rect class="l2" x="930" y="450" width="130" height="35"/>
  <text class="lab" x="995" y="473">B-2-b</text>

  <line class="ln" x1="690" y1="120" x2="790" y2="118"/>
  <line class="ln" x1="690" y1="128" x2="930" y2="118"/>
  <line class="ln" x1="690" y1="195" x2="790" y2="188"/>
  <line class="ln" x1="690" y1="200" x2="930" y2="188"/>

  <line class="ln" x1="690" y1="400" x2="790" y2="398"/>
  <line class="ln" x1="690" y1="408" x2="930" y2="398"/>
  <line class="ln" x1="690" y1="470" x2="790" y2="468"/>
  <line class="ln" x1="690" y1="478" x2="930" y2="468"/>

  <!-- Bottom -->
  <g>
    <rect x="60" y="550" width="980" height="80" fill="#fff7d6" stroke="#d4a017"/>
    <text class="note" x="80" y="585" fill="#c0392b" font-weight="bold">매 단계 분기마다 MECE (중복 없이 · 누락 없이) 적용</text>
    <text class="note" x="80" y="612">논리가 새지 않는다. 한 노드당 4~7개 이내의 가지만 두는 게 좋다.</text>
  </g>
</svg>
