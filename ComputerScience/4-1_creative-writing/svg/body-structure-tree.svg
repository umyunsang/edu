<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui,sans-serif">
  <style>
    .root{fill:#2c3e50;stroke:#1c2833;stroke-width:2}
    .l1{fill:#e67e22;stroke:#d35400;stroke-width:2}
    .l2{fill:#2e86de;stroke:#2471a3;stroke-width:2}
    .l3{fill:#27ae60;stroke:#1e8449;stroke-width:2}
    .l4{fill:#8e44ad;stroke:#6c3483;stroke-width:2}
    .leaf{fill:#fff;stroke:#555}
    .wtxt{fill:#fff;font-size:12px;font-weight:bold;text-anchor:middle}
    .lab{fill:#333;font-size:12px;text-anchor:middle}
    .tb{font-size:15px;font-weight:bold;text-anchor:middle}
    .ln{stroke:#333;stroke-width:1.5;fill:none}
  </style>

  <text class="tb" x="450" y="24">Organization — 본문의 구조 (전체 분류도)</text>

  <!-- Root -->
  <rect class="root" x="390" y="40" width="120" height="36"/>
  <text class="wtxt" x="450" y="62">본문의 구조</text>

  <!-- Level 1: natural vs logical -->
  <rect class="l1" x="190" y="110" width="140" height="36"/>
  <text class="wtxt" x="260" y="132">자연적 전개</text>

  <rect class="l1" x="570" y="110" width="140" height="36"/>
  <text class="wtxt" x="640" y="132">논리적 전개</text>

  <line class="ln" x1="450" y1="76" x2="260" y2="110"/>
  <line class="ln" x1="450" y1="76" x2="640" y2="110"/>

  <!-- Natural branches -->
  <rect class="l2" x="130" y="180" width="100" height="32"/>
  <text class="wtxt" x="180" y="200">시간적</text>
  <rect class="l2" x="260" y="180" width="100" height="32"/>
  <text class="wtxt" x="310" y="200">공간적</text>
  <line class="ln" x1="260" y1="146" x2="180" y2="180"/>
  <line class="ln" x1="260" y1="146" x2="310" y2="180"/>

  <!-- Logical branches -->
  <rect class="l2" x="470" y="180" width="100" height="32"/>
  <text class="wtxt" x="520" y="200">수직적</text>
  <rect class="l2" x="700" y="180" width="100" height="32"/>
  <text class="wtxt" x="750" y="200">수평적</text>
  <line class="ln" x1="640" y1="146" x2="520" y2="180"/>
  <line class="ln" x1="640" y1="146" x2="750" y2="180"/>

  <!-- Vertical: 점층법 / 인과법 -->
  <rect class="l3" x="400" y="250" width="90" height="30"/>
  <text class="wtxt" x="445" y="270">점층법</text>
  <rect class="l3" x="510" y="250" width="90" height="30"/>
  <text class="wtxt" x="555" y="270">인과법</text>
  <line class="ln" x1="520" y1="212" x2="445" y2="250"/>
  <line class="ln" x1="520" y1="212" x2="555" y2="250"/>

  <!-- Horizontal: 대비법 / 열거법 -->
  <rect class="l3" x="660" y="250" width="90" height="30"/>
  <text class="wtxt" x="705" y="270">대비법</text>
  <rect class="l3" x="770" y="250" width="90" height="30"/>
  <text class="wtxt" x="815" y="270">열거법</text>
  <line class="ln" x1="750" y1="212" x2="705" y2="250"/>
  <line class="ln" x1="750" y1="212" x2="815" y2="250"/>

  <!-- 대비법: 반박 / 절충 -->
  <rect class="l4" x="640" y="310" width="60" height="28"/>
  <text class="wtxt" x="670" y="328">반박</text>
  <rect class="l4" x="710" y="310" width="60" height="28"/>
  <text class="wtxt" x="740" y="328">절충</text>
  <line class="ln" x1="705" y1="280" x2="670" y2="310"/>
  <line class="ln" x1="705" y1="280" x2="740" y2="310"/>

  <!-- Inductive / Deductive under 인과법 -->
  <rect class="l4" x="470" y="310" width="60" height="28"/>
  <text class="wtxt" x="500" y="328">귀납법</text>
  <rect class="l4" x="535" y="310" width="60" height="28"/>
  <text class="wtxt" x="565" y="328">연역법</text>
  <rect class="l4" x="600" y="310" width="60" height="28"/>
  <text class="wtxt" x="630" y="328">흐름도</text>
  <line class="ln" x1="555" y1="280" x2="500" y2="310"/>
  <line class="ln" x1="555" y1="280" x2="565" y2="310"/>
  <line class="ln" x1="555" y1="280" x2="630" y2="310"/>

  <!-- Under 흐름도 -->
  <rect class="leaf" x="580" y="360" width="60" height="26"/>
  <text class="lab" x="610" y="377">논리나무</text>
  <rect class="leaf" x="650" y="360" width="60" height="26"/>
  <text class="lab" x="680" y="377">가계도</text>
  <line class="ln" x1="630" y1="338" x2="610" y2="360"/>
  <line class="ln" x1="630" y1="338" x2="680" y2="360"/>

  <!-- Legend bottom -->
  <g transform="translate(30,400)">
    <rect x="0" y="0" width="360" height="55" fill="#fff7d6" stroke="#d4a017"/>
    <text class="tb" x="15" y="20" text-anchor="start">자연적 전개: 사건사슬(chain of events)</text>
    <text class="lab" x="15" y="40" text-anchor="start">수직=시간 · 수평=공간 / 역사기록, 기행문, 매뉴얼</text>
  </g>
  <g transform="translate(410,400)">
    <rect x="0" y="0" width="470" height="55" fill="#fde2e2" stroke="#c0392b"/>
    <text class="tb" x="15" y="20" text-anchor="start">논리적 전개: 수직(주종) + 수평(동등) + MECE</text>
    <text class="lab" x="15" y="40" text-anchor="start" fill="#c0392b">힘 글(Hi Five) · 경고문 · 사건기사 · 보고문 = 수직+결과 앞</text>
  </g>
</svg>
