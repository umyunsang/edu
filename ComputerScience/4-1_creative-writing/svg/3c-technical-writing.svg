<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" font-family="system-ui,sans-serif">
  <style>
    .c1{fill:#fde2e2;stroke:#c0392b;stroke-width:2.5}
    .c2{fill:#eaf2fb;stroke:#2e86de;stroke-width:2.5}
    .c3{fill:#d0f5d0;stroke:#27ae60;stroke-width:2.5}
    .tb{font-size:15px;font-weight:bold;text-anchor:middle}
    .letter{font-size:38px;font-weight:bold;text-anchor:middle}
    .word{font-size:18px;font-weight:bold;text-anchor:middle}
    .lab{font-size:13px;text-anchor:middle}
    .box{fill:#fff7d6;stroke:#d4a017}
  </style>

  <text class="tb" x="420" y="24">Technical Writing 3C 원칙</text>

  <!-- Venn-like: three overlapping circles -->
  <g transform="translate(420,180)">
    <circle class="c1" cx="-110" cy="-30" r="120" opacity="0.75"/>
    <circle class="c2" cx="110" cy="-30" r="120" opacity="0.75"/>
    <circle class="c3" cx="0" cy="80" r="120" opacity="0.75"/>

    <text class="letter" x="-140" y="-50" fill="#c0392b">C</text>
    <text class="word" x="-140" y="-20">Correct</text>
    <text class="lab" x="-140" y="0">정확하게</text>
    <text class="lab" x="-140" y="15">사실·수치·문법</text>

    <text class="letter" x="140" y="-50" fill="#2e86de">C</text>
    <text class="word" x="140" y="-20">Concise</text>
    <text class="lab" x="140" y="0">간결하게</text>
    <text class="lab" x="140" y="15">군더더기 제거</text>

    <text class="letter" x="0" y="90" fill="#27ae60">C</text>
    <text class="word" x="0" y="120">Clear</text>
    <text class="lab" x="0" y="140">명료하게</text>
    <text class="lab" x="0" y="155">독자가 이해하게</text>
  </g>

  <g transform="translate(40,400)">
    <rect class="box" x="0" y="0" width="760" height="40"/>
    <text class="lab" x="15" y="25" text-anchor="start" font-weight="bold">핵심 암기: <tspan fill="#c0392b">"Correct · Concise · Clear"</tspan> — 공학도 글쓰기의 세 축. 어려운 내용을 쉽게 쓰는 사람이 이상</text>
  </g>
</svg>
