<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="system-ui,sans-serif">
  <style>
    .v{fill:#e74c3c;stroke:#c0392b;stroke-width:2}
    .h{fill:#3498db;stroke:#2e86de;stroke-width:2}
    .wtxt{fill:#fff;font-size:13px;font-weight:bold;text-anchor:middle}
    .title{font-size:18px;font-weight:bold;text-anchor:middle}
    .sub{font-size:15px;font-weight:bold;text-anchor:middle}
    .lab{font-size:13px;text-anchor:middle}
    .note{font-size:13px}
    .ln{stroke:#333;stroke-width:1.5;fill:none}
  </style>

  <text class="title" x="550" y="40">덩이지기 (Clustering) — 두 방향의 전개</text>

  <!-- Left: vertical -->
  <g transform="translate(60,90)">
    <rect x="0" y="0" width="440" height="420" fill="#fff" stroke="#c0392b" stroke-width="1.5" rx="8"/>
    <text class="sub" x="220" y="30" fill="#c0392b">수직적 전개 · 주종관계</text>

    <rect class="v" x="170" y="60" width="100" height="40"/>
    <text class="wtxt" x="220" y="85">주제 (主)</text>

    <line class="ln" x1="220" y1="100" x2="220" y2="140"/>

    <rect class="v" x="90" y="140" width="100" height="40" opacity="0.85"/>
    <text class="wtxt" x="140" y="165">근거 A</text>
    <rect class="v" x="250" y="140" width="100" height="40" opacity="0.85"/>
    <text class="wtxt" x="300" y="165">근거 B</text>

    <line class="ln" x1="140" y1="180" x2="140" y2="220"/>
    <line class="ln" x1="300" y1="180" x2="300" y2="220"/>

    <rect class="v" x="90" y="220" width="100" height="40" opacity="0.65"/>
    <text class="wtxt" x="140" y="245">증명 a</text>
    <rect class="v" x="250" y="220" width="100" height="40" opacity="0.65"/>
    <text class="wtxt" x="300" y="245">증명 b</text>

    <text class="lab" x="220" y="300" font-weight="bold">從(종) — 主를 뒷받침</text>
    <text class="lab" x="220" y="330">아래로 갈수록 구체화</text>
    <text class="lab" x="220" y="360">단계적으로 심화</text>
    <text class="lab" x="220" y="395" fill="#c0392b" font-weight="bold">비약 없이 차근차근</text>
  </g>

  <!-- Right: horizontal -->
  <g transform="translate(600,90)">
    <rect x="0" y="0" width="440" height="420" fill="#fff" stroke="#2e86de" stroke-width="1.5" rx="8"/>
    <text class="sub" x="220" y="30" fill="#2e86de">수평적 전개 · 동적 관계</text>

    <rect class="h" x="170" y="60" width="100" height="40"/>
    <text class="wtxt" x="220" y="85">주제</text>

    <line class="ln" x1="220" y1="100" x2="220" y2="140"/>
    <line class="ln" x1="70" y1="140" x2="370" y2="140"/>

    <rect class="h" x="30" y="140" width="80" height="40" opacity="0.85"/>
    <text class="wtxt" x="70" y="165">덩이 1</text>
    <rect class="h" x="130" y="140" width="80" height="40" opacity="0.85"/>
    <text class="wtxt" x="170" y="165">덩이 2</text>
    <rect class="h" x="230" y="140" width="80" height="40" opacity="0.85"/>
    <text class="wtxt" x="270" y="165">덩이 3</text>
    <rect class="h" x="330" y="140" width="80" height="40" opacity="0.85"/>
    <text class="wtxt" x="370" y="165">덩이 4</text>

    <line class="ln" x1="70" y1="140" x2="70" y2="140"/>

    <text class="lab" x="220" y="240" font-weight="bold">같은 레벨을 옆으로 나열</text>
    <text class="lab" x="220" y="270">대비법 (2개)</text>
    <text class="lab" x="220" y="295">열거법 (다수)</text>
    <text class="lab" x="220" y="345" fill="#c0392b" font-weight="bold">MECE로 균형 점검</text>
    <text class="lab" x="220" y="375">중복 없이 · 누락 없이</text>
  </g>

  <!-- Bottom: principles -->
  <g>
    <rect x="60" y="550" width="980" height="200" fill="#fff7d6" stroke="#d4a017"/>
    <text class="sub" x="80" y="585" text-anchor="start">덩이지기 원리 — 인지심리학 기반</text>
    <text class="note" x="80" y="620">• 인간 뇌는 한꺼번에 <tspan font-weight="bold" fill="#c0392b">최대 7개</tspan>의 정보만 처리 가능 (Miller's Magic Number)</text>
    <text class="note" x="80" y="650">• 비슷한 것끼리 덩이로 묶어 상위 개념화 → 기억과 이해가 쉬워진다</text>
    <text class="note" x="80" y="680">• 발상모으기(Brainstorming) → Mind Map → 조직도(Organization chart)</text>
    <text class="note" x="80" y="720" fill="#c0392b" font-weight="bold">"청킹(Chunking)" · "조직화" · "체계화"가 글의 힘을 만든다</text>
  </g>
</svg>
