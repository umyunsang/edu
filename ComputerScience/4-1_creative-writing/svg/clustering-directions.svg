<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="system-ui,sans-serif">
  <style>
    .v{fill:#e74c3c;stroke:#c0392b;stroke-width:2}
    .h{fill:#3498db;stroke:#2e86de;stroke-width:2}
    .wtxt{fill:#fff;font-size:13px;font-weight:bold;text-anchor:middle}
    .tb{font-size:15px;font-weight:bold;text-anchor:middle}
    .lab{font-size:13px;text-anchor:middle}
    .ln{stroke:#333;stroke-width:1.5;fill:none}
  </style>

  <text class="tb" x="440" y="24">덩이지기 (Clustering) — 두 방향의 전개</text>

  <!-- Vertical (수직적): 주종관계 -->
  <g transform="translate(60,60)">
    <text class="tb" x="150" y="0" fill="#c0392b">수직적 전개 · 주종관계</text>

    <rect class="v" x="110" y="20" width="80" height="35"/>
    <text class="wtxt" x="150" y="43">주제 (主)</text>

    <line class="ln" x1="150" y1="55" x2="150" y2="85"/>

    <rect class="v" x="50" y="85" width="80" height="35" opacity="0.8"/>
    <text class="wtxt" x="90" y="108">근거 A</text>
    <rect class="v" x="170" y="85" width="80" height="35" opacity="0.8"/>
    <text class="wtxt" x="210" y="108">근거 B</text>

    <line class="ln" x1="90" y1="120" x2="90" y2="150"/>
    <line class="ln" x1="210" y1="120" x2="210" y2="150"/>

    <rect class="v" x="50" y="150" width="80" height="35" opacity="0.6"/>
    <text class="wtxt" x="90" y="173">증명 a</text>
    <rect class="v" x="170" y="150" width="80" height="35" opacity="0.6"/>
    <text class="wtxt" x="210" y="173">증명 b</text>

    <text class="lab" x="150" y="220" font-weight="bold">從(종) — 主를 뒷받침</text>
    <text class="lab" x="150" y="240">아래로 갈수록 구체화·세부화</text>
    <text class="lab" x="150" y="260" fill="#c0392b">비약 없이 단계적으로 심화</text>
  </g>

  <!-- Horizontal (수평적): 동적관계 -->
  <g transform="translate(500,60)">
    <text class="tb" x="170" y="0" fill="#2e86de">수평적 전개 · 동적(同的) 관계</text>

    <rect class="h" x="130" y="20" width="80" height="35"/>
    <text class="wtxt" x="170" y="43">주제</text>

    <line class="ln" x1="170" y1="55" x2="170" y2="80"/>

    <rect class="h" x="10" y="90" width="80" height="35" opacity="0.8"/>
    <text class="wtxt" x="50" y="113">덩이 1</text>
    <rect class="h" x="100" y="90" width="80" height="35" opacity="0.8"/>
    <text class="wtxt" x="140" y="113">덩이 2</text>
    <rect class="h" x="190" y="90" width="80" height="35" opacity="0.8"/>
    <text class="wtxt" x="230" y="113">덩이 3</text>
    <rect class="h" x="280" y="90" width="80" height="35" opacity="0.8"/>
    <text class="wtxt" x="320" y="113">덩이 4</text>

    <line class="ln" x1="50" y1="80" x2="50" y2="90"/>
    <line class="ln" x1="140" y1="80" x2="140" y2="90"/>
    <line class="ln" x1="230" y1="80" x2="230" y2="90"/>
    <line class="ln" x1="320" y1="80" x2="320" y2="90"/>
    <line class="ln" x1="50" y1="80" x2="320" y2="80"/>

    <text class="lab" x="170" y="160" font-weight="bold">같은 레벨(level)의 덩이를 옆으로 나열</text>
    <text class="lab" x="170" y="180">대비법(2개) · 열거법(다수)</text>
    <text class="lab" x="170" y="220" fill="#c0392b" font-weight="bold">MECE로 균형 · 중복 · 누락 점검!</text>
  </g>

  <!-- Bottom: clustering principles -->
  <g transform="translate(40,400)">
    <rect x="0" y="0" width="800" height="140" fill="#fff7d6" stroke="#d4a017"/>
    <text class="tb" x="15" y="22" text-anchor="start">덩이지기 원리 — 인지심리학 기반</text>
    <text class="lab" x="15" y="45" text-anchor="start">• 인간 뇌는 한꺼번에 <tspan font-weight="bold" fill="#c0392b">최대 7개</tspan>의 정보만 처리 가능 (Miller's Magic Number)</text>
    <text class="lab" x="15" y="65" text-anchor="start">• 비슷한 것끼리 덩이로 묶어 상위 개념화 → 기억·이해가 쉬워짐</text>
    <text class="lab" x="15" y="85" text-anchor="start">• 발상모으기(Brainstorming) → Mind Map → 조직도(Organization chart)</text>
    <text class="lab" x="15" y="110" text-anchor="start" fill="#c0392b" font-weight="bold">"청킹(Chunking)" · "조직화(Organization)" · "체계화"가 글의 힘을 만든다</text>
  </g>
</svg>
