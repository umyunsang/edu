<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="system-ui,sans-serif">
  <style>
    .top{fill:#c0392b;stroke:#922b21;stroke-width:2}
    .mid{fill:#2e86de;stroke:#1c5580;stroke-width:2}
    .bot{fill:#27ae60;stroke:#1e8449;stroke-width:2}
    .wtxt{fill:#fff;font-weight:bold;font-size:15px;text-anchor:middle}
    .tb{font-size:15px;font-weight:bold;text-anchor:middle}
    .lab{font-size:13px}
    .box{fill:#fff7d6;stroke:#d4a017}
  </style>

  <text class="tb" x="450" y="24">4가지 의사소통자 유형 — 조직 계층별 글쓰기</text>

  <!-- Pyramid -->
  <g transform="translate(40,60)">
    <polygon class="top" points="180,30 110,90 250,90"/>
    <text class="wtxt" x="180" y="75">최고경영자</text>

    <polygon class="mid" points="110,90 50,160 310,160 250,90"/>
    <text class="wtxt" x="180" y="135">중간관리자</text>

    <polygon class="bot" points="50,160 0,230 360,230 310,160"/>
    <text class="wtxt" x="180" y="200">실무자</text>
  </g>

  <!-- Explanation -->
  <g transform="translate(420,60)">
    <rect class="box" x="0" y="0" width="440" height="60"/>
    <text class="lab" x="15" y="22" font-weight="bold" fill="#c0392b">최고경영자 · Persuasive (설득형)</text>
    <text class="lab" x="15" y="42">비전 · 전략 · 투자 결정을 설득. Why 형식 · PREP</text>

    <rect class="box" x="0" y="70" width="440" height="60"/>
    <text class="lab" x="15" y="92" font-weight="bold" fill="#2e86de">중간관리자 · Explanatory (설명형)</text>
    <text class="lab" x="15" y="112">상·하 연결. 분석 · 해석 · 대안 제시. How 형식 중심</text>

    <rect class="box" x="0" y="140" width="440" height="60"/>
    <text class="lab" x="15" y="162" font-weight="bold" fill="#27ae60">실무자 · Informational (정보형)</text>
    <text class="lab" x="15" y="182">사실·수치·일정 보고. 일일 보고서 · 기술 매뉴얼</text>
  </g>

  <!-- Bottom insight -->
  <g transform="translate(30,320)">
    <rect x="0" y="0" width="840" height="110" fill="#fde2e2" stroke="#c0392b"/>
    <text class="tb" x="15" y="22" text-anchor="start">역할별 문서 예시 — 시험 단골</text>
    <text class="lab" x="15" y="45">• 보고서1(시간 순차성): 언제·무엇을 했는가 — 실무자 일일 보고</text>
    <text class="lab" x="15" y="65">• 보고서3(해결책/원인/결과): 문제-원인-해결책 3단계 — 중간관리자 분석 보고</text>
    <text class="lab" x="15" y="85">• 한 장 보고서(레이건·처칠 PREP): 결론부터 제시 — 경영자용 설득 문서</text>
    <text class="lab" x="15" y="102" fill="#c0392b" font-weight="bold">핵심: 읽는 사람의 계층에 따라 형식·분량·구조가 달라진다.</text>
  </g>
</svg>
