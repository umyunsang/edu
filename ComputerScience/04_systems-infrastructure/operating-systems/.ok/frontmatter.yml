title: "운영체제"
description: "프로세스·스레드·스케줄링·동기화·메모리·파일시스템. 스케줄러 구현 과제 포함. 학기: 2-2. 원본 강의자료는 `pdf/` 에 있고, 그것을 근거로 쓴 정리문서가 이 폴더 루트에 있다. 정리문서를 새로 쓰거나 다시 쓸 때는 `.agents/skills/lecture-pdf-to-note` 스킬을 따른다."
