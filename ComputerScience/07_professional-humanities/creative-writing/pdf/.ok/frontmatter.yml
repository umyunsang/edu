# 이 파일은 OpenKnowledge가 에이전트에게 폴더의 의미를 알려주는 가이드다.
# 사람은 Obsidian 폴더 트리를 보고, LLM은 이 설명을 본다.
# scripts/generate_folder_guides.py 로 생성됨 — 손으로 고쳐도 되지만 스크립트도 같이 갱신할 것.
title: "창의적 글쓰기 — 원본 강의자료"
description: "이 폴더의 PDF는 **교수가 배포한 원본 강의자료**다 (Git LFS로 관리). 직접 읽지 말고 `scripts/pdf_lecture_extract.py` 로 추출 번들을 만든 뒤 그것을 근거로 삼는다. 정리문서는 이 폴더가 아니라 **상위 수업 폴더 루트**에 만든다. 파일명이 ` 2.pdf` 로 끝나는 것은 macOS 중복 사본이므로 무시한다."
