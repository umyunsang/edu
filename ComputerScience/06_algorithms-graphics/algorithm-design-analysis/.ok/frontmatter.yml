title: "알고리즘 설계와 분석"
description: "복잡도 분석, 억지기법·완전탐색, 축소정복, 분할정복, 공간으로 시간 벌기, 동적계획법, 탐욕적 기법, 백트래킹·분기한정, NP완전과 근사 알고리즘. Pop Quiz 풀이 포함. 학기: 4-1. 원본 강의자료는 `pdf/` 에 있고, 그것을 근거로 쓴 정리문서가 이 폴더 루트에 있다. 정리문서를 새로 쓰거나 다시 쓸 때는 `.agents/skills/lecture-pdf-to-note` 스킬을 따른다."
