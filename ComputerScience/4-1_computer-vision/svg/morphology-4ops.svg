<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="system-ui,sans-serif">
  <style>
    .bg{fill:#f8f8f8;stroke:#bbb}
    .obj{fill:#2c3e50}
    .gone{fill:#2c3e50;opacity:0.3}
    .grown{fill:#2c3e50;opacity:0.7}
    .noise{fill:#c0392b}
    .hole{fill:#fff;stroke:#2c3e50}
    .t{font-size:13px;text-anchor:middle}
    .tb{font-size:15px;font-weight:bold}
    .lab{font-size:13px}
    .arrow{stroke:#666;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#666"/></marker>
  </defs>
  <text class="tb" x="430" y="22" text-anchor="middle">모폴로지 4연산: 팽창, 침식, 열림, 닫힘 — 이진 영상 모양 다듬기</text>

  <!-- 팽창 Dilation -->
  <g transform="translate(30,50)">
    <text class="tb" x="110" y="15" text-anchor="middle">팽창 (Dilation) — 살 찌우기</text>

    <text class="lab" x="40" y="45" text-anchor="middle">전</text>
    <g transform="translate(10,55)">
      <rect class="bg" x="0" y="0" width="60" height="60"/>
      <rect class="obj" x="15" y="15" width="30" height="30"/>
    </g>

    <text class="tb" x="110" y="90">→</text>

    <text class="lab" x="180" y="45" text-anchor="middle">후</text>
    <g transform="translate(150,55)">
      <rect class="bg" x="0" y="0" width="60" height="60"/>
      <rect class="grown" x="8" y="8" width="44" height="44"/>
      <rect class="obj" x="15" y="15" width="30" height="30"/>
    </g>

    <text class="lab" x="10" y="150">효과:</text>
    <text class="lab" x="10" y="170">• 흰 영역을 키워 끊긴 부분 연결</text>
    <text class="lab" x="10" y="188">• 작은 구멍 메우기</text>
  </g>

  <!-- 침식 Erosion -->
  <g transform="translate(260,50)">
    <text class="tb" x="110" y="15" text-anchor="middle">침식 (Erosion) — 살 깎기</text>

    <text class="lab" x="40" y="45" text-anchor="middle">전</text>
    <g transform="translate(10,55)">
      <rect class="bg" x="0" y="0" width="60" height="60"/>
      <rect class="obj" x="15" y="15" width="30" height="30"/>
      <rect class="noise" x="50" y="5" width="6" height="6"/>
    </g>

    <text class="tb" x="110" y="90">→</text>

    <text class="lab" x="180" y="45" text-anchor="middle">후</text>
    <g transform="translate(150,55)">
      <rect class="bg" x="0" y="0" width="60" height="60"/>
      <rect class="obj" x="20" y="20" width="20" height="20"/>
    </g>

    <text class="lab" x="10" y="150">효과:</text>
    <text class="lab" x="10" y="170">• 흰 영역 축소 → 튀어나온 점 제거</text>
    <text class="lab" x="10" y="188">• 작은 잡음 제거</text>
  </g>

  <!-- 열림 Opening = 침식 → 팽창 -->
  <g transform="translate(490,50)">
    <text class="tb" x="160" y="15" text-anchor="middle">열림 (Opening) = 침식 → 팽창</text>

    <g transform="translate(0,30)">
      <text class="lab" x="40" y="20" text-anchor="middle">입력</text>
      <rect class="bg" x="10" y="30" width="60" height="60"/>
      <rect class="obj" x="25" y="45" width="30" height="30"/>
      <rect class="noise" x="65" y="32" width="4" height="4"/>
      <rect class="noise" x="13" y="85" width="5" height="4"/>
    </g>

    <line class="arrow" x1="85" y1="75" x2="115" y2="75"/>

    <g transform="translate(125,30)">
      <text class="lab" x="40" y="20" text-anchor="middle">침식 후</text>
      <rect class="bg" x="10" y="30" width="60" height="60"/>
      <rect class="obj" x="30" y="50" width="20" height="20"/>
    </g>

    <line class="arrow" x1="200" y1="75" x2="230" y2="75"/>

    <g transform="translate(240,30)">
      <text class="lab" x="40" y="20" text-anchor="middle">팽창 후</text>
      <rect class="bg" x="10" y="30" width="60" height="60"/>
      <rect class="obj" x="25" y="45" width="30" height="30"/>
    </g>

    <text class="lab" x="10" y="150">효과: ==작은 밝은 잡음(빨간 점)을 제거==하고, 크기는 대체로 보존.</text>
    <text class="lab" x="10" y="168" fill="#c0392b">암기: "먼저 깎아내므로 점 같은 잡티가 사라진다."</text>
  </g>

  <!-- 닫힘 Closing = 팽창 → 침식 -->
  <g transform="translate(30,280)">
    <text class="tb" x="160" y="15" text-anchor="middle">닫힘 (Closing) = 팽창 → 침식</text>

    <g transform="translate(0,30)">
      <text class="lab" x="40" y="20" text-anchor="middle">입력 (구멍 있음)</text>
      <rect class="bg" x="10" y="30" width="60" height="60"/>
      <rect class="obj" x="20" y="40" width="40" height="40"/>
      <rect class="hole" x="35" y="50" width="8" height="8"/>
      <rect class="hole" x="45" y="58" width="6" height="6"/>
    </g>

    <line class="arrow" x1="85" y1="75" x2="115" y2="75"/>

    <g transform="translate(125,30)">
      <text class="lab" x="40" y="20" text-anchor="middle">팽창 후</text>
      <rect class="bg" x="10" y="30" width="60" height="60"/>
      <rect class="obj" x="15" y="35" width="50" height="50"/>
    </g>

    <line class="arrow" x1="200" y1="75" x2="230" y2="75"/>

    <g transform="translate(240,30)">
      <text class="lab" x="40" y="20" text-anchor="middle">침식 후</text>
      <rect class="bg" x="10" y="30" width="60" height="60"/>
      <rect class="obj" x="20" y="40" width="40" height="40"/>
    </g>

    <text class="lab" x="10" y="150">효과: ==작은 구멍을 메우고== 크기는 거의 유지.</text>
    <text class="lab" x="10" y="168" fill="#c0392b">암기: "먼저 부풀려 틈을 막은 뒤 되돌린다."</text>
  </g>

  <!-- Summary table -->
  <g transform="translate(490,300)">
    <rect x="0" y="0" width="340" height="200" fill="#fff7d6" stroke="#d4a017"/>
    <text class="tb" x="15" y="22">요약표</text>
    <text class="lab" x="15" y="48" font-weight="bold">팽창(⊕):</text>
    <text class="lab" x="100" y="48">흰 영역 키움 — 연결·메우기</text>
    <text class="lab" x="15" y="70" font-weight="bold">침식(⊖):</text>
    <text class="lab" x="100" y="70">흰 영역 깎음 — 잡음·돌기 제거</text>
    <text class="lab" x="15" y="92" font-weight="bold">열림(∘):</text>
    <text class="lab" x="100" y="92">침식→팽창 — ★작은 밝은 잡음 제거</text>
    <text class="lab" x="15" y="114" font-weight="bold">닫힘(•):</text>
    <text class="lab" x="100" y="114">팽창→침식 — ★작은 어두운 구멍 메움</text>
    <text class="lab" x="15" y="150" fill="#c0392b" font-weight="bold">기억법:</text>
    <text class="lab" x="15" y="170">열림은 "깎고 복구" → 튀어나온 것 제거</text>
    <text class="lab" x="15" y="188">닫힘은 "부풀려 복구" → 움푹 들어간 것 제거</text>
  </g>

  <g transform="translate(30,520)">
    <text class="lab" x="0" y="0" fill="#c0392b" font-weight="bold">순서가 핵심: 반대로 하면 결과가 달라진다. 실습의 cv2.morphologyEx(MORPH_OPEN/CLOSE)로 한 번에 호출.</text>
  </g>
</svg>
