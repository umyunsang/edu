<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="system-ui,sans-serif">
  <style>
    .ax{stroke:#333;stroke-width:1.2;fill:none}
    .ls{stroke:#2e86de;stroke-width:2.5;fill:none}
    .rs{stroke:#c0392b;stroke-width:2.5;fill:none}
    .inl{fill:#27ae60}
    .out{fill:#c0392b}
    .t{font-size:12px;text-anchor:middle}
    .tb{font-size:15px;font-weight:bold}
    .lab{font-size:13px}
  </style>
  <text class="tb" x="430" y="22" text-anchor="middle">Least Squares vs RANSAC: 이상치가 있을 때 무엇이 살아남는가</text>
  <text class="lab" x="30" y="44">대응점 중에는 매칭이 잘못된 이상치(outlier)가 섞인다. LS는 모두 반영 → 직선이 크게 비틀어짐. RANSAC은 무작위로 뽑아 가장 많은 inlier를 얻는 모델 선택.</text>

  <!-- Least Squares -->
  <g transform="translate(50,80)">
    <text class="tb" x="150" y="0" text-anchor="middle">Least Squares (모든 점 반영)</text>
    <g transform="translate(0,15)">
      <line class="ax" x1="0" y1="220" x2="320" y2="220"/>
      <line class="ax" x1="0" y1="0" x2="0" y2="220"/>
      <!-- inliers (green) along ideal line -->
      <circle class="inl" cx="30" cy="200" r="4"/>
      <circle class="inl" cx="60" cy="180" r="4"/>
      <circle class="inl" cx="90" cy="160" r="4"/>
      <circle class="inl" cx="120" cy="145" r="4"/>
      <circle class="inl" cx="150" cy="125" r="4"/>
      <circle class="inl" cx="180" cy="105" r="4"/>
      <circle class="inl" cx="210" cy="90" r="4"/>
      <circle class="inl" cx="240" cy="70" r="4"/>
      <circle class="inl" cx="270" cy="55" r="4"/>
      <!-- outliers (red) far from line -->
      <circle class="out" cx="70" cy="50" r="5"/>
      <circle class="out" cx="200" cy="200" r="5"/>
      <circle class="out" cx="260" cy="180" r="5"/>
      <!-- LS line: pulled toward outliers -->
      <line class="ls" x1="0" y1="200" x2="310" y2="100"/>
      <text class="t" x="160" y="240" fill="#2e86de" font-weight="bold">이상치가 직선을 당김 → 오차 큼</text>
    </g>
    <text class="lab" x="0" y="290">• 모든 점의 제곱오차 합을 최소화</text>
    <text class="lab" x="0" y="308">• 가우시안 잡음만 있다면 최적</text>
    <text class="lab" x="0" y="326" fill="#c0392b" font-weight="bold">• 이상치 몇 개만 있어도 크게 비틀어짐</text>
  </g>

  <!-- RANSAC -->
  <g transform="translate(470,80)">
    <text class="tb" x="150" y="0" text-anchor="middle">RANSAC (inlier가 많은 모델)</text>
    <g transform="translate(0,15)">
      <line class="ax" x1="0" y1="220" x2="320" y2="220"/>
      <line class="ax" x1="0" y1="0" x2="0" y2="220"/>
      <!-- same inliers -->
      <circle class="inl" cx="30" cy="200" r="4"/>
      <circle class="inl" cx="60" cy="180" r="4"/>
      <circle class="inl" cx="90" cy="160" r="4"/>
      <circle class="inl" cx="120" cy="145" r="4"/>
      <circle class="inl" cx="150" cy="125" r="4"/>
      <circle class="inl" cx="180" cy="105" r="4"/>
      <circle class="inl" cx="210" cy="90" r="4"/>
      <circle class="inl" cx="240" cy="70" r="4"/>
      <circle class="inl" cx="270" cy="55" r="4"/>
      <!-- same outliers -->
      <circle class="out" cx="70" cy="50" r="5"/>
      <circle class="out" cx="200" cy="200" r="5"/>
      <circle class="out" cx="260" cy="180" r="5"/>
      <!-- tolerance band around true line -->
      <line class="rs" x1="0" y1="215" x2="300" y2="40" stroke-dasharray="2 2" opacity="0.35"/>
      <line class="rs" x1="0" y1="205" x2="300" y2="30" stroke-dasharray="2 2" opacity="0.35"/>
      <!-- RANSAC true line -->
      <line class="rs" x1="0" y1="210" x2="300" y2="35"/>
      <text class="t" x="160" y="240" fill="#c0392b" font-weight="bold">inlier만 따라감 → 정확</text>
    </g>
    <text class="lab" x="0" y="290">• 무작위로 2점 추출 → 가설 직선</text>
    <text class="lab" x="0" y="308">• 허용 오차 내 inlier 수 센다</text>
    <text class="lab" x="0" y="326">• N번 반복 후 inlier 최다 모델 선택</text>
    <text class="lab" x="0" y="344" fill="#27ae60" font-weight="bold">• 이상치 무시 → 강건(robust)</text>
  </g>

  <!-- Summary -->
  <g transform="translate(30,400)">
    <rect x="0" y="0" width="800" height="70" fill="#fff7d6" stroke="#d4a017"/>
    <text class="tb" x="15" y="22">언제 무엇을 쓰나</text>
    <text class="lab" x="15" y="44">• 깨끗한 데이터 + 가우시안 잡음 → LS (빠름)</text>
    <text class="lab" x="15" y="62" fill="#c0392b" font-weight="bold">• 매칭에 틀린 쌍이 섞이는 호모그래피/F행렬 추정 → RANSAC 필수 (OpenCV: cv2.findHomography(..., cv2.RANSAC))</text>
  </g>
</svg>
