# 이 파일은 OpenKnowledge가 에이전트에게 폴더의 의미를 알려주는 가이드다.
# 사람은 Obsidian 폴더 트리를 보고, LLM은 이 설명을 본다.
# scripts/generate_folder_guides.py 로 생성됨 — 손으로 고쳐도 되지만 스크립트도 같이 갱신할 것.
title: "Computer Science & AI 커리큘럼"
description: "학부 전 과정의 강의 아카이브. 8개 분야 인터페이스 폴더 아래에 수업 폴더가 있고, 각 수업 폴더는 원본 강의자료(`pdf/`)와 그것을 근거로 쓴 정리문서(폴더 루트 `.md`)로 구성된다. 학년/학기는 폴더가 아니라 각 노트의 `semester` 프론트매터에 기록된다. 노트 작성 규격은 `docs/knowledge-schema.md` 를 따른다."
