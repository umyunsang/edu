title: Computer Science & AI 커리큘럼
description: "학부 전 과정의 강의 아카이브. 모든 과목은 프로젝트 루트의 lecture-note, course-index,
  practice-note 템플릿만 상속한다. 작성 규칙: (1) 기존 정리문서와 삭제된 Git 이력을 구조·문장 앵커로 쓰지 않고 현재
  sources PDF, 추출 텍스트, 실행 완료 노트북만 근거로 삼는다. (2) 원본 PDF 이미지, PDF 링크, 텍스트 페이지 인용은
  공개 노트에 넣지 않는다. (3) PDF의 실제 주제 순서·예시·절차·수치·오류를 빠짐없이 반영하며 형제 문서 간 일반
  문장·표·질문·시각자료 복제를 금지한다. (4) 장문 서술과 전면 개조식 모두 피하고 짧은 결론·핵심 불릿·공식 시각 컴포넌트를 조합한다.
  (5) 문서마다 관계·절차를 보여 주는 Mermaid 또는 동등한 구조 시각화가 있어야 한다. source에 수치·비율·범위가 있으면
  OpenKnowledge palette v1을 다시 호출해 공식 html preview starter를 반드시 사용한다: 동일 단위 2~5개
  비음수 비교는 chart, 축을 공유하지 않는 독립 지표는 stat-cards, 실제 part/whole은 custom-svg, 실제
  min/max/step/default가 있는 변수는 interactive-control. 어떤 gate도 통과하지 못하면 값을 발명하지 않고
  Mermaid·Tabs·표로 설명한다. (6) palette starter의 HTML node 순서와 개수, id, inline CSS,
  theme token, JS 제어 흐름을 보존하며 source-backed 표시문자와 data literal만 교체한다. 임의
  SVG·HTML·CSS·JS, 외부 fetch, 하드코딩 색상, 장식용 시각화는 금지한다. (7) 같은 사실을 산문·표·시각화에 반복하지
  않는다. 시각화는 새로운 관계·비교·조절 정보를 전달해야 한다. (8) Callout은 오류·위험·핵심 경계, Accordion은 선택적
  심화, Math는 원문에 실제 수식이 있을 때만 사용한다. (9) 위키링크, Dataview, 계층 태그를 쓰지 않고 문서 링크는 표준
  Markdown 상대 링크만 사용한다. (10) 원본 오류는 조용히 고치지 않고 warning에 명시한다. (11) 모든 강의·실습·인덱스
  문서는 slides: true를 유지한다. OpenKnowledge write 경고·lint·audit, Mermaid parse, 미치환
  placeholder 검사, Slidev CLI build/export와 unresolved component 경고가 모두 깨끗해야 한다.
  브라우저·preview URL·DOM·스크린샷 검증은 하지 않는다. (12) 관계 타입 부여는 전체 재작성 완료 뒤 별도 단계에서
  수행한다."
