title: Computer Science & AI 커리큘럼
description: "학부 전 과정의 강의 아카이브. 모든 과목은 프로젝트 루트의 lecture-note, course-index,
  practice-note 템플릿을 상속한다. 작성 규칙: (1) 기존 정리문서와 삭제된 Git 이력을 구조·문장 앵커로 쓰지 않고 현재
  sources PDF, 추출 텍스트, 실행 완료 노트북만 근거로 삼는다. (2) 원본 PDF 이미지, PDF 링크, 텍스트 페이지 인용은
  공개 노트에 넣지 않는다. (3) PDF의 실제 주제 순서·예시·절차·수치·오류를 빠짐없이 반영하며, 형제 문서 간 일반
  문장·표·질문·시각자료 복제를 금지한다. (4) 장문 서술과 전면 개조식 모두 피하고, 짧은 결론·핵심 불릿·공식 시각 컴포넌트를 정보
  형태에 맞게 조합한다. (5) 관계·순서는 Mermaid, 비교는 Tabs 또는 표, 수치는 palette의 chart/stat-cards,
  매개변수 효과는 interactive-control, 선택적 심화는 Accordion, 오류·위험은 Callout, 원문 수식만 Math로
  표현한다. (6) palette starter의 DOM·CSS·JS 구조와 theme token을 보존하며 임의
  SVG·HTML·CSS·JS를 만들지 않는다. 근거 없는 수치나 장식용 시각화도 금지한다. (7) 위키링크, Dataview, 계층 태그를
  쓰지 않고 문서 링크는 표준 Markdown 상대 링크만 사용한다. (8) 원본 오류는 조용히 고치지 않고 warning에 명시한다. (9)
  모든 강의·실습·인덱스 문서는 slides: true를 유지한다. OpenKnowledge write 경고·lint·audit과 Slidev
  CLI build/export가 모두 깨끗해야 하며, unresolved component 경고도 실패로 본다. (10) 관계 타입 부여는
  전체 재작성 완료 뒤 별도 단계에서 수행한다."
